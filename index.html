11:{bridge:{back:"Sinai gave a rescued people a constitution. Now they have to live in a land with it.",
 fwd:"Next: the book's own answer to its closing refrain — Israel asks for a king."},
 sections:[
 {at:2,h:"Rahab and Achan, placed against each other",p:[
  "Joshua 2 and Joshua 7 are designed to be read together, and the pairing is the book's clearest statement about what the conquest is and is not.",
  "Rahab is a Canaanite, a woman, and a prostitute — three strikes in that society. She hides the spies, and her speech in 2:9–11 is a fuller confession of faith than anything the Israelite spies manage: the LORD your God, he is God in the heavens above and on the earth beneath. She and her whole household are spared, her scarlet cord hangs from the wall, and Matthew 1 puts her in the genealogy of Jesus.",
  "Achan is an Israelite, a man, from the tribe of Judah, and he takes what was devoted. He and his household are destroyed.",
  "The categories are inverted on purpose. If the conquest were about ethnicity, the Canaanite would die and the Israelite would live. Instead the outsider who turns toward this God is brought inside, and the insider who takes what is not his is put outside. Whatever else these narratives are, they are not a racial programme, and the book goes out of its way to say so."]},
 {at:5,h:"Deborah, Gideon, and the shape of a deliverer",p:[
  "The judges are chosen in a way that repeatedly embarrasses the categories a nation would use.",
  "Deborah is a prophet and judge, and Israel comes up to her for judgement. Barak will not go to battle without her. The victory is credited to Jael, a foreign woman with a tent peg, and the song of Judges 5 — with Judges 4 among the oldest Hebrew poetry we have — is sung by Deborah.",
  "Gideon is threshing wheat in a winepress, hiding from raiders, and is addressed as mighty man of valour, which is either irony or prophecy. He asks for signs three times. God reduces his army from thirty-two thousand to three hundred, stating the reason explicitly: lest Israel boast, my own hand has saved me. The instruments of victory are trumpets, jars and torches. And then Gideon, having refused kingship in the right words, makes an ephod from the plunder that becomes a snare, and his son Abimelech murders seventy brothers to seize the crown anyway.",
  "The pattern is consistent: God works through the small, the reluctant and the compromised, and the narrator never pretends the instruments were worthy. Judges is not a gallery of heroes. It is a book about a God who keeps intervening for people who keep not deserving it, which is why Hebrews 11 can list these men without embarrassment — they are commended for faith, not for character."]}],

 {o:"אֵפוֹד",tr:"ephod",lang:"he",gl:"priestly garment",n:"Gideon makes one from plunder and it becomes a snare — right object, wrong hands, wrong place."},

12:{bridge:{back:"Judges ended with everyone doing what was right in his own eyes, and an argument for a king.",
 fwd:"Next: the king's son builds a house for God, and the presence moves in."},
 sections:[
 {at:2,h:"Hannah's song, and the shape of the whole book",p:[
  "1 Samuel opens not with politics but with a childless woman praying so intensely that the priest assumes she is drunk. Her song in chapter 2, once the child is given, sets the theological agenda for everything that follows: the bows of the mighty are broken, the feeble bind on strength, the barren has borne seven, he raises the poor from the dust and seats them with princes.",
  "That is the pattern the books of Samuel then execute. The priesthood of Eli falls; a boy hears in the night. Saul, head and shoulders above everyone, is rejected; the youngest son, left with the sheep, is chosen. The giant falls to a stone. Hannah's song is the thesis; the narrative is the demonstration.",
  "And Mary's Magnificat in Luke 1 is built on it — he has brought down the mighty from their thrones and exalted those of humble estate, he has filled the hungry with good things. Two women, a thousand years apart, sing the same song at the arrival of a son who will change the order of things. Luke expects you to hear the echo."]},
 {at:5,h:"Why Saul is rejected, and why it seems harsh",p:[
  "Modern readers usually find Saul's rejection disproportionate. He offers a sacrifice when Samuel is late; he spares a king and some livestock. It looks like a technicality.",
  "The narrative is making a different point. In 1 Samuel 13 Saul is under military pressure and Samuel has not arrived; he takes the priestly role himself. In chapter 15 he is told to devote Amalek entirely and instead keeps the best of the flock and the king alive, then builds a monument to himself, then tells Samuel he has performed the commandment, then blames the people. Samuel's reply is the theological centre: to obey is better than sacrifice, and to listen than the fat of rams.",
  "The issue is not the size of the infraction but the pattern: a king who decides which parts of the instruction apply to him is precisely the king Deuteronomy 17 was written to prevent. And in both scenes Saul's stated reason is fear of the people. He is a king governed by his approval rating, which is the failure mode the office was designed to resist.",
  {aside:{t:"Saul is treated with real pity",p:"The narrative is not cruel to him. It records the Spirit rushing on him, his early modesty, his genuine victories, his torment, and David's repeated refusal to lift a hand against him. When he dies, David composes a lament calling him beloved and lovely, and instructs Judah to be taught it. The rejection of Saul's kingship is not a verdict on Saul's worth, and the text takes care that you feel the difference."}}]}],

 {o:"חַנָּה",tr:"Hannah",lang:"he",gl:"Hannah — grace, favour",n:"From chanan. Her song sets the theological agenda that Samuel then narrates and Mary later reuses."},
 {o:"שָׁמַע",tr:"shama",lang:"he",gl:"to hear, and so to obey",n:"One verb for both. Samuel's name means God has heard; his rebuke of Saul turns on listening."},
 {o:"נָגִיד",tr:"nagid",lang:"he",gl:"designated leader, prince",n:"Used of Saul and David before they reign — leadership as appointment, avoiding the word king."},
 {o:"מָשַׁח",tr:"mashach",lang:"he",gl:"to anoint, smear with oil",n:"The verb behind mashiach. Oil marks a person as set apart for an office, not as morally superior.",parse:"Qal perfect, 3ms — the act is completed and public."},
 {o:"רוּחַ יְהוָה",tr:"ruach YHWH",lang:"he",gl:"the Spirit of the LORD",n:"Rushes on judges and kings for tasks in the Old Testament, and departs. Pentecost changes the arrangement."}],

13:{bridge:{back:"David was promised a house. Solomon builds one, and the glory fills it.",
 fwd:"Next: what happened inside that building week by week — the musicians, the psalms and the liturgy."},
 sections:[
 {at:3,h:"The furniture, and what each piece taught",p:[
  "Every object in the sanctuary carried instruction, and knowing them turns Hebrews from an abstract argument into a walk through a building.",
  "In the courtyard, the bronze altar: nothing proceeds without sacrifice. Then the bronze basin, made — a striking detail in Exodus 38:8 — from the polished mirrors of the women who served at the entrance: you cannot approach without washing.",
  "Inside the holy place, three objects. The מְנוֹרָה (menorah), a lampstand hammered from a single talent of gold, shaped as an almond tree with branches, buds and blossoms — a tree of light in a room with no windows. The table of the bread of the Presence, twelve loaves, replaced weekly, eaten by the priests: God feeds his people and eats with them. The altar of incense, standing directly before the veil, its smoke rising continually — which is why Revelation 5:8 can describe the prayers of the saints as incense.",
  "And behind the veil, the ark: a box containing the tablets, a jar of manna and Aaron's staff — the covenant, the provision and the disputed authority — with the kapporet as its lid and two cherubim above. God is described as enthroned between the cherubim. His throne rests on a lid, under which lie the evidences of Israel's rebellion, and once a year blood is applied to the space between."]},
 {at:7,h:"Two temples and a wall",p:[
  "The building Jesus walked in was not Solomon's. Solomon's temple stood from about 960 to 586 BC. The second temple, completed in 516 BC, was modest enough that men who remembered the first one wept. Herod the Great began a vast expansion around 19 BC, and the work was still unfinished when it was destroyed in AD 70 — which is what the disciples are gawping at in Mark 13 when they say, look, what wonderful stones.",
  "Herod's platform was enormous, roughly thirty-five acres, and it was organised as a series of courts with signs in Greek and Latin warning Gentiles not to proceed past a certain barrier on pain of death. Two of those inscriptions have been found. The graded holiness of the tabernacle had become a graded social order in stone: Gentiles, then women, then Israelite men, then priests, then the high priest.",
  "Which is what makes Ephesians 2:14 concrete rather than poetic. Paul says Christ has broken down the dividing wall of hostility, making the two into one new humanity. His readers knew exactly which wall, and had seen the sign.",
  {aside:{t:"The cleansing, reconsidered",p:"Jesus overturns tables in the court of the Gentiles — the only space where a non-Jew could pray — and quotes Isaiah 56:7: my house shall be called a house of prayer for all nations. Most English readers stop at house of prayer. The phrase he actually presses is for all nations, and he is standing in the part of the complex where the nations were supposed to be praying, which had been turned into a market."}}]}],

 {o:"פָּרֹכֶת",tr:"paroket",lang:"he",gl:"the veil",n:"Woven with cherubim, as at Eden's gate. The gospels specify it tore from the top."},

14:{bridge:{back:"The temple was built and filled. This is what happened inside it, week by week.",
 fwd:"Next: the prophets arrive and tell the people that the music has become noise."},
 sections:[
 {at:3,h:"What the instruments actually were",p:[
  "Israel's worship was loud, physical and instrumentally specific, and the vocabulary is worth knowing because English collapses it.",
  "The כִּנּוֹר (kinnor) is a lyre — David's instrument, portable, played with the fingers or a plectrum, the sound of the court and the shepherd's field. The נֵבֶל (nevel) is a larger harp with a resonating body, deeper and louder. The תֹּף (toph) is a hand drum or frame drum, and it is almost always in the hands of women in Scripture — Miriam, Jephthah's daughter, the women greeting Saul and David.",
  "Two horns are distinct. The שׁוֹפָר (shofar) is a ram's horn, unpitched, used for signals, alarms, coronations and the new year — a sound rather than a melody. The חֲצֹצְרָה (chatsotserah) is a straight silver trumpet, made in pairs to God's specification in Numbers 10, blown by priests for assembly and for war.",
  "And cymbals: 1 Chronicles 15 distinguishes bronze cymbals from מְצִלְתַּיִם (metziltayim) that are loud-sounding. 2 Chronicles 5 describes 120 priests sounding trumpets in unison with singers and cymbals — and it is when they are as one, to make one sound, that the glory fills the house so the priests cannot stand.",
  {aside:{t:"The detail worth carrying",p:"2 Chronicles 5:13 does not say the glory came when the music was excellent, or loud, or long. It says it came when the trumpeters and singers were as one, to make one sound. Unity is the stated condition. That is a harder standard than musicianship and a more useful one to aim a rehearsal at."}}]},
 {at:6,h:"Worship as sacrifice, and the language that carries over",p:[
  "The New Testament almost never uses the word worship for what happens in a Christian meeting. προσκυνέω (proskyneō) — to prostrate, literally to kiss toward — is used of falling before God or Christ, and of the future. λατρεία (latreia) is priestly service, and Romans 12:1 applies it to presenting your bodies as a living sacrifice, calling that your reasonable λογικὴν λατρείαν, your rational worship.",
  "The effect is a deliberate widening. Sacrifice language is transferred from an altar to a life: bodies presented, praise as the fruit of lips, doing good and sharing as sacrifices pleasing to God, Paul describing himself as being poured out as a drink offering. A whole sacrificial vocabulary is redirected away from a building and onto ordinary conduct.",
  "This does not empty the gathering of significance — Hebrews 10:25 is explicit about not neglecting to meet, and 1 Corinthians 11–14 assumes a real assembly with real order. But it settles a question worth settling: the meeting is not where worship happens and the week is not where it stops. The meeting is where a worshipping people rehearse, together and out loud, what they are doing with the rest of their time."]}],

 {o:"שׁוֹפָר",tr:"shofar",lang:"he",gl:"ram's horn",n:"Unpitched. A signal rather than a melody: alarm, coronation, new year, jubilee."},
 {o:"תֹּף",tr:"toph",lang:"he",gl:"hand drum, frame drum",n:"Almost always in women's hands in Scripture — Miriam at the sea, and the women who greet Saul and David."},
 {o:"מְצִלְתַּיִם",tr:"metziltayim",lang:"he",gl:"loud-sounding cymbals",n:"1 Chronicles 15 distinguishes them from bronze cymbals. Israel's worship was not quiet."},
 {o:"προσκυνέω",tr:"proskyneō",lang:"gk",gl:"to prostrate, to kiss toward",n:"Bodily submission before a superior. Rarely used of a Christian meeting; often of falling before Christ."},

  cols:[{h:"Strings",s:"melody and accompaniment",items:["kinnor — lyre, portable, David's","nevel — larger harp, deeper, louder","Played by trained Levites in courses","zamar, to make music, comes from this world"]},

15:{bridge:{back:"Israel had a temple, a liturgy and a professional music department. The prophets are not impressed.",
 fwd:"Next: the indictment lands. The city falls, and faith has to be rebuilt without a building."},
 sections:[
 {at:3,h:"Enacted prophecy — the sign that costs the prophet",p:[
  "Prophets did not only speak. They performed, and the performances were frequently humiliating and always expensive.",
  "Isaiah walked stripped and barefoot for three years as a sign against trusting Egypt. Jeremiah wore a yoke through Jerusalem, smashed a clay jar in the Valley of Hinnom, bought a field while the Babylonian army was besieging the city, and was forbidden to marry or attend funerals — his private life confiscated as a public sign. Ezekiel lay on his side for over a year, cooked over dung, shaved his head with a sword and divided the hair, and when his wife died was told not to mourn, because Israel would soon be unable to mourn either. Hosea was told to marry Gomer and then to go and buy her back.",
  "The pattern says something important about how God communicates. The message is not delivered from a safe distance; it is absorbed into a body and then displayed. The prophet becomes the sermon, and the cost to him is part of the content. Hosea does not merely announce that God's love survives betrayal — he is made to live it, and only then does he have anything to say.",
  "This is also why prophetic ministry cannot be reduced to accurate prediction. The prophets are not information services. They are people who have been made to feel what God feels about a situation and cannot then keep quiet — which is Abraham Heschel's central insight about them, and why he called it the divine pathos."]},
 {at:7,h:"Elijah, Elisha and the northern crisis",p:[
  "The northern kingdom's story is dominated by two prophets who leave almost no writing and enormous footprints.",
  "Elijah confronts Ahab and Jezebel, who have made Baal worship official policy. Baal is the storm god, responsible for rain and fertility, so Elijah announces a drought — attacking the deity at his single point of competence. The contest on Carmel is a controlled experiment: two altars, one question, you call and I will call, and the god who answers by fire is God. Then rain returns, and Elijah, having won comprehensively, collapses under a broom tree and asks to die.",
  "What follows is one of the most pastorally striking passages in Scripture. God's response to a suicidal prophet is not rebuke or a lecture. It is sleep, food, sleep again, more food, then a journey, then a question — what are you doing here — and then wind, earthquake and fire, in none of which God is, followed by קוֹל דְּמָמָה דַקָּה (qol demamah daqqah), a sound of thin silence. Then the same question again, and a job to do, and the information that seven thousand others have not bowed. Rest, food, presence, honest speech and a task, in that order.",
  "Elisha then receives a double portion — the firstborn's inheritance, not twice the power — and his ministry is markedly domestic: flour in a poisoned pot, oil that fills borrowed jars, a floating axe head, a foreign general healed in a river. Elijah confronts the state; Elisha attends to households. Both are prophecy."]}],
 words:[
 {o:"קוֹל דְּמָמָה דַקָּה",tr:"qol demamah daqqah",lang:"he",gl:"a sound of thin silence",n:"1 Kings 19:12. Often rendered still small voice; the Hebrew is stranger and quieter than that."},

16:{bridge:{back:"The lawsuit was pressed for three centuries. In 586 BC the verdict is executed.",
 fwd:"Phase 4 turns to the songbook that carried Israel through all of it — and through this.",},
 sections:[
 {at:2,h:"Three deportations, and what it was like",p:[
  "Exile was not one event. Babylon took Jerusalem in stages: in 605 BC the nobility and promising youths, including Daniel; in 597 the king Jehoiachin, the craftsmen and the soldiers, including Ezekiel; and in 586 the city, the temple and the remainder, with Zedekiah blinded after watching his sons killed — the last thing he saw.",
  "Life in Babylon was not slavery. Jeremiah 29 tells the exiles to build houses, plant gardens, marry, have children and seek the welfare of the city — because they will be there seventy years. Archaeological records from Nippur show Judean names in business documents, holding land and trading. Some prospered. That is its own kind of crisis: the danger was not persecution but assimilation, and the generation born there had never seen Jerusalem.",
  "Daniel is the manual for that situation. He learns Babylonian literature, takes a Babylonian name, serves in the administration of three regimes — and draws lines: over food, over prayer, over worship. The book is not about avoiding the culture but about knowing which few things cannot be conceded, and being willing to lose everything on those. Every generation of exiles has to work out where its own lines fall, and Daniel models the process rather than supplying the list."]},
 {at:6,h:"What returned, and what did not",p:[
  "It is worth being precise about the disappointment, because the Old Testament is.",
  "The temple returned, smaller. The city walls returned, after resistance. The law returned, read publicly by Ezra with interpreters so the people could understand — Nehemiah 8 describes something very like a modern sermon, and the people weep. The priesthood returned. The festivals returned; they kept Booths as it had not been kept since Joshua's day.",
  "What did not return: the king, the ark, the visible glory, and independence. No text ever says the glory filled the second temple. The ark simply disappears from the record. There is a governor, not a son of David, and Persia's taxes still have to be paid. Malachi's generation is marrying outside the covenant, withholding tithes, offering blind and lame animals, and saying it is vain to serve God.",
  "So the Old Testament ends genuinely unfinished, and honest about it. The promises had been partially kept in a way that made the remainder more conspicuous, not less. That is the emotional situation four centuries later when a man in the wilderness starts baptising and the crowds come out to ask whether he is Elijah.",
  {aside:{t:"Why this matters for lament",p:"The return is the biblical model for a prayer answered partially. Israel does not conclude that God failed, nor pretend the small temple is the glorious one. They build it, weep at it, keep going, and keep expecting. That posture — grateful, unsatisfied and still waiting — is one most congregations need permission for, and it is in the text."}}]}],

17:{bridge:{back:"Israel came through conquest, monarchy and exile. The Psalter is what they sang through all of it.",
 fwd:"Next: the individual genres, so you can tell what kind of psalm you are holding."},
 sections:[
 {at:3,h:"How a psalm was actually used",p:[
  "The Psalms were not a devotional anthology. They were the working repertoire of a functioning temple, and several distinct uses are visible in the text itself.",
  "Some were processional, sung while moving: Psalm 24's gates lifting their heads, Psalm 68's procession into the sanctuary, the ascents sung on the road up. Some were antiphonal, requiring two parties: Psalm 136's twenty-six-fold refrain, Psalm 24's question and answer at the gate, Psalm 118's repeated let Israel say. Some were royal liturgy for coronations and royal weddings. Some accompanied specific sacrifices — Psalm 51's closing verses mention the altar directly.",
  "The Mishnah records a daily psalm for each day of the week in the second temple, and the Septuagint headings preserve some of them: Sunday Psalm 24, Monday 48, Tuesday 82, Wednesday 94, Thursday 81, Friday 93, and the sabbath Psalm 92, whose Hebrew heading already says a song for the sabbath day. A worshipper in Jerusalem knew what would be sung on a Tuesday.",
  "And the Hallel, Psalms 113 to 118, was sung at the great festivals. At Passover the first part came before the meal and the second after — which means the hymn Jesus and the disciples sing before going out to the Mount of Olives in Mark 14:26 is almost certainly the second half of the Hallel, ending with Psalm 118: the stone the builders rejected has become the cornerstone, and the LORD's steadfast love endures forever. He sang that on the way to Gethsemane."]},
 {at:6,h:"The Psalms in the New Testament",p:[
  "The Psalter is quoted more often in the New Testament than any other book, and the pattern of use is instructive.",
  "Psalm 110 is the single most quoted text in the New Testament — the LORD said to my Lord, sit at my right hand — used for the ascension, the session and the priesthood after Melchizedek. Psalm 2 supplies the sonship language at the baptism and transfiguration. Psalm 22 supplies the cry of dereliction, the divided garments and the pierced hands. Psalm 118 supplies the crowd's shout at the entry and the rejected cornerstone. Psalm 16 is preached by Peter at Pentecost as evidence of resurrection. Psalm 8 is applied to Christ in Hebrews 2.",
  "Two things follow. First, the earliest Christians read the Psalms Christologically as a matter of course, and they did it in public, arguing from texts their hearers knew. Second, they used the Psalms as prayer — Acts 4 has the church under threat praying Psalm 2 aloud together and then asking for boldness. The songbook was not only evidence; it was the language they reached for when frightened.",
  {aside:{t:"For anyone choosing songs",p:"If the Psalter is the New Testament's most quoted book, and if the church prayed it under pressure, then a congregation that never sings or prays a psalm is disconnected from the way the first Christians used Scripture. This is not an argument for exclusive psalmody. It is an argument that psalms should be in the rotation, in some form, more often than most churches manage."}}]}],

18:{bridge:{back:"Lesson 17 showed the book has a shape. This shows the individual pieces have shapes too.",
 fwd:"Next: the machinery of Hebrew poetry itself, and the covenant word that recurs more than any other."},
 sections:[
 {at:3,h:"The seven penitential psalms, and Psalm 51",p:[
  "The church has traditionally grouped seven psalms as penitential: 6, 32, 38, 51, 102, 130 and 143. They are worth knowing as a set, because a congregation with no vocabulary for confession will invent a worse one.",
  "Psalm 51 is the model, and its structure repays attention. It opens not with the sin but with the character of God — according to your hesed, according to your abundant mercy. The appeal is to who God is before the problem is named. Then three words for wrong in successive lines: פֶּשַׁע (pesha), rebellion, a deliberate breach of relationship; עָוֹן (avon), iniquity, crookedness or twistedness; חַטָּאת (chatat), sin, missing the mark. Three angles on one act.",
  "Then three verbs for what is needed: blot out, as from a ledger; wash thoroughly, the word used for trampling laundry; and cleanse, a ritual term. Ledger, laundry and liturgy — the debt, the stain and the status.",
  "Then the theological centre: against you, you only, have I sinned. David has committed adultery and arranged a killing; the claim is not that Bathsheba and Uriah were unharmed but that sin is finally a matter between the sinner and God. And then the requests move from forgiveness to renewal — create in me a clean heart, using בָּרָא (bara), the verb reserved for God's creating — and finally outward: then I will teach transgressors your ways.",
  "Note the ending. The psalm does not conclude with restored private peace. It concludes with teaching others, with sacrifices offered in a rebuilt Zion, and with a broken spirit named as the sacrifice God will not despise."]},
 {at:7,h:"Where to send a person in a given week",p:[
  "One of the most practical things a leader can carry is a short mental index of which psalm fits which condition — not to prescribe, but to have something to hand.",
  "For guilt: 32, 51, 130. For fear: 27, 46, 91. For exhaustion and burnout: 23, 62, 131. For injustice, when the wicked prosper: 37, 73, 94. For grief with no resolution in sight: 88, and only 88. For loneliness or abandonment: 22, 42, 142. For gratitude that needs words: 103, 116, 138. For awe: 8, 19, 29, 104. For confusion about providence: 73 above all — the psalm of a man who nearly lost his faith over the prosperity of the corrupt and says so in the first person.",
  "Psalm 73 deserves a note. It opens with the orthodox conclusion — truly God is good to Israel — and then immediately admits that the speaker's feet had almost slipped, and spends fourteen verses describing how well the arrogant are doing. The turn comes not from an argument but from a location: until I went into the sanctuary of God; then I discerned their end. And it closes with one of the highest lines in the Old Testament: whom have I in heaven but you? There is nothing on earth that I desire besides you.",
  "That is the movement worth teaching. Not the suppression of the complaint, but the complaint carried into the presence of God and reframed there."]}],

19:{bridge:{back:"You can now identify a psalm's type. This is the machinery all of them are built with.",
 fwd:"Next: the other wisdom voices — the two books that argue with Proverbs, and are kept anyway."},
 sections:[
 {at:3,h:"Hebrew rhythm, and why translations differ so much",p:[
  "Hebrew poetry does have rhythm, but it counts stresses rather than syllables, and only loosely. Lines commonly fall into 3+3 for general poetry, or 3+2 — the limping qinah metre — for laments, where the second half of the line is deliberately short and the sentence seems to stumble.",
  "You cannot hear this in English, which is one reason translations of poetry diverge so widely. A formal translation preserves word order and loses the compression; a functional one preserves the sense and loses the shape. Neither can carry the sound.",
  "Two other features are invisible in translation. Assonance and wordplay are everywhere: Isaiah 5:7 expects מִשְׁפָּט (mishpat), justice, and finds מִשְׂפָּח (mispach), bloodshed; expects צְדָקָה (tsedaqah), righteousness, and finds צְעָקָה (tse'aqah), an outcry. Two pairs of near-identical sounds carrying opposite meanings — a pun with a body count. And terseness: Hebrew poetry omits definite articles, relative pronouns and connectives that prose requires, so a line that runs to fourteen English words may be four in Hebrew. The compression is part of the effect, and English almost always dilutes it.",
  {aside:{t:"What to do about it",p:"Read a poetic passage in two translations side by side and notice where they diverge most. Those points are usually where the Hebrew is compressed, ambiguous, or doing something with sound. You will not recover the sound, but you will know where the interesting ground is — and that is most of the benefit."}}]},
 {at:7,h:"Metaphor for God, including the ones we skip",p:[
  "Scripture's imagery for God is far wider than most congregational song, and the range is itself theological — no single image is allowed to become the definition.",
  "The familiar ones: king, father, shepherd, rock, fortress, shield, judge, warrior, potter, husband, light, water, bread, vine-keeper.",
  "The less familiar, which are equally in the text: a woman in labour, crying out and gasping, in Isaiah 42:14. A nursing mother who cannot forget her child, in Isaiah 49:15. A midwife in Psalm 22:9. A mother bear robbed of her cubs, in Hosea 13:8. A moth and dry rot, in Hosea 5:12 — God as slow decay, working invisibly through a nation. A lion tearing prey. A hen gathering chicks, in the mouth of Jesus himself over Jerusalem.",
  "Three things follow. First, no metaphor is the thing itself; each is chosen to say something specific in a specific situation, and pressing any of them into a system produces nonsense. Second, the range includes maternal imagery, and a repertoire that never uses it is narrower than the Bible. Third, the disturbing images — moth, dry rot, bear — are doing real work: they describe experiences of God that a congregation may be having and cannot name because nothing they sing acknowledges the possibility.",
  "This is where poetry earns its place in Scripture. Propositions can tell you God is faithful. Only an image can tell you what it is like when he seems to be dismantling you slowly, and that someone has been there before and put it in the songbook."]}],

20:{bridge:{back:"The Psalms taught you to speak to God. Wisdom teaches you to live in the world he made.",
 fwd:"Phase 5: four centuries pass, and the story's central figure arrives in a world you now know."},
 sections:[
 {at:2,h:"Lady Wisdom, and the shape of Proverbs",p:[
  "Proverbs is not a random collection. Chapters 1 to 9 are an extended prologue — a father's speeches to a son, and two competing invitations. Chapters 10 to 31 are the collected sayings the prologue has taught you how to read.",
  "The prologue personifies wisdom as a woman, חָכְמוֹת (chokmot), who calls aloud in the street, at the busiest corner, at the city gates. She is not hiding in a library. And she is set against a rival, Folly, who also calls from her doorway and offers stolen water and secret bread. The book presents life as two women shouting from two doorways, and the whole of chapters 10 onward as the daily consequences of which invitation you accept.",
  "Proverbs 8 then does something extraordinary. Wisdom claims to have been there before the world: brought forth before the hills, beside him as a master workman, daily his delight, rejoicing in his inhabited world and delighting in the children of men. The word for rejoicing has the sense of play. Wisdom is not a grim ledger of good conduct; it is described as the delight God took in ordering the world, offered to creatures.",
  "And the book ends with a woman too — the אֵשֶׁת־חַיִל (eshet chayil), the woman of valour, in an acrostic through the alphabet. The vocabulary is martial: chayil is the word for an army's strength. She buys fields, trades, manufactures, gives to the poor, and speaks with the torah of kindness on her tongue. Wisdom opens as a woman calling in the street and closes as a woman running a household economy. The frame is deliberate."]},
 {at:6,h:"Ecclesiastes, and Song of Songs, and what wisdom refuses to do",p:[
  "Qohelet's method is worth naming precisely, because he is doing something no other biblical writer does. He conducts experiments. I said in my heart, come now, I will test you with pleasure — and he builds houses, plants vineyards, gathers silver, acquires singers, denies himself nothing, and reports the results. It is empirical theology, conducted from inside, and the finding is repeated: everything under the sun evaporates.",
  "But the conclusion is not nihilism, and reading it as such misses the refrain. Seven times he returns to the same counsel: eat your bread, drink your wine, enjoy your work and the person you love, for this is your portion and it is from the hand of God. The word חֵלֶק (cheleq), portion, is the same word used for an allotted inheritance in the land. Ordinary pleasure is not a consolation prize; it is an assigned share.",
  "The Song of Songs belongs to this literature too, and is worth naming because it is the book most often skipped. It is unembarrassed love poetry between two people, largely in the woman's voice, with no explicit theology and no mention of God by name. Its presence in the canon says something wisdom keeps insisting: the world is good, bodies are good, desire is good in its place, and a faith that cannot say so has drifted from its own Scriptures.",
  {aside:{t:"What the three books do together",p:"Proverbs teaches you the grain of the world. Job stops you concluding that the grain is a formula and God is bound by it. Ecclesiastes stops you concluding that you can see enough to run the whole calculation. And the Song stops you concluding that any of this makes the ordinary world less good. Held together they produce something rare: a faith that is confident, honest about limits, and still capable of enjoying a meal."}}]}],

21:{bridge:{back:"The songbook and the wisdom books were an interlude; the timeline resumes here. Lesson 16 left Malachi promising an Elijah. Four centuries later, someone dressed like him appears.",
 fwd:"Next: four accounts of what happened, and why keeping all four was the honest decision."},
 sections:[
 {at:2,h:"Living under Rome, in numbers",p:[
  "Abstractions about oppression mean little. Some specifics make the Gospels legible.",
  "Taxation ran at perhaps a third or more of production once Roman tribute, the temple tax, tithes and local levies were combined. Tax collectors bought the right to collect and profited from the excess, which is why they are grouped with sinners as a matter of course and why Zacchaeus's fourfold restitution is a financially ruinous promise.",
  "Land ownership was concentrating. Small farmers borrowed against harvests, defaulted, and became tenants or day labourers on land their families had held. The parable of the vineyard tenants, the labourers waiting in the marketplace at the eleventh hour, and the manager forgiving portions of debts all assume this economy — and so does the jubilee language Jesus reads at Nazareth.",
  "Crucifixion was routine and public. After a revolt in 4 BC, around the time of Jesus's birth, the Roman general Varus is reported to have crucified two thousand people around Jerusalem. Galilean villagers would have seen crosses. When Jesus says take up your cross, nobody heard a metaphor about minor inconvenience.",
  "And the population of Jerusalem swelled enormously at Passover — estimates vary widely, but a city of a few tens of thousands hosted many times its usual population. Rome reinforced the garrison and the governor came up from Caesarea specifically for the festival. Passover week was the most volatile period of the year, which is exactly when a man rode in on a donkey while crowds shouted about the son of David."]},
 {at:5,h:"What they were reading, and how they were reading it",p:[
  "First-century Jewish interpretation had recognisable methods, and knowing them explains arguments in the Gospels that otherwise look arbitrary.",
  "Targums were Aramaic paraphrases read aloud after the Hebrew, since most people no longer understood Hebrew — interpretation was built into the reading. Midrash was the practice of drawing out meaning, often by linking passages that shared a word. Pesher, visible at Qumran, applied prophetic texts directly to the community's own situation: this is that.",
  "One rabbinic technique matters especially. Gezerah shavah links two texts that share a distinctive phrase and reads them together. When Jesus is challenged about David eating the bread of the Presence, or when Paul chains together quotations that share vocabulary, this is the method. It is not proof-texting; it is the accepted exegetical grammar of the period, and the argument would have been recognised as competent rather than eccentric.",
  "This also explains why Jesus's opponents are so often not stupid. The dispute about handwashing, about corban, about divorce, about the sabbath — these are technical arguments between people who share a text and a method, conducted at speed, in public, with an audience judging. Reading them as clever man versus fools misses that they are arguments, and that Jesus wins them on his opponents' own terms.",
  {aside:{t:"Why this reframes the sabbath controversies",p:"Jesus is not dismissing the sabbath. He argues from David and the showbread, from priests working in the temple, from circumcision on the eighth day, from pulling an ox out of a pit — every one a recognised legal argument. His claim is not that the law does not matter but that he has authority to say what it means, which is a far larger claim and precisely why it provoked what it did."}}]}],

 {o:"מִדְרָשׁ",tr:"midrash",lang:"he",gl:"searching out, interpretation",n:"From darash, to seek. The practice of drawing meaning out of a text, often by linking shared words."},

22:{bridge:{back:"You now know the room. These are the four accounts of what happened in it.",
 fwd:"Next: the message itself — the kingdom, and the strange teaching form chosen to carry it."},
 sections:[
 {at:3,h:"Why the differences are evidence, not embarrassment",p:[
  "Take one scene: the healing of blind men near Jericho. Mark names one man, Bartimaeus, and places it as Jesus leaves Jericho. Matthew has two men. Luke places it as Jesus approaches. Sceptics list this as a contradiction; harmonisers propose two Jerichos or two separate incidents.",
  "The more useful observation is that this is what independent testimony looks like. Real witnesses to the same event differ on peripheral detail and agree on the substance — a blind beggar, calling him Son of David, told to be quiet, calling louder, healed, and following on the road. Testimony that agreed on every detail would suggest collusion, and courts treat it that way.",
  "Richard Bauckham's work adds a striking observation about names. The Gospels name some minor characters and leave others anonymous, and the pattern is not random: those named are disproportionately people who would have been alive in the early church and locatable — Bartimaeus, Simon of Cyrene and his sons Alexander and Rufus, Jairus, Mary Magdalene, Cleopas. Mark tells you Simon's sons' names for no narrative reason whatever, which makes most sense if the audience could ask them. And the frequency distribution of Jewish personal names in the Gospels closely matches that of Palestinian Jewish names from inscriptions and ossuaries in the period — a pattern a later writer in another region would have found nearly impossible to fake.",
  "None of this proves anything on its own. It does mean the differences and the details are the sort of thing eyewitness material produces, and that flattening them into a single harmonised account throws away information."]},
 {at:6,h:"How each gospel opens, and why",p:[
  "The first lines are a statement of intent, and reading them side by side teaches you the four books quickly.",
  "Mark: the beginning of the gospel of Jesus Christ, the Son of God — then straight to John in the wilderness. No genealogy, no birth, no preface. The book starts at a run and does not slow down.",
  "Matthew: the book of the genealogy of Jesus Christ, the son of David, the son of Abraham. Two titles doing two jobs — heir to the throne, and heir to the promise for the nations. The genealogy then includes four women, three of them foreign and all four with irregular stories, which is a deliberate signal about who this king's family contains.",
  "Luke: a formal literary preface addressed to Theophilus, in the polished Greek of a historian, explaining method — many have undertaken, I have followed all things closely, I write an orderly account that you may have certainty. Then the narrative drops into a Septuagint-flavoured Hebraic style for the birth stories, as though the Old Testament has started again.",
  "John: in the beginning was the Word. Not the beginning of the ministry or of Israel but of everything — a deliberate echo of Genesis 1:1, followed by eighteen verses that place the whole story in a frame older than creation before a single event occurs.",
  {aside:{t:"A reading exercise worth doing",p:"Read the four opening chapters back to back in one sitting, and note only what each writer chose to put first. That single exercise teaches more about the shape of the Gospels than a chapter of introduction, and it takes about twenty minutes."}}]}],
 words:[
 {o:"ἀρχή",tr:"archē",lang:"gk",gl:"beginning, origin, rule",n:"Mark's first noun and John's first noun, both echoing Genesis 1:1 in the Septuagint."},
 {o:"αὐτόπται",tr:"autoptai",lang:"gk",gl:"eyewitnesses",n:"Luke 1:2. A term from historical writing — those who saw for themselves."},
 {o:"ἀσφάλεια",tr:"asphaleia",lang:"gk",gl:"certainty, security, firm footing",n:"Luke's stated purpose for Theophilus: that you may know the asphaleia of what you were taught."},
 {o:"λόγος",tr:"logos",lang:"gk",gl:"word, reason, ordering principle",n:"John 1:1. Greek philosophy's rational structure and Hebrew's creating word, detonated together."},
 {o:"δόξα",tr:"doxa",lang:"gk",gl:"glory",n:"The Septuagint's rendering of kavod. John 1:14 — we have seen his doxa, in a tent of flesh."},
 {o:"μονογενής",tr:"monogenēs",lang:"gk",gl:"one of a kind, only-begotten",n:"Uniqueness rather than biological origin. Used of Isaac in Hebrews 11:17, who was not Abraham's only son."}],

  cols:[{h:"Mark and Matthew",s:"",items:["Mark: no genealogy, no birth — straight to the wilderness","Matthew: son of David, son of Abraham","Throne and promise, in one line","Four women in the genealogy, three foreign"]},

  left:{h:"The differences",s:"Jericho, for example",items:["Mark: one man, named Bartimaeus","Matthew: two men","Luke: as he approaches, not leaves","Peripheral detail varies"]},

 "Named minor characters cluster among people the early church could have located and questioned.",

23:{bridge:{back:"Four accounts, one subject. This is what he actually announced.",
 fwd:"Next: the week the announcement collided with the authorities, and what his death accomplished."},
 sections:[
 {at:3,h:"The Sermon on the Mount as kingdom constitution",p:[
  "Matthew 5 to 7 is not a collection of moral maxims. It is the charter of a kingdom, and its structure argues.",
  "It opens with the Beatitudes, which are not entry requirements but announcements: blessed are the poor in spirit, those who mourn, the meek. μακάριοι (makarioi) is a declaration of congratulation, not a command. The kingdom is announced as belonging to precisely the people a normal society regards as having lost.",
  "Then salt and light — identity, not aspiration. You are, not you should become.",
  "Then six antitheses: you have heard it said, but I say to you. Each intensifies rather than relaxes, and each moves from the act to the source. Murder to anger, adultery to the look, divorce to the hardness that seeks a technicality, oaths to speech that needs no reinforcement, retaliation to the refusal of escalation, neighbour-love to enemy-love. The trajectory is consistently inward and consistently harder.",
  "Then three practices — giving, prayer, fasting — with the same structure each time: do it, do not perform it, your Father sees. And at the centre of that centre, the Lord's Prayer, which is itself a kingdom document: your kingdom come, your will be done, on earth as in heaven.",
  "It closes with two roads, two trees, two builders. Not two philosophies but two foundations, and the storm comes to both houses. The difference is not exposure to the storm but what the house is standing on."]},
 {at:7,h:"The miracles as signs of the kingdom's arrival",p:[
  "The miracles are not primarily demonstrations of power to prove a claim. They are samples — the kingdom's future breaking into the present in specific places, and each category answers a specific consequence of the fall.",
  "Healings answer the body's corruption. Exorcisms answer occupation by hostile powers, and the language of Mark is combative: the strong man bound, his house plundered. Nature miracles answer chaos — a storm stilled on the sea that biblical imagery consistently associates with disorder. Feedings answer scarcity, with the wilderness setting and the leftover baskets recalling manna. Raisings answer death itself.",
  "This is why Jesus's answer to John the Baptist's question from prison is a list rather than a claim: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised, the poor have good news preached to them. He is quoting Isaiah 35 and 61 and saying, in effect, look at what is happening — is this the shape of what was promised?",
  "It also explains the restraint. He does not heal everyone, does not end Roman occupation, does not empty the graveyards. The kingdom is genuinely present and not yet consummated, and the miracles are exactly consistent with that: real, local, partial and pointing forward. A theology that promises the consummation now has misread the samples for the harvest."]}],

 {o:"μακάριοι",tr:"makarioi",lang:"gk",gl:"blessed, congratulated",n:"The Beatitudes announce a state, they do not set entry requirements. The Septuagint's word for ashrei."},
 {o:"πραεῖς",tr:"praeis",lang:"gk",gl:"meek, gentle",n:"Not weakness — used of a war horse under control. Strength that answers to a rein."},
 {o:"δικαιοσύνη",tr:"dikaiosynē",lang:"gk",gl:"righteousness, justice",n:"One Greek word for both. Hungering and thirsting for it is not only personal piety."},
 {o:"ἐπιούσιος",tr:"epiousios",lang:"gk",gl:"daily? necessary? for the coming day?",n:"In the Lord's Prayer, and virtually nowhere else in Greek literature. Its meaning is genuinely uncertain."},
 {o:"τέλειοι",tr:"teleioi",lang:"gk",gl:"complete, whole, mature",n:"Matthew 5:48 — be teleios as your Father is. Wholeness or full growth, not flawlessness."},
 {o:"σκάνδαλον",tr:"skandalon",lang:"gk",gl:"the trigger of a trap, a stumbling block",n:"The stick that springs a snare. What causes someone else to fall, not merely what offends them."}],

 "The antitheses always intensify and always move from the act to its source.",
 "The storm hits both houses; the difference is the foundation, not the exposure.",

24:{bridge:{back:"The kingdom was announced, demonstrated and resisted. This is the week it came to a head.",
 fwd:"Next: the morning that turned an execution from a refutation into a beginning."},
 sections:[
 {at:2,h:"The week, day by day",p:[
  "Laying the week out makes the collision visible. Each day is a deliberate escalation, and none of it is accidental.",
  "Sunday: the entry. A donkey, not a warhorse — Zechariah 9:9 — into a city packed for Passover, with crowds shouting a psalm about a king. Rome's governor had entered from the other side of the city with troops days earlier. Two processions, one week.",
  "Monday: the temple. He disrupts the commerce in the court of the Gentiles and quotes Isaiah and Jeremiah. This is the act that makes his death a matter of practical politics rather than theological disagreement — he has interfered with the economic and religious centre during the most crowded week of the year.",
  "Tuesday: controversy. A sequence of set-piece challenges — authority, taxes to Caesar, resurrection, the greatest commandment — and then the woes of Matthew 23 and the Olivet discourse predicting the temple's fall.",
  "Wednesday: the plot, and the anointing at Bethany. Judas goes to the chief priests.",
  "Thursday: the meal, the new covenant, Gethsemane, the arrest at night.",
  "Friday: trials before Annas, Caiaphas, Pilate and Herod, flogging, crucifixion at the third hour, darkness from the sixth, death at the ninth. Burial before sunset, hurried, because the sabbath was starting.",
  "The compression is worth feeling. From public acclamation to public execution in five days."]},
 {at:6,h:"Gethsemane, and what the cup means",p:[
  "Before the theology of the cross, there is the anguish of the man about to bear it, and the Gospels do not soften it. Mark says he began to be greatly distressed and troubled — the verb ἐκθαμβεῖσθαι (ekthambeisthai) suggests shuddering horror. He says his soul is sorrowful unto death. Luke, a physician, records sweat like drops of blood.",
  "And the prayer is: remove this cup. The cup is not a general metaphor for suffering. In the prophets it is a specific and terrible image — Isaiah 51, Jeremiah 25, Ezekiel 23 — the cup of God's wrath, which the nations and Israel are made to drink to the dregs. Jesus is using the vocabulary of the prophets he knew.",
  "Three times he prays it, and three times adds: yet not what I will, but what you will. And Hebrews 5:7 says he was heard — which is worth pausing over, since the cup was not removed. He was heard, and the answer was no, and Hebrews still calls that being heard because of his reverence.",
  {aside:{t:"Why this belongs in a worship lesson",p:"Congregations are frequently taught, implicitly, that faithful prayer gets what it asks for. Gethsemane is the counter-example at the centre of the faith: the most faithful prayer ever prayed, prayed three times, answered no. Any theology of prayer that cannot accommodate that is not describing the faith of the person it is addressed to."}}]}],

 {o:"ποτήριον",tr:"potērion",lang:"gk",gl:"cup",n:"In the prophets, the cup of God's wrath drunk to the dregs. Not a general image for hardship."},
 {o:"ἐκθαμβεῖσθαι",tr:"ekthambeisthai",lang:"gk",gl:"to be greatly distressed, to shudder",n:"Mark 14:33. A strong verb suggesting horror, not merely sadness."},
 {o:"ἀββά",tr:"abba",lang:"he",gl:"father (Aramaic)",n:"Preserved untranslated in Mark 14:36 — the word he actually used in the garden."},
 {o:"παραδίδωμι",tr:"paradidōmi",lang:"gk",gl:"to hand over, deliver up",n:"Used of Judas, of the priests, of Pilate — and in Romans 8:32 of the Father. The same verb, all the way up."},
 {o:"σταυρός",tr:"stauros",lang:"gk",gl:"cross, upright stake",n:"An instrument of public shame before pain. Hebrews 12:2 — he despised the shame."},
 {o:"ἀμνὸς",tr:"amnos",lang:"gk",gl:"lamb",n:"John 1:29. The noun Abraham did not supply on Moriah, finally spoken."}],

  {n:"Tuesday",s:"set-piece challenges, then the woes"},{n:"Wednesday",s:"the plot; anointing at Bethany"},
  {n:"Thursday",s:"the meal, the covenant, the arrest"},{n:"Friday",s:"four hearings, flogging, crucifixion, hurried burial"}]},
 {type:"stack",title:"Gethsemane",caption:"The most faithful prayer ever prayed, offered three times, answered no.",
  layers:[{n:"He began to shudder",s:"ekthambeisthai — horror, not sadness"},{n:"Sorrowful unto death",s:"and he asks three friends to stay awake"},
  {n:"Abba, Father",s:"the Aramaic preserved untranslated"},{n:"Remove this cup",s:"the prophets' cup of wrath, drunk to the dregs"},

 recap:["Two processions entered Jerusalem that week: Rome's troops, and a man on a donkey.",
 "The temple action made his death practical politics, not theological disagreement.",
 "The cup is the prophets' cup of wrath, not a general image for suffering.",
 "Hebrews says he was heard — and the cup was not removed. Both are asserted.",

25:{bridge:{back:"On Friday the claim looked refuted. This is what changed on Sunday.",
 fwd:"Phase 6: a frightened group becomes a movement, and the story moves outward to the ends of the earth."},
 sections:[
 {at:3,h:"The earliest evidence, and how early it is",p:[
  "1 Corinthians 15:3–7 is the crucial text, and its form matters as much as its content. Paul says he delivered what he also received, and then quotes something with the marks of a fixed formula: parallel clauses, the repeated that, non-Pauline vocabulary, and the Aramaic name Cephas.",
  "The content is: that Christ died for our sins according to the Scriptures, that he was buried, that he was raised on the third day according to the Scriptures, and that he appeared — to Cephas, then to the twelve, then to more than five hundred at once, then to James, then to all the apostles, and last to Paul.",
  "The dating matters. 1 Corinthians is usually placed around AD 54. Paul says he received this material, most plausibly at his conversion or during his visit to Jerusalem to see Peter and James, which places the formula within a few years of the crucifixion — well inside the lifetime of the people it names. Even sceptical scholars generally concede this is very early material, and it is the reason the resurrection cannot be treated as a legend that accumulated over generations.",
  "Note also the awkward details a shaped tradition would smooth: Peter, who denied him, is listed first among the appearances. James, who did not believe during the ministry, appears. Paul, who persecuted the church, calls himself one untimely born, the least of the apostles, unworthy to be called an apostle. None of that flatters anyone."]},
 {at:6,h:"What resurrection meant, and did not mean",p:[
  "ἀνάστασις (anastasis) meant something specific in the first century, and both Jewish and Greek hearers understood it — which is why the reactions in the New Testament are so sharply divided.",
  "For most Jews of the period, resurrection was a corporate event at the end of the age: all the righteous raised together, into a renewed creation. Martha says exactly this at Bethany — I know that he will rise again in the resurrection on the last day. What nobody expected was one man raised, alone, in the middle of history, leaving the rest of the timetable running.",
  "For Greeks, the idea was not merely unbelievable but undesirable. The body was what the soul escaped. Acts 17 records the reaction precisely: they were listening politely in Athens until he mentioned the resurrection of the dead, and then some mocked. Aeschylus has Apollo say that once a man is dead there is no resurrection — this was settled cultural common sense.",
  "So the claim was offensive to Greeks and out of sequence for Jews. It fits no available expectation, which is a point worth weighing: invented claims usually confirm what someone already hoped.",
  "And the consequences are not merely apologetic. If resurrection is bodily and the beginning of a renewed creation, then matter matters, work is not futile, the body is not a temporary shell, and the Christian hope is not evacuation but restoration. 1 Corinthians 15 ends not with a doctrine but with a therefore: be steadfast, immovable, always abounding in the work of the Lord, knowing that in the Lord your labour is not in vain. The resurrection's first application is to keep working."]}],

26:{bridge:{back:"He was raised and enthroned. Ten days later the Spirit falls and a people is formed.",
 fwd:"Next: the man who did most to explain what that people is, and how a Gentile belongs in it."},
 sections:[
 {at:3,h:"Peter's sermon, and the pattern of apostolic preaching",p:[
  "Acts 2 is the first Christian sermon, and its structure recurs throughout the book with enough consistency that scholars gave the pattern a name — the kerygma, the proclamation.",
  "Peter begins where the audience is: these men are not drunk, it is nine in the morning. Then he explains the phenomenon from Scripture — this is what was spoken by the prophet Joel — and quotes at length. Then he tells the story of Jesus: attested by God through mighty works, delivered up according to God's plan, crucified by lawless hands, raised because death could not hold him. Then he argues from Psalm 16 that David spoke of someone else, since David's tomb is with us to this day and everyone listening knows where it is.",
  "Then the conclusion: God has made him both Lord and Christ, this Jesus whom you crucified. And the response is not a decision card but a question — brothers, what shall we do? — followed by repent and be baptised, and a promise for you and your children and all who are far off.",
  "The pattern across Acts is consistent: start where the hearers are; ground it in Scripture they accept; tell the story of Jesus with the cross and resurrection at the centre; assert his lordship; call for a response. At Athens, where the audience has no Scripture in common, Paul adapts the first two steps and keeps the rest — beginning with an altar inscription and a Greek poet, and still arriving at a man raised from the dead. The content does not flex; the entry point does."]},
 {at:6,h:"Stephen, and the cost of the argument",p:[
  "Acts 7 is the longest speech in the book, and it is worth knowing why it takes the form it does. Stephen is accused of speaking against the temple and the law. He replies with a history lesson, and the history is the argument.",
  "God appeared to Abraham in Mesopotamia, before the land. He was with Joseph in Egypt, outside the land. He met Moses at a burning bush in Midian, and the ground there was holy. The tabernacle was portable. And Solomon built a house — but, quoting Isaiah 66, the Most High does not dwell in houses made by hands.",
  "Every episode is chosen to show God acting outside the holy places. The charge was that Stephen devalued the temple; his answer is that God has never been confined to it, and that Israel's pattern has been to resist the messengers who said so.",
  "Then the ending. He sees the Son of Man standing at the right hand of God — standing, not seated, which is the only such description in the New Testament and has been read as the judge rising, or the advocate rising for his client, or simply the host rising to receive someone home. As he is stoned he prays two prayers that echo the cross: receive my spirit, and do not hold this sin against them.",
  "And Luke adds one sentence: the witnesses laid their garments at the feet of a young man named Saul. The persecution that follows scatters the church out of Jerusalem, which is how the mission in Acts 1:8 actually begins to happen — and the man supervising the coats becomes its principal missionary."]}],

 {o:"ὁμοθυμαδόν",tr:"homothymadon",lang:"gk",gl:"with one accord, of one passion",n:"Used ten times in Acts, almost nowhere else. Unity as the book's recurring description of the church."},

 "Peter argues from Psalm 16 that David spoke of someone else — his tomb is still here.",

27:{bridge:{back:"The church spread outward, and immediately had to answer who belongs and on what terms.",
 fwd:"Next: the letters that are not Paul's, and the different pressures they were written into."},
 sections:[
 {at:3,h:"The letters in order, and what each was for",p:[
  "Reading Paul canonically is reading him longest-first, which is not chronological and hides the development. A rough working order helps.",
  "Galatians, possibly his earliest, is furious: no thanksgiving section, straight to I am astonished. The issue is whether Gentiles must be circumcised, and Paul treats it as the gospel itself being at stake.",
  "1 and 2 Thessalonians address a young church suffering, and confused about believers who had died before Christ's return.",
  "1 and 2 Corinthians deal with a gifted, divided, litigious and morally chaotic congregation — factions, a lawsuit, sexual scandal, food offered to idols, disorderly meetings, and a challenge to Paul's own authority. More practical instruction on gathered worship comes from here than anywhere else.",
  "Romans, written to a church he had not founded and ahead of a visit, is the most systematic: the plight of humanity, justification, life in the Spirit, the place of Israel, and then the practical section from chapter 12.",
  "The prison letters — Ephesians, Philippians, Colossians, Philemon — are warmer and more cosmic, with Christ over the powers, the church as his body, and one exquisite personal note asking a man to take back a runaway slave as a brother.",
  "And the pastorals — 1 and 2 Timothy, Titus — are about handing on, ordering churches and appointing leaders. 2 Timothy reads like a last letter, and probably is."]},
 {at:7,h:"The Spirit in Paul",p:[
  "It is easy to read Paul as a theologian of justification and miss how saturated he is with the Spirit. Gordon Fee's study counts well over a hundred explicit references, and they cluster around the practical.",
  "The Spirit is the guarantee — ἀρραβών (arrabōn), a deposit — of what is coming. The Spirit produces adoption, and the evidence Paul offers is not an argument but a cry: you received the Spirit of adoption, by whom we cry Abba, Father. The Spirit prays when we cannot, with groanings too deep for words, which is a startling thing to say about prayer that fails.",
  "The Spirit produces fruit — and note that Galatians 5 lists fruit singular against works plural. Love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, self-control are described as one crop, not a menu.",
  "The Spirit distributes gifts, and 1 Corinthians 12 is blunt about the criterion: to each is given the manifestation of the Spirit for the common good. Not for the individual's confirmation. And chapter 13 sits deliberately between the two chapters on gifts, which means the love chapter is not a wedding reading detached from context; it is an argument that a gifted church without love is a noisy gong.",
  {aside:{t:"The order that matters",p:"1 Corinthians 12, 13 and 14 are one argument. Gifts are real and given by God. Love is the manner in which they must operate. And the assembly is ordered by whether the body is built up. Take chapter 13 out and you get a beautiful poem; leave it in and you get a rebuke aimed at exactly the kind of church that prides itself on chapter 12."}}]}],

 {o:"υἱοθεσία",tr:"huiothesia",lang:"gk",gl:"adoption as sons",n:"A Roman legal act conferring full inheritance rights, irrevocably. Not a sentimental image."},
 {o:"καρπός",tr:"karpos",lang:"gk",gl:"fruit",n:"Singular in Galatians 5, against works plural. One crop with nine characteristics, not a menu."},
 {o:"χάρισμα",tr:"charisma",lang:"gk",gl:"a gift of grace",n:"From charis. A gift, given for the common good — the criterion is stated, not implied."},
 {o:"σῶμα",tr:"sōma",lang:"gk",gl:"body",n:"Paul's central image for the church. Diversity is structural, not an administrative inconvenience."},
 {o:"στεναγμοῖς",tr:"stenagmois",lang:"gk",gl:"groanings",n:"Romans 8:26 — the Spirit intercedes with groanings too deep for words, when prayer fails."}],

28:{bridge:{back:"Paul explained how Gentiles belong. These letters address people tempted to stop belonging at all.",
 fwd:"Next: the last book, written to seven real churches under exactly this pressure."},
 sections:[
 {at:3,h:"The five warnings of Hebrews, and how to hold them",p:[
  "Hebrews alternates exposition with warning, and the warnings are severe enough that they have generated centuries of debate. They are worth listing, because the pattern is instructive.",
  "Chapter 2: do not drift — how shall we escape if we neglect so great a salvation. Chapter 3–4: do not harden, as in the wilderness; take care lest there be an evil, unbelieving heart. Chapter 5–6: the hardest — those who have shared in the Holy Spirit and then fall away cannot be restored to repentance. Chapter 10: if we go on sinning deliberately after receiving the knowledge of the truth, there no longer remains a sacrifice. Chapter 12: do not refuse him who is speaking, as Esau sold his birthright for a single meal.",
  "Christians read these differently. Some take them as describing genuine believers who can be lost; some as describing those who were among the community without ever truly belonging; some as hypothetical warnings that are themselves the means by which God preserves his people. The letter itself does not adjudicate, and it does something more useful: after the hardest warning in chapter 6, it immediately says we feel sure of better things concerning you, and grounds assurance in God's oath and Christ's priesthood.",
  "The pastoral shape is worth copying. The warnings are addressed to a community under pressure and tempted to go back, and the antidote offered is never a lowered standard. It is a higher view of Christ — better than angels, Moses, Aaron, the covenant, the sacrifices. The letter's answer to fear of falling away is to look harder at the one holding you."]},
 {at:7,h:"Suffering, and the shape of 1 Peter",p:[
  "1 Peter is written to Christians scattered across five Roman provinces in Asia Minor, and it uses one controlling idea: they are παρεπίδημοι (parepidēmoi), resident aliens — people legally present and socially foreign. Everything else follows from that status.",
  "The suffering in view is mostly social rather than official: being spoken against, slandered, excluded, maligned as evildoers. This is the ordinary cost of a minority whose loyalties have visibly shifted, and Peter treats it as normal rather than exceptional — do not be surprised at the fiery trial, as though something strange were happening.",
  "His instruction is unusual. Not withdrawal, and not confrontation, but conspicuous good conduct: keep your conduct honourable, so that when they speak against you as evildoers they may see your good deeds and glorify God. Be prepared to give a reason for your hope — with gentleness and respect, a phrase frequently quoted without its second half.",
  "And the ground is christological throughout. He suffered, leaving you an example. He committed no sin, and when reviled did not revile in return, but entrusted himself to him who judges justly. The word for entrusted is a banking term: he deposited himself with the judge.",
  "Then 2:9 takes Exodus 19's words to Israel at Sinai — a chosen race, a royal priesthood, a holy nation, a people for his own possession — and applies them without qualification to a scattered, mostly Gentile, socially marginal group of households. Whatever else the letter does, that sentence is doing enormous theological work in very few words."]}],

 {o:"ἀπολογία",tr:"apologia",lang:"gk",gl:"a reasoned defence",n:"1 Peter 3:15 — and the verse continues with gentleness and respect, which is usually left off."},
 {o:"ὑπογραμμός",tr:"hypogrammos",lang:"gk",gl:"a writing copy to trace",n:"1 Peter 2:21. The model letters a child copies out — an example to be traced, not merely admired."},
 {o:"ἀσάλευτος",tr:"asaleutos",lang:"gk",gl:"unshakeable",n:"Hebrews 12:28 — a kingdom that cannot be shaken, offered to people whose world was."},
 {o:"παρρησία",tr:"parrēsia",lang:"gk",gl:"confidence, freedom to speak",n:"Hebrews uses it of approaching God: we may draw near with confidence, a citizen's right of access."}],

29:{bridge:{back:"Those letters addressed churches under pressure. This one names them, and tells them what is really happening.",
 fwd:"Finally: what all of it means for the person standing in front of a congregation on a Sunday."},
 sections:[
 {at:3,h:"The seven churches, and what each was told",p:[
  "Before any visions, Revelation addresses seven real congregations on a real postal route in western Asia Minor, and the messages are specific enough to be useful.",
  "Ephesus: doctrinally rigorous, patient, intolerant of false apostles — and has abandoned its first love. Orthodoxy without affection is named as a fall.",
  "Smyrna: poor and slandered, and told they are rich. One of only two churches with no rebuke. They are promised prison, not rescue.",
  "Pergamum: living where Satan's throne is — a city of imperial cult and temples — holding fast, but tolerating compromise in teaching.",
  "Thyatira: growing in love, faith, service and patience, and doing more than at first — and tolerating a teacher leading people into idolatry and immorality.",
  "Sardis: has a reputation for being alive and is dead. The most uncomfortable line in the seven.",
  "Philadelphia: little power, kept his word, has not denied his name. The other church with no rebuke, and given an open door.",
  "Laodicea: wealthy, self-sufficient, in need of nothing, and told it is wretched, poor, blind and naked. The city was famous for banking, black wool and an eye salve — and it is told to buy gold, white garments and salve. And the water supply arrived lukewarm through an aqueduct, unlike the hot springs of Hierapolis or the cold water of Colossae nearby. The imagery is local and the congregation would have felt every barb.",
  {aside:{t:"What the pattern says",p:"The two churches with no rebuke are the poorest and the weakest. The two most comfortable — Sardis with its reputation and Laodicea with its wealth — get the harshest assessments. That is not incidental to the book's argument about where power actually lies."}}]},
 {at:8,h:"Reading Revelation without going wrong",p:[
  "A few working rules keep the book useful rather than dangerous.",
  "First, it was written to seven real churches who were expected to understand it. Any reading that requires information unavailable until the twentieth century has misunderstood the genre. The book says the time is near, and it meant something to its first readers.",
  "Second, the Old Testament is the dictionary. Around two-thirds of its verses allude to it without ever quoting directly. If a symbol puzzles you, the answer is almost always in Daniel, Ezekiel, Zechariah, Exodus or Isaiah, not in the newspaper.",
  "Third, it is a cycle, not a sequence. The seals, trumpets and bowls are not necessarily consecutive; they recapitulate, each running over similar ground with increasing intensity and each ending at the same point. Reading them as a strict chronology creates problems the text does not have.",
  "Fourth, the centre is worship, and the enemy is not primarily suffering but deception. The recurring call is to endure and to refuse to worship the beast — and the beast's power is largely the power to make itself look inevitable.",
  "Fifth, hold your eschatological system loosely. Sincere, careful Christians have read the millennium as future and literal, as the present church age, and as symbolic of Christ's reign; and the four broad approaches to the book have all been held by serious readers. What is not optional is the book's actual claim: the Lamb reigns, the empire does not, and the story ends with God dwelling among people."]}],

 {o:"ἀποκάλυψις",tr:"apokalypsis",lang:"gk",gl:"unveiling",n:"The curtain drawn back on what is already true — not primarily a forecast."},
 {o:"θηρίον",tr:"thērion",lang:"gk",gl:"beast",n:"Daniel 7's imagery for empires. A political power making a religious claim."},
 {o:"χλιαρός",tr:"chliaros",lang:"gk",gl:"lukewarm",n:"Laodicea's water arrived tepid by aqueduct — neither the hot springs of Hierapolis nor Colossae's cold."},
 {o:"ὑπομονή",tr:"hypomonē",lang:"gk",gl:"endurance, remaining under",n:"The book's central virtue. Staying put under weight, not passive patience."},
 {o:"σφραγίς",tr:"sphragis",lang:"gk",gl:"seal",n:"A mark of ownership and protection. Both God and the beast mark their own — the parody is deliberate."},
 {o:"καινός",tr:"kainos",lang:"gk",gl:"new in kind, renewed",n:"Revelation 21:1 — a kainos heaven and earth. Renewal of this creation rather than a replacement."}],

30:{bridge:{back:"Twenty-nine lessons, from the first page to the last. This is what to do with them on a Sunday.",
 fwd:"The cumulative review keeps it alive. Start again anywhere — the story rewards a second pass."},
 sections:[
 {at:3,h:"A liturgy drawn from the whole story",p:[
  "If the arc is real, a gathering can be shaped by it — not as a rigid template but as a check that nothing essential is missing. Most historic liturgies do something like this, and most contemporary services do about half of it.",
  "Call to worship: God speaks first. Every biblical encounter begins with God addressing people, not people working themselves up. Creation and the goodness of the world belong here.",
  "Confession: the fracture named honestly, out loud, together. A congregation that never confesses corporately learns that sin is a private embarrassment rather than a shared condition.",
  "Assurance: the answer given, out loud. Confession without assurance is cruelty. This is where the cross is not merely referenced but applied.",
  "The word: read, and explained. Nehemiah 8 is the pattern — read clearly, give the sense, help them understand.",
  "Response: song, offering, prayer for the world, the table. Here the Spirit-formed people acts.",
  "Sending: the new creation in view, and a commission. People should leave with something to do and somewhere to go.",
  "Run a service against that list and the gaps become obvious quickly. In most contemporary settings the missing elements are confession, assurance, and prayer for the world — which happen to be the three that most directly form a congregation's understanding of sin, grace and neighbour."]},
 {at:7,h:"Ten questions to carry into a planning meeting",p:[
  "The point of thirty lessons is not information but judgement. These are the questions this curriculum has been trying to make instinctive.",
  "Where on the arc is this congregation this week? What has happened to them since we last met, and does this set acknowledge it?",
  "What does this song actually claim, and is it true? Would I preach the sentence I am asking four hundred people to sing?",
  "Are we giving reasons, or only feelings? Every biblical hymn has a ki, a because.",
  "Is there room for the person whose season has not turned? If someone is in Psalm 88 this morning, is there a single moment where they are not being asked to lie?",
  "Whose voice is missing? The Psalter has laments, imprecations, wisdom, royal psalms and pure praise. Which of those has this church not sung in a year?",
  "Does the arrangement serve the congregation or the band? 1 Corinthians 14's criterion is oikodomē, and it applies to key choice as much as to content.",

mergeExpansion({
9:{sections:[{at:99,h:"Why the exodus is the pattern for everything after",p:[
 "Every later rescue in Scripture is described in exodus vocabulary. The return from Babylon is a second exodus, with Isaiah 43 telling them not to remember the former things because God is doing a new one — a road through the wilderness, water in the desert. Jesus's transfiguration conversation with Moses and Elijah is about his departure, and Luke's word is ἔξοδος (exodos). Paul calls Christ our Passover. Revelation has the redeemed singing the song of Moses and of the Lamb.",
 "This is why the exodus is not merely the founding story of one nation. It is the shape God's rescues take: a people who cannot free themselves, a cost borne by someone else, a departure at speed, a wilderness, a covenant, and a destination they have not seen.",
 {aside:{t:"What this asks of a worship leader",p:"Israel was commanded to rehearse this annually, at a meal, with children asking why the night was different, and the answer given in the first person: because of what the LORD did for me when I came out of Egypt. Not for them — for me. A congregation that only ever hears what God did in general has not been given that sentence. The Passover model is memory made personal, out loud, on a fixed schedule, with the youngest person present asking the question."}}]}]},
18:{sections:[{at:99,h:"Praying a psalm you do not feel",p:[
 "One objection surfaces whenever a church tries to use the Psalter seriously: it feels dishonest to sing words you do not currently mean. If I am not lamenting, why sing Psalm 88; if I am not exultant, why sing Psalm 150.",
 "Dietrich Bonhoeffer's answer, written for a community praying the psalms daily, is that the Psalter is not primarily a record of my feelings. It is the prayer book of the whole people of God, and of Christ within it. When I pray a psalm that does not match my week, I am praying with someone for whom it does match — and, in Bonhoeffer's account, praying with Christ, who prayed these words.",
 {aside:{t:"The practical upshot",p:"This reframes what a congregation is doing when it sings. On any given Sunday some people are in Psalm 30 and some are in Psalm 88, and a set that only serves one group asks the other to pretend. Singing the full range is not emotional inconsistency; it is intercession. The person who cannot sing this week is being carried by people who can, and next month it will be the other way round."}}]}]},
28:{sections:[{at:99,h:"Why these letters were kept",p:[
 "Hebrews, James, 1 Peter, 2 Peter, Jude and the letters of John were all disputed at some point in the canonical process — Hebrews for its unknown author, James for its apparent tension with Paul, 2 Peter and Jude for their late attestation, Revelation for its content. That they were kept anyway is worth noticing.",
 "A movement inventing its own scriptures would have produced a tidier collection: one voice, no tensions, no anonymous documents, no letters that argue with each other. Instead the church kept a letter it could not attribute, a letter that sounds like it is correcting Paul, and a set of short notes about false teachers that add little to the doctrinal core.",
 {aside:{t:"The test worth carrying",p:"When you meet something in Scripture that seems to work against the system you hold, the first question is not how to neutralise it. It is why the people who assembled this collection — who had every incentive to smooth it — decided it had to stay. James stayed. Ecclesiastes stayed. Psalm 88 stayed. The canon is not embarrassed by its own tensions, and neither should a teacher be."}}]}]}
