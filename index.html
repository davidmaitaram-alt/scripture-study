LESSONS.push(
{id:11,phase:3,title:"Conquest and judges",sub:"Land, herem, the cycle",
aim:"Face the hardest material in the Old Testament honestly, and see why Judges is deliberately unbearable.",
sections:[
{h:"Land as covenant, not real estate",p:[
"The land is promised, but it is never owned outright. Leviticus 25:23 states the terms: “the land is mine; for you are strangers and sojourners with me.” Israel are tenants. That is why the jubilee exists — every fiftieth year, land returns to the family that held it, because permanent alienation of land was not legally possible. A theology of tenancy produces a very different economics from a theology of ownership.",
"Deuteronomy repeatedly warns that occupation is conditional. The same covenant that gives the land threatens exile from it. The prophets later prosecute exactly this clause, and 2 Kings ends by invoking it."]},
{h:"Herem, honestly",p:[
"חֵרֶם (herem) means devoted to destruction, or more precisely placed irrevocably outside human use — the same root can describe something given wholly to God. In Joshua it is a war category, and there is no way to make it comfortable.",
"Several things are worth holding at once. The texts use conventional ancient Near Eastern war rhetoric — the Merneptah Stele claims Israel is annihilated and its seed is not, a century before Israel is manifestly still there. Joshua itself makes total-destruction claims in one chapter and then reports the same peoples living in the land in the next, which suggests the genre tolerates hyperbole. The stated grounds are moral and specific rather than ethnic — Genesis 15:16 has God delay four hundred years because “the iniquity of the Amorites is not yet complete,” and Deuteronomy 9:5 tells Israel bluntly that this is not because of their righteousness. Rahab the Canaanite is spared and enters the messianic line; Achan the Israelite is not. And the same covenant curses are later executed against Israel.",
{aside:{t:"Where the discomfort should sit",p:"None of that makes the conquest narratives easy, and it should not. What it does is rule out two lazy readings: that this is straightforward genocide with divine approval, and that it is nothing at all. The honest position holds the moral weight of the text without either endorsing it as a template or excising it from the canon. Christian readers also have to reckon that Jesus explicitly refuses this method — his kingdom does not advance by the sword, and he says so under arrest."}}]},
{h:"The cycle",p:[
"Judges runs a repeating pattern, stated as a formula: Israel does evil, God gives them into the hand of an oppressor, they cry out, God raises a שֹׁפֵט (shofet) — a judge, better understood as a deliverer and arbiter than a courtroom official — the land has rest, the judge dies, and it begins again.",
"But it is not a circle; it is a spiral downward. The judges themselves deteriorate. Othniel is exemplary. Gideon needs three signs and later makes an ephod that becomes a snare. Jephthah makes a vow that costs his daughter. Samson is a Nazirite who breaks every term of his own vow and whose great deliverance happens while he is dying under a Philistine roof.",
"And the last five chapters, with no judge at all, contain an idol-manufacturing enterprise, a Levite dismembering his concubine, and a civil war that nearly erases a tribe. The refrain: “in those days there was no king in Israel; everyone did what was right in his own eyes.” The book is building an argument for kingship — and, read further, for a particular kind of king."]},
{h:"Reading it well",p:[
"Judges is narrative that reports without endorsing. Nothing in the text approves of Jephthah's vow; it simply records the cost. Nothing approves of the Levite in chapter 19; the narrator's only comment is that nothing like this had happened since Israel came out of Egypt — consider it.",
"The theological point is not that these were great people. It is that God keeps rescuing a people who keep going wrong, using flawed instruments, because the covenant holds when the partner does not. Hebrews 11 lists Gideon, Barak, Samson and Jephthah among the faithful, which should permanently complicate any tidy account of what faith looks like."]}],
words:[
{o:"חֵרֶם",tr:"herem",lang:"he",gl:"devoted, placed outside human use",n:"A war category in Joshua and a category of consecration elsewhere. Irrevocably handed over."},
{o:"שֹׁפֵט",tr:"shofet",lang:"he",gl:"judge, deliverer, arbiter",n:"Not a courtroom official. One raised up to set things right, usually by force."},
{o:"נַחֲלָה",tr:"nachalah",lang:"he",gl:"inheritance, allotted portion",n:"The land as assigned tenancy, not freehold. Naboth refuses to sell his nachalah for exactly this reason."},
{o:"יָשָׁר בְּעֵינָיו",tr:"yashar be'einav",lang:"he",gl:"right in his own eyes",n:"The refrain that closes Judges. Autonomy as the diagnosis, not the ideal."},
{o:"נָזִיר",tr:"nazir",lang:"he",gl:"consecrated, separated one",n:"The Nazirite vow: no wine, no razor, no corpse. Samson breaks all three."}],
passages:["Joshua 1:1–9","Joshua 6","Leviticus 25:23–28","Judges 2:11–23","Judges 21:25","Hebrews 11:32–34"],

recap:["The land is tenancy, not freehold — which is why jubilee exists and why Naboth will not sell.","Herem means irrevocably handed over. The texts are hard, and the honest reading refuses both lazy exits.","Shofet is a deliverer, not a magistrate. The cycle in Judges is a downward spiral, not a circle.","The judges deteriorate as the book proceeds. Samson is a Nazirite who breaks every term of his vow.","Everyone did what was right in his own eyes — the book's diagnosis, and its argument for a king.","Hebrews 11 lists these men as faithful, which should complicate any tidy account of faith."],

{q:"Leviticus 25:23 grounds Israel's land ethic in the claim that:",a:["The land is God's and Israel are tenants","The land may be sold freely","The land belongs to the king","The land belongs to the tribes forever"],c:0,why:"Tenancy is why jubilee returns property and why Naboth cannot sell his inheritance."},
{q:"Herem denotes something that is:",a:["Ritually unclean","Irrevocably placed outside human use — devoted","Sold to a foreigner","Reserved for the priests' income"],c:1,why:"The same root covers both destruction in war and total consecration to God."},
{q:"A shofet in Judges is best described as:",a:["A tribal elder","A courtroom magistrate","A raised-up deliverer and arbiter","A hereditary priest"],c:2,why:"They set things right, usually by force, and the office is not inherited."},
{q:"What internal evidence suggests Joshua's total-destruction language is conventional hyperbole?",a:["Archaeology found no cities","Joshua contradicts Deuteronomy","The book was written much later","The same peoples are reported living in the land in subsequent chapters"],c:3,why:"Comprehensive claims followed immediately by reports of survivors — a known feature of ancient war rhetoric."},
{q:"Deuteronomy 9:5 tells Israel that they receive the land:",a:["Not because of their righteousness","Because of Abraham's obedience alone","As payment for their slavery","Because of their righteousness"],c:0,why:"Which rules out reading the conquest as a reward for Israelite virtue."},
{q:"The structure of Judges is best described as:",a:["A repeating circle returning to the same point","A downward spiral in which each cycle ends lower","A steady ascent toward the monarchy","A series of unrelated episodes"],c:1,why:"The deliverers themselves deteriorate, and the final chapters have no judge at all."},
{q:"The refrain closing the book of Judges is:",a:["Israel cried out to the LORD","The LORD is king forever","There was no king in Israel; everyone did what was right in his own eyes","The land had rest forty years"],c:2,why:"Autonomy diagnosed as the disease. The book is arguing for kingship."},
{q:"Samson's tragedy is sharpened by the fact that he is:",a:["A foreigner","A king's son","A Levite","A Nazirite who violates every term of his own vow"],c:3,why:"No wine, no razor, no contact with the dead — he breaks all three, and his greatest act occurs as he dies."}]},

{id:12,phase:3,title:"Kingship and the Davidic covenant",sub:"2 Samuel 7, messiah",
aim:"See how Israel's demand for a king is both a rejection and a fulfilment, and how one promise reshapes everything after it.",
sections:[
{h:"Give us a king",p:[
"Deuteronomy 17 anticipates a king and constrains him: not many horses, not many wives, not much silver and gold, and he must write out a copy of the law himself and read it daily. A king under torah, not above it.",
"When Israel asks in 1 Samuel 8, they ask for a king “like all the nations,” and God tells Samuel “they have not rejected you, but they have rejected me from being king over them.” Samuel then describes what a king will take: sons, daughters, fields, servants, a tenth — the verb take is repeated relentlessly. They say yes anyway.",
"Saul is the answer to that request: physically impressive, chosen by the criteria a nation would use, and unable to wait, obey or hold his nerve. He is what they asked for."]},
{h:"A man after God's own heart",p:[
"The phrase in 1 Samuel 13:14 is often misheard as a compliment about David's piety. In context it means a man of God's own choosing — the contrast is with Saul, whom the people chose. God says he has sought out a man according to his own heart, which is about selection criteria before it is about character.",
"And David's character is presented without airbrushing: adultery, an engineered killing, a disastrous census, a family that disintegrates. He is Israel's greatest king and the narrative shows him at his worst in more detail than any other figure. Psalm 51 exists because 2 Samuel 11 did."]},
{h:"The promise that turns the story",p:[
"David wants to build God a house. Nathan says yes, then receives a word overnight and returns with a reversal built on a pun: you will not build me a בַּיִת (bayit), a house — I will build you a bayit, a dynasty. The word means both building and lineage, and 2 Samuel 7 plays on it throughout.",
"The terms: an offspring from David's own body, a throne established forever, a father-son relationship with that offspring, discipline when he sins — “I will discipline him with the rod of men” — but steadfast love that will not depart as it departed from Saul. It is unconditional in its ultimate outcome and conditional in its immediate administration.",
"That promise is the seedbed of messianic expectation. מָשִׁיחַ (mashiach) simply means anointed one, used of kings and priests. Because kings were anointed and this king's line was promised permanence, the term gradually narrowed to mean the one who would come. Greek renders it χριστός (christos). When Peter says “you are the Christ,” he is saying you are the son of David of 2 Samuel 7."]},
{h:"Solomon and the crack",p:[
"Solomon begins by asking for a listening heart and receives wisdom, wealth and a temple. He ends with seven hundred wives, a standing army with chariots and horses from Egypt, and forced labour imposed on his own people. Read Deuteronomy 17 next to 1 Kings 10–11 and the correspondence is exact: horses, wives, silver and gold. The constitution was written, and the wisest king broke every clause of it.",
"His son Rehoboam is asked to lighten the burden and promises to make it heavier. The kingdom splits in a generation. The Davidic promise survives in Judah, thinner and thinner, until the last king of David's line is blinded and led to Babylon — and 2 Kings ends with a strange coda: that king, decades later, eating at a foreign table, alive. The line is not extinguished. It is barely, deliberately, kept."]}],
words:[

{o:"מָשִׁיחַ",tr:"mashiach",lang:"he",gl:"anointed one",n:"Used of kings and priests. Narrowed over centuries to mean the promised deliverer; Greek christos."},
{o:"חֶסֶד",tr:"hesed",lang:"he",gl:"steadfast covenant love",n:"2 Samuel 7:15 — the hesed that departed from Saul will not depart from this line."},
{o:"נָגִיד",tr:"nagid",lang:"he",gl:"leader, prince, designated one",n:"Used of David before he reigns. Leadership as appointment, deliberately avoiding the word king."},
{o:"כִּסֵּא",tr:"kisse",lang:"he",gl:"throne",n:"Established forever — the clause that generates centuries of expectation and the question at Jesus's trial."}],

recap:["Deuteronomy 17 puts the king under torah: no horses, no harem, no hoard, and a handwritten copy of the law.","Israel asks for a king like the nations; Samuel's warning is a drumbeat of the verb take.","A man after God's own heart means a man of God's own choosing — the contrast is with the people's choice.","2 Samuel 7 turns on the pun in bayit: you will not build me a house, I will build you one.","Mashiach means anointed; the promise of a permanent throne narrowed the word into a title.","Solomon breaks every clause of the king's constitution, and 2 Kings ends with the line barely, deliberately, alive."],
quiz:[
{q:"Deuteronomy 17 requires a king to:",a:["Write out his own copy of the law and read it daily","Appoint the high priest","Build a temple","Lead the army personally"],c:0,why:"A king under torah rather than above it — the clause Solomon most conspicuously ignores."},
{q:"When Israel demands a king in 1 Samuel 8, God tells Samuel:",a:["They have rejected you as prophet","They have rejected me from being king over them","They will be blessed for their faith","The request is forbidden"],c:1,why:"And Samuel's warning is built on the repeated verb take: sons, daughters, fields, a tenth."},
{q:"A man after God's own heart in 1 Samuel 13:14 primarily means:",a:["A man from the tribe of Judah","A man of exceptional personal piety","A man of God's own choosing, in contrast to the people's choice","A man who wrote psalms"],c:2,why:"The context is selection criteria. David's failures are then reported in unusual detail."},
{q:"The central wordplay of 2 Samuel 7 turns on which term?",a:["Kisse — throne","Berith — covenant","Mashiach — anointed","Bayit — house, meaning both building and dynasty"],c:3,why:"David proposes to build God a house; God announces he will build David one."},
{q:"Mashiach originally meant:",a:["Anointed one — used of kings and priests","Deliverer from exile","Prophet like Moses","Son of David"],c:0,why:"It narrowed into a title precisely because of the promise of a permanent Davidic throne."},
{q:"How does 2 Samuel 7 handle the possibility of the successor sinning?",a:["The covenant would be revoked entirely","There would be discipline with the rod of men, but hesed would not depart","Sin is declared impossible for this line","A new dynasty would be chosen"],c:1,why:"Unconditional in ultimate outcome, conditional in immediate administration — hence Psalm 89's anguish."},
{q:"1 Kings 10–11 reports Solomon acquiring all of the following, in direct breach of Deuteronomy 17, except:",a:["Many wives","Vast silver and gold","A standing prophetic council","Horses from Egypt"],c:2,why:"Horses, wives and treasure are the three named prohibitions, and Solomon breaks all three."},
{q:"2 Kings ends with Jehoiachin eating at the Babylonian king's table, which functions as:",a:["A warning against foreign alliances","An appendix unrelated to the narrative","A note of final defeat","A deliberate signal that the Davidic line survives"],c:3,why:"The book closes on a thin thread kept alive on purpose — the promise has not been cancelled."}]},

{id:13,phase:3,title:"The temple",sub:"Kavod, shekinah, sacred space",
aim:"Understand what it meant for God's presence to have an address, and what happened when it left.",
sections:[
{h:"From tent to stone",p:[
"Solomon's temple takes seven years and follows the tabernacle's pattern in permanent materials: an outer court, a holy place, and the holy of holies, doubled in dimension. The garden imagery persists — palm trees, open flowers, pomegranates, and two enormous cherubim whose wings span the inner room.",
"At the dedication in 1 Kings 8 the כָּבוֹד (kavod), the glory, fills the house as a cloud so that the priests cannot stand to minister. Kavod is from a root meaning heavy or weighty; God's glory is his weight, his substance, the sheer significance of him made perceptible. English glory is thin by comparison.",
"And Solomon's prayer is remarkably self-aware: “will God indeed dwell on the earth? Behold, heaven and the highest heaven cannot contain you; how much less this house that I have built.” The temple is not a container. It is an address."]},
{h:"What the temple was for",p:[
"Four things at least. It was the place of sacrifice, where sin was dealt with and fellowship meals were eaten. It was the place of presence, the throne room of the invisible king with the ark as his footstool. It was the place of prayer, and Solomon's dedication explicitly names the foreigner who comes from a far country — the building has a Gentile clause from day one. And it was the centre of Israel's identity and calendar: three annual pilgrim festivals brought the nation to one place.",
"Yom Kippur concentrated it all. Once a year the high priest entered the holy of holies with blood, sprinkled the kapporet, and a second goat carrying the confessed sins of the people was sent into the wilderness. Two goats, one ritual: one death, one removal. Leviticus 16 gives Hebrews and the New Testament much of its vocabulary."]},
{h:"The presence leaves",p:[
"Ezekiel 8–11 is one of the most devastating sequences in Scripture. The prophet is shown, in vision, what is happening inside the temple: idols in the entrance, elders burning incense to carved beasts in the dark, women weeping for Tammuz, and men at the very door of the sanctuary bowing eastward to the sun with their backs to the temple.",
"Then the kavod moves. It rises from the cherubim to the threshold, then to the east gate, then stops above the mountain east of the city — the Mount of Olives — and departs. The temple stands for a while longer, functioning, staffed, with sacrifices continuing. It is simply empty. Jeremiah 7 makes the same point more bluntly: stop saying “the temple of the LORD, the temple of the LORD,” as if the building were a charm.",
{aside:{t:"For a worship leader",p:"This is the sharpest warning in the Bible about liturgy. Everything can be running correctly — the right building, the right personnel, the right music, the right words, uninterrupted — and the presence can have left the room. Ezekiel's vision is not addressed to pagans. It is addressed to the people who were still holding services."}}]},
{h:"The temple rebuilt, and replaced",p:[
"The second temple is completed in 516 BC and the old men who remember the first one weep when they see the foundation. Herod's massive expansion makes it magnificent again, and it is the building Jesus walks in.",
"Then the New Testament does something startling with the category. Jesus says “destroy this temple and in three days I will raise it up,” speaking of his body. Paul tells the Corinthians — the whole congregation, the pronoun is plural — that they are God's ναός (naos), the inner sanctuary. Peter calls believers living stones being built into a spiritual house. And Revelation 21 describes the new city and notes that there is no temple in it, because God and the Lamb are its temple.",
"The direction of travel is consistent: from a tent, to a building, to a body, to a people, to a city where the distinction between sacred space and everything else is finally abolished."]}],
words:[
{o:"כָּבוֹד",tr:"kavod",lang:"he",gl:"glory, weight, substance",n:"From a root meaning heavy. God's glory is his sheer weight made perceptible — not brightness only."},
{o:"שְׁכִינָה",tr:"shekinah",lang:"he",gl:"the dwelling presence",n:"Later rabbinic term from shakan. Not in the Hebrew Bible itself, but naming what it describes."},
{o:"ναός",tr:"naos",lang:"gk",gl:"inner sanctuary",n:"Not the temple complex (hieron) but the holy place itself. Paul calls the congregation this — plurally."},
{o:"כַּפֹּרֶת",tr:"kapporet",lang:"he",gl:"mercy seat",n:"Sprinkled with blood on Yom Kippur. The Greek hilastērion behind Romans 3:25."},
{o:"עֲזָאזֵל",tr:"azazel",lang:"he",gl:"the goat that departs, or a destination",n:"Leviticus 16's second goat. Sin dealt with by death and by removal — two motions, one atonement."},
{o:"הֵיכָל",tr:"hekhal",lang:"he",gl:"palace, temple, great hall",n:"A loanword ultimately from Sumerian meaning big house. The temple is a royal residence."}],

recap:["Kavod means weight. Glory is God's substance made perceptible, not merely brightness.","Solomon's own prayer denies the temple is a container: heaven cannot contain you, much less this house.","The dedication prayer includes the foreigner from a far country. There was a Gentile clause from day one.","Yom Kippur uses two goats: one death, one removal — sin paid for and carried away.","In Ezekiel the glory leaves by stages and stops on the Mount of Olives. The building keeps running, empty.","The trajectory ends in a city with no temple, because God and the Lamb are its temple."],
quiz:[
{q:"Kavod, glory, comes from a root meaning:",a:["To be heavy or weighty","To cover","To ascend","To shine"],c:0,why:"God's glory is his substance and significance made perceptible — English glory is a thinner word."},
{q:"Solomon's dedication prayer notably includes provision for:",a:["Foreign kings paying tribute","The foreigner who comes from a far country to pray","The abolition of sacrifice","A second temple"],c:1,why:"A Gentile clause built into the dedication of the building itself."},
{q:"On Yom Kippur the second goat was:",a:["Given to the high priest's household","Burned outside the camp","Sent alive into the wilderness bearing confessed sins","Offered as a burnt offering"],c:2,why:"Two motions of one atonement: sin paid for by death and carried away by removal."},
{q:"In Ezekiel's vision, where does the glory stop after leaving the city?",a:["In the wilderness of Judah","Over Babylon","Above the Jordan","On the mountain east of the city — the Mount of Olives"],c:3,why:"A detail the gospel writers appear to have in view when Jesus arrives from and ascends from that same mountain."},
{q:"The most unsettling feature of Ezekiel 8–11 for a worship leader is that:",a:["The temple continued to function normally after the presence departed","The building was destroyed immediately","The priests repented at once","The idolatry was committed by foreigners"],c:0,why:"Right building, right personnel, right liturgy, uninterrupted — and empty."},
{q:"Jeremiah 7 warns against:",a:["Rebuilding the temple","Treating the phrase the temple of the LORD as a charm that guarantees safety","Foreign alliances","Sacrificing outside Jerusalem"],c:1,why:"Trust in the building rather than in covenant faithfulness."},
{q:"When Paul tells the Corinthians they are God's naos, the pronoun is:",a:["Hypothetical","Singular — each individual believer","Plural — the congregation collectively","Addressed only to the leaders"],c:2,why:"The community together is the inner sanctuary. English you obscures what Greek makes plain."},
{q:"Revelation 21 says the new city has no temple because:",a:["It has not yet been built","The nations are excluded","Worship has ceased","God and the Lamb are its temple"],c:3,why:"The distinction between sacred space and ordinary space is finally abolished."}]},

{id:14,phase:3,title:"Worship in Israel",sub:"Levites, Asaph, and the sound of the temple",
aim:"Recover the shape and vocabulary of organised worship in Israel, and what it implies for leading now.",
sections:[
{h:"A department, not a hobby",p:[
"1 Chronicles 23 records David setting apart four thousand Levites to praise the LORD with instruments he made for that purpose. Chapter 25 describes the musicians being separated for service “to prophesy with lyres, harps and cymbals” — and then organised into twenty-four courses by lot, exactly as the priests were.",
"Three named leaders head the guilds: Asaph, Heman and Jeduthun. Psalms 50 and 73 to 83 carry Asaph's name; Psalm 88 is attributed to Heman; Jeduthun appears in the headings of Psalms 39, 62 and 77. These are not anonymous volunteers. They are a hereditary professional body with training, rotas, repertoire and, in 1 Chronicles 15:22, a director appointed “because he was skilful.”",
"That verse is worth sitting with. Skill is named as a qualification for leading worship, in the same breath as consecration."]},
{h:"The vocabulary of praise",p:[
"Hebrew has at least seven common words for praise, and they are not synonyms. הָלַל (halal) is to boast, to be clamorously foolish about something — the root of hallelujah. יָדָה (yadah) is to throw or extend the hands, praise as physical gesture. בָּרַךְ (barak) is to kneel, to bless. זָמַר (zamar) is to make music with strings. שִׁיר (shir) is simply to sing. תְּהִלָּה (tehillah) is a song of praise, and the Hebrew title of the Psalms is תְּהִלִּים (Tehillim), praises. שָׁבַח (shabach) is to shout, to commend loudly.",
"Notice how many involve the body and the voice at volume. Israel's worship vocabulary assumes posture, gesture and noise. It also assumes instruments: lyre, harp, tambourine, ram's horn, silver trumpets, and cymbals — 1 Chronicles 15 specifies loud-sounding cymbals."]},
{h:"Antiphony and the shape of a service",p:[
"Much of Israel's worship was responsive. Psalm 136 alternates a leader's line with the congregation's refrain twenty-six times: “for his steadfast love endures forever.” Ezra 3 describes the returned exiles singing responsively at the foundation of the second temple. Nehemiah 12 has two great choirs walking in opposite directions along the wall until they meet at the temple.",
"The Psalms of Ascent, Psalms 120 to 134, appear to be pilgrim songs sung on the way up to Jerusalem for festivals. Read in order they move from distress in a distant place, through the journey, to standing in the courts and blessing the LORD by night. It is a liturgy of arrival.",
{aside:{t:"Selah",p:"סֶלָה (selah) appears seventy-one times in the Psalms and three times in Habakkuk, and nobody knows for certain what it means. The likeliest options are a musical instruction — a pause, an interlude, a lifting of volume — from a root meaning to lift up. Whatever it is, it is a direction to the performers that survived into the text, which tells you these were working scores."}}]},
{h:"From temple to synagogue to now",p:[
"The exile removed the temple and produced the synagogue: no sacrifice, but Scripture read, translated, expounded and prayed, in whatever town you found yourself. When the second temple was destroyed in AD 70, that portable structure was already in place and became the norm.",
"The early church inherited both streams — the psalms and the synagogue's shape — and Paul names three categories in Ephesians 5:19 and Colossians 3:16: ψαλμοί (psalmoi), ὕμνοι (hymnoi), ᾠδαὶ πνευματικαί (ōdai pneumatikai). Psalms, hymns and songs of the Spirit. Whatever the precise distinctions, the point is breadth: inherited texts, composed praise, and spontaneous song, all in the same sentence.",
"And Colossians 3:16 attaches a function that is easy to miss: singing is how the word of Christ dwells in a community richly, teaching and admonishing one another. Congregational song is a teaching ministry. What a church sings for a decade is what it will believe."]}],
words:[
{o:"הָלַל",tr:"halal",lang:"he",gl:"to boast, to praise clamorously",n:"The root of hallelujah. Praise as unembarrassed acclaim, not decorum."},
{o:"יָדָה",tr:"yadah",lang:"he",gl:"to throw or extend the hands",n:"Praise as physical gesture — the body is part of the vocabulary."},
{o:"זָמַר",tr:"zamar",lang:"he",gl:"to make music with strings",n:"Behind mizmor, psalm — a song accompanied by instruments."},
{o:"תְּהִלִּים",tr:"Tehillim",lang:"he",gl:"praises",n:"The Hebrew title of the Psalter — though a third of it is lament. The book is named for where it is going."},
{o:"סֶלָה",tr:"selah",lang:"he",gl:"uncertain — pause, lift, interlude",n:"Seventy-one occurrences. A performance direction that survived into the canonical text."},
{o:"ᾠδαὶ πνευματικαί",tr:"ōdai pneumatikai",lang:"gk",gl:"spiritual songs",n:"The third of Paul's three categories, alongside psalms and hymns. Breadth, not a single style."}],

{q:"Colossians 3:16 links singing to which function?",a:["Preparing for sacrifice","Marking the festival calendar","Evangelism of outsiders","Teaching and admonishing one another so the word dwells richly"],c:3,why:"Congregational song is a teaching ministry, which raises the stakes on repertoire considerably."}]},

{id:15,phase:3,title:"The divided kingdom and the prophets",sub:"Nabi, covenant lawsuit",
aim:"Learn what prophets actually did, and why most prophecy is prosecution rather than prediction.",
sections:[
{h:"Two kingdoms, one indictment",p:[
"After Solomon the kingdom splits: ten tribes in the north under Jeroboam, keeping the name Israel; Judah and Benjamin in the south under Rehoboam, keeping Jerusalem and the temple. The north immediately sets up golden calves at Bethel and Dan so its people will not travel to Jerusalem to worship — a political solution with a theological price, and every northern king afterwards is measured against it.",
"The north has nine dynasties in two hundred years and no king the text calls good. Assyria destroys Samaria in 722 BC. The south has one dynasty throughout — the Davidic line — and a handful of genuine reformers, notably Hezekiah and Josiah. It lasts until Babylon takes Jerusalem in 586 BC."]},
{h:"What a prophet is",p:[
"נָבִיא (nabi) most likely means one who is called, or one who calls out — a spokesman. The prophet is not primarily a predictor but a messenger, and the recurring formula is כֹּה אָמַר יְהוָה (koh amar YHWH), thus says the LORD — the standard opening of a royal envoy delivering a king's message verbatim.",
"The office had two older names: רֹאֶה (ro'eh), seer, and חֹזֶה (chozeh), visionary. 1 Samuel 9:9 notes the shift in terminology, which tells you the tradition was self-aware about its own vocabulary.",
"The prophet's home genre is the רִיב (riv), covenant lawsuit. Micah 6 is the clearest example: “hear the indictment of the LORD… he has an indictment against his people.” Heaven and earth, the witnesses called at Sinai, are summoned. The charges are read. The evidence — what God has done for them — is presented. The verdict follows. This is a courtroom, and the defendant agreed to the terms."]},
{h:"The charges",p:[
"Two recur above all others. Idolatry: covenant infidelity, described almost always in the language of adultery, which is why Hosea is commanded to marry Gomer and why Ezekiel 16 and 23 are as brutal as they are. And injustice: the treatment of the poor, the widow, the orphan and the resident foreigner, together with dishonest weights, land seizure and corrupt courts.",
"Crucially, the prophets refuse to let worship substitute for justice. Amos 5 has God saying he hates and despises their festivals, will not accept their offerings, and — the line worth memorising — “take away from me the noise of your songs; to the melody of your harps I will not listen.” Isaiah 1 says the same about prayer; Isaiah 58 about fasting; Micah 6:8 gives the alternative in three clauses: do justice, love hesed, walk humbly with your God.",
{aside:{t:"The uncomfortable application",p:"Amos is not addressing a congregation that had stopped singing. He is addressing one whose music was excellent, whose festivals were well attended, and whose economics were predatory. The complaint is against the noise of songs offered by people crushing the poor. There is no version of this text that leaves a worship leader untouched."}}]},
{h:"Prediction in service of prosecution",p:[
"Prophets do speak about the future, but the future almost always functions as consequence or promise inside the lawsuit: this is what breach brings, this is what faithfulness would bring, and beyond the judgement there is restoration.",
"That last note is nearly universal. Almost every prophetic book that pronounces devastation also promises something on the far side: a new covenant written on hearts in Jeremiah 31, a heart of flesh and a new Spirit in Ezekiel 36, dry bones standing up in Ezekiel 37, a shoot from the stump of Jesse in Isaiah 11, a servant who bears the sins of many in Isaiah 53. Judgement is not the last word, and the prophets say so while the judgement is still falling.",
"Deuteronomy 18 gives the test: if a prophet speaks in the LORD's name and the word does not come to pass, he has spoken presumptuously. Jeremiah 28 stages this brutally, with Hananiah announcing a two-year end to exile against Jeremiah's seventy years. Hananiah is more encouraging and Jeremiah is right."]}],

{id:16,phase:3,title:"Exile and return",sub:"Lament, hope, and a reshaped faith",
aim:"Understand the catastrophe that made much of the Old Testament what it is, and the small, honest return that followed.",
sections:[
{h:"The unthinkable",p:[
"586 BC destroyed four things at once: the city, the temple, the monarchy and the land. Each was a covenant promise with an address. If God had promised David a permanent throne and Zion an unbreakable dwelling, and both were now rubble, then either God had failed, or the gods of Babylon were stronger, or something else was true.",
"The theological work of the exile was to establish the third option. The prophets had said this would happen and why. So the catastrophe, appallingly, was evidence that God was still in charge and still keeping his word — the covenant curses were part of the covenant. Lamentations sits in the ruins and says both things: this is unbearable, and “his mercies are new every morning” — a sentence written by someone looking at a destroyed city."]},
{h:"Lament as faith",p:[
"Psalm 137 is the exile's rawest artefact. By the rivers of Babylon they sat and wept, hung up their lyres, and were asked by their captors for songs of Zion. “How shall we sing the LORD's song in a foreign land?” It ends with a line about infants and rocks that most churches will not read aloud.",
"That the psalm is in the canon is the point. Israel's faith had room for a prayer that ugly, addressed to God rather than acted out. Lament is not the opposite of faith; it is faith refusing to leave the room. Roughly a third of the Psalter is lament, and a worship diet that omits it teaches a congregation that grief has no liturgical home — which they will discover is false at the worst possible moment."]},
{h:"What exile produced",p:[
"Almost everything portable. The synagogue, because worship had to happen without a temple. A new emphasis on sabbath and circumcision as identity markers, because they travel. The consolidation and editing of Scripture, because the text now had to carry what the building had carried. Aramaic as everyday speech. And a set of prophecies — Ezekiel's new heart, Jeremiah's new covenant, Isaiah 40 to 55's servant and comfort — that reframe hope beyond national restoration.",
"Ezekiel's most important move is to insist that God's throne is mobile. Chapter 1's vision of wheels and living creatures, seen by a Babylonian canal, says the thing exiles most needed to hear: the presence is not confined to a building in a city that no longer stands."]},
{h:"The disappointing return",p:[
"Cyrus takes Babylon in 539 BC and issues a decree permitting return — a policy recorded on the Cyrus Cylinder and applied to many peoples. Isaiah 45 calls him God's מָשִׁיחַ (mashiach), anointed, which is startling: a pagan emperor given the title.",
"About fifty thousand return. The second temple's foundation is laid, and Ezra 3 records the old men who had seen the first house weeping loudly while others shouted for joy, so that nobody could distinguish the weeping from the shouting. Haggai asks directly: who is left among you who saw this house in its former glory? Is it not as nothing in your eyes?",
"There is no king. Persian rule continues. The glory does not visibly return to the temple. Nehemiah rebuilds walls under threat, Ezra reads the law and the people weep, reforms are enacted and partially reversed. Malachi closes with a people going through the motions, offering blemished animals, and asking “how have we wearied him?” — and with a promise that the LORD will suddenly come to his temple, and that Elijah will come first.",
{aside:{t:"Where the Old Testament ends",p:"On a promise, in a small province, with a modest temple, no king, foreign rule and a tired priesthood. The story is unmistakably unfinished, and the last book says so out loud. Four hundred years later a man in the wilderness dressed like Elijah starts baptising people, and the crowds ask him precisely the question Malachi planted."}}]}],

recap:["586 BC destroyed city, temple, monarchy and land — four promises with addresses.","The prophets had said why, so the catastrophe became evidence that God was keeping his word, not breaking it.","Psalm 137 is in the canon. Lament is faith refusing to leave the room.","Exile produced the synagogue, the edited Scriptures, sabbath as portable identity, and Ezekiel's mobile throne.","Cyrus is called mashiach in Isaiah 45. The category is wider than anyone expected.","The Old Testament ends small: no king, foreign rule, blemished offerings — and a promise about Elijah."],

{q:"Psalm 137's inclusion in the canon demonstrates that:",a:["Israel approved of violence against infants","Israel's worship had room for prayers of raw anguish addressed to God","The psalm was written by a foreigner","Lament was permitted only in private"],c:1,why:"Lament is faith refusing to leave the room — and roughly a third of the Psalter is lament."},
{q:"Ezekiel's opening vision of a wheeled throne mattered to exiles because it showed:",a:["That the temple would be rebuilt identically","That Babylon would fall soon","That God's presence is not confined to a building in a destroyed city","That angels were fighting for Israel"],c:2,why:"A mobile throne, seen by a Babylonian canal, addressed to people who thought presence had an address."},
{q:"Isaiah 45:1 applies the title mashiach, anointed, to:",a:["Ezra","The high priest Joshua","Zerubbabel","Cyrus, the Persian emperor"],c:3,why:"A pagan ruler given the title — evidence that the category was wider than expected."},
{q:"Ezra 3 records that at the second temple's foundation:",a:["Weeping and shouting could not be distinguished from each other","The work was halted immediately","The glory filled the house","The whole nation rejoiced together"],c:0,why:"Older men who had seen the first house wept while others shouted for joy."},
{q:"Qinah refers to:",a:["A festival song","A dirge in a limping metre where the line falls short","A prophetic oracle","A pilgrimage psalm"],c:1,why:"Lamentations uses the metre deliberately — the rhythm itself does not complete."},
{q:"The exile is largely responsible for the development of:",a:["The priesthood","The sacrificial system","The synagogue, and sabbath and circumcision as portable identity markers","The monarchy"],c:2,why:"Worship had to survive without temple or land, so it became text-centred and portable."},
{q:"Malachi closes the Old Testament with:",a:["The coronation of a new king","The return of the ark","The rebuilding of the temple","A promise that the LORD will come to his temple and that Elijah will come first"],c:3,why:"Which is exactly the question the crowds put to John the Baptist four centuries later."}]}

{id:17,phase:4,title:"The Psalter",sub:"Five books, superscriptions, shape",
aim:"See the Psalms as an edited book with an argument, not a random anthology of religious poems.",
sections:[
{h:"A book, deliberately arranged",p:[
"The Psalter is divided into five books, each closing with a doxology: 1–41, 42–72, 73–89, 90–106, 107–150. The fivefold shape is almost certainly deliberate — a Torah of praise answering the Torah of Moses, and early Jewish commentary says exactly that.",
"Psalms 1 and 2 have no superscriptions and function together as a paired gateway. Psalm 1 sets the two ways: the one who delights in torah, and the wicked who are chaff. Psalm 2 sets the king: nations rage, God installs his son on Zion. Torah and king, the two pillars, standing at the door. Psalm 1 opens with אַשְׁרֵי (ashrei), blessed, and Psalm 2 closes with the same word — an envelope around the pair.",
"The book ends with five psalms each beginning and ending with hallelujah, and Psalm 150 is nothing but instruments and praise. The last word of the Hebrew Psalter is hallelujah."]},
{h:"The argument of the shape",p:[
"Book 3 ends at Psalm 89, which recites the Davidic covenant at length and then collapses: “you have renounced the covenant with your servant; you have defiled his crown in the dust… Lord, where is your steadfast love of old?” It is the exile's question, placed at the structural centre of the book.",
"Book 4 answers it in an unexpected register. It opens with Psalm 90, the only psalm attributed to Moses — reaching back past David to before there was a monarchy — and its dominant refrain is יְהוָה מָלָךְ (YHWH malakh), the LORD reigns. When the human throne is empty, the psalms return to the throne that never was.",
"Book 5 then moves through the Egyptian Hallel, the Songs of Ascent, the great acrostic of Psalm 119 and a final David collection to the closing hallelujahs. The book travels from torah and king, through catastrophe, to unqualified praise. That is not an accident of collection; it is an argument about how faith survives."]},
{h:"Reading the superscriptions",p:[
"One hundred and sixteen psalms carry headings, and in the Hebrew Bible they are verse one — part of the text, not editorial furniture. They contain several kinds of information.",
"Attribution: לְדָוִד (ledavid) is usually rendered of David, but the preposition can mean by, for, or belonging to the David collection. Seventy-three psalms carry it. Twelve are Asaph's, eleven the sons of Korah, one Moses, two Solomon.",
"Occasion: fourteen Davidic psalms name a historical setting — Psalm 51 “when Nathan the prophet came to him, after he had gone in to Bathsheba,” Psalm 3 when he fled from Absalom. These headings invite you to read the poem against the narrative.",
"Performance: lamnatzeach, to the choirmaster, in fifty-five psalms. Instrument notes like נְגִינוֹת (neginot), stringed instruments. And tune names — “the doe of the dawn” at Psalm 22, “lilies,” “do not destroy” — which appear to be the melodies these words were sung to. Somebody's worship set list is embedded in Scripture.",
{aside:{t:"Psalm 22, tuned",p:"The heading of Psalm 22 says al ayyelet hashachar, on the doe of the dawn. The psalm that opens with my God, my God, why have you forsaken me was sung to a named tune. The music director had a chart for it. That detail alone should change how you think about the relationship between craft and lament."}}]},
{h:"How to use it",p:[
"Athanasius observed that most of Scripture speaks to us, but the Psalms speak for us. They are the only book that is primarily words addressed to God rather than from him, which is why they have been the church's prayer book for two thousand years and why monastic communities have read the whole Psalter weekly.",
"For a worship leader the practical implication is a diet question. The Psalter's proportions are roughly forty percent lament, with praise, thanksgiving, wisdom, royal and enthronement psalms making up the rest. Any repertoire that does not roughly reflect that range is teaching a partial doctrine of God by omission."]}],

{id:18,phase:4,title:"Genres of psalm",sub:"Lament, hymn, thanksgiving, royal, imprecatory",
aim:"Identify what kind of psalm you are holding, and let its form shape how you pray and lead it.",
sections:[
{h:"Why genre matters here",p:[
"A psalm's type determines its logic. Lament moves; hymn dwells; thanksgiving testifies. If you read a lament expecting resolution in the first line, or a hymn expecting narrative, you will fight the poem instead of praying it. Hermann Gunkel's form-critical categories, refined since, remain the most useful practical tool a worship leader can carry."]},
{h:"Lament: the largest category",p:[
"Around a third to forty percent of the Psalter. The standard movement has six elements, and most laments contain most of them: an address to God, often abrupt; the complaint, stating the trouble plainly, whether from enemies, illness, or God's own apparent absence; a confession of trust, usually beginning with a hinge word like אֲבָל or אֲנִי — “but I”; the petition, asking specifically; sometimes a vow of praise; and a closing turn to praise or assurance.",
"The turn is the crucial feature. Almost every lament pivots — “but I have trusted in your steadfast love” — and the pivot is usually unexplained. Nothing in the circumstances has changed. Psalm 13 goes from “how long will you forget me forever?” to “I will sing to the LORD, because he has dealt bountifully with me” in six verses with no reported deliverance in between.",
"The great exception is Psalm 88, which never turns. It ends: “darkness is my closest friend.” The Psalter keeps one psalm that does not resolve, which is a pastoral decision of extraordinary generosity — because some seasons do not resolve, and the person in that season needs to find themselves in the book."]},
{h:"Hymn, thanksgiving, and the rest",p:[
"The descriptive hymn has a simple form: a call to praise, the reasons (usually introduced by כִּי, ki, for), and a renewed call. Psalm 117 does the whole thing in two verses. The reasons are typically God's character or his acts in creation and history.",
"Thanksgiving is narrative and personal: I was in trouble, I cried out, he heard, and here is what happened — often with a public element, telling the congregation. Psalm 30 and 116 are models. It is the answered lament, coming back to report.",
"Royal psalms concern the king — coronation, wedding, battle — and were preserved after the monarchy ended, which is precisely how they became messianic. Psalms 2, 45, 72 and 110 are the most quoted in the New Testament. Enthronement psalms (93, 95–99) celebrate YHWH's own kingship. Wisdom psalms (1, 37, 49, 73, 112, 119) teach rather than pray. Songs of Zion (46, 48, 76, 84, 122) celebrate the city. Trust psalms (23, 62, 91, 131) are laments with the anxiety already resolved. Torah psalms (1, 19, 119) delight in instruction."]},
{h:"The imprecatory problem",p:[
"Psalms 35, 58, 69, 83, 109 and 137 call down violence on enemies. Psalm 109 asks that a man's children be fatherless and his wife a widow. These are in the canon and cannot be quietly dropped.",
"Several things help. They are prayers, not plans — the violence is handed to God rather than enacted, which is the crucial distinction between Psalm 137 and a raid. They appeal to God's justice in a world where the poor had no other court. They are frequently quoting the covenant curses back to God, asking him to do what he said. They are honest about a rage that exists whether or not it is spoken, and Scripture would rather it be spoken to God than nursed.",
"And they sit under a canonical trajectory that ends with Jesus praying for his executioners, and Stephen doing the same while being stoned. The imprecatory psalms are not the last word on enemies. But they are a real word about what to do with fury before you have got anywhere near forgiveness, and pretending otherwise produces congregations who think their worst feelings are unmentionable in church."]}],

{id:19,phase:4,title:"Hebrew poetry",sub:"Parallelism, imagery, and hesed",
aim:"Read Hebrew poetry the way it is built, and understand the covenant word that holds it together.",
sections:[
{h:"Rhyme of thought",p:[
"Hebrew poetry does not rhyme sounds or count syllables in a fixed metre. It rhymes ideas. Robert Lowth named the phenomenon parallelism in 1753, and the basic observation has held: lines come in pairs, and the second line does something to the first.",
"Synonymous parallelism restates: “the heavens declare the glory of God; the skies proclaim the work of his hands.” Antithetic parallelism contrasts, and dominates Proverbs: “the LORD watches over the way of the righteous, but the way of the wicked will perish.” Synthetic or constructive parallelism advances the thought rather than mirroring it.",
"The most useful refinement is James Kugel's: the second line is rarely mere repetition. The pattern is closer to “A, and what's more, B.” The second line sharpens, intensifies, specifies or completes. When you read a psalm, ask what the second line adds — that is usually where the point lives."]},
{h:"Other structures",p:[
"Chiasm mirrors elements around a centre: A B C B' A'. The centre carries the weight. Psalm 67 is a clean example, and once you start seeing chiasms you will find them structuring whole chapters and books.",
"Inclusio brackets a unit by repeating a phrase at start and end. Psalm 8 opens and closes with “O LORD, our Lord, how majestic is your name in all the earth” — everything between is contained by that frame.",
"Acrostics run through the Hebrew alphabet. Psalm 119 gives eight verses to each of the twenty-two letters, and every verse in a stanza begins with that letter. Lamentations 1, 2 and 4 are acrostic, and chapter 3 triples it — grief given the most rigid available form, which is itself a statement about holding structure when everything else has collapsed. Psalm 145 is acrostic and, notably, is missing the letter nun in the Masoretic text; a Dead Sea Scroll copy supplies the missing line."]},
{h:"Imagery that stays concrete",p:[
"Hebrew poetry works by image rather than abstraction. God is a rock, a shield, a fortress, a shepherd, a horn of salvation, a hen, a mother in labour, a bear robbed of her cubs. The soul pants like a deer, melts like wax, is weaned like a child. Bones grow old, kidneys instruct, the nose burns with anger.",
"Two habits follow. First, do not rush an image into a proposition — “the LORD is my shepherd” is doing work that “God provides for me” cannot do, and the work is done by the picture. Second, notice when images are mixed on purpose, as Psalm 23 moves from a field to a table and Psalm 91 from a fortress to a bird's wings. The change of register is part of the argument."]},
{h:"Hesed, and why English needs four words for it",p:[
"חֶסֶד (hesed) is the most theologically loaded word in the Old Testament and the hardest to translate. English versions offer steadfast love, lovingkindness, mercy, unfailing love, loyal love, faithfulness — and Tyndale coined lovingkindness precisely because nothing existing would do.",
"Its core is faithfulness inside a relationship, going beyond what is owed. It requires a bond to exist, it involves action rather than sentiment, it is typically shown by the stronger party to the weaker, and it persists when the other party has failed. It appears roughly 250 times, about half of them in the Psalms, and Psalm 136 repeats “his hesed endures forever” twenty-six times — once for every line, whatever the line says.",
"Exodus 34:6–7 is where God names himself with it: compassionate and gracious, slow to anger, abounding in hesed and emet. That formula is then quoted or alluded to across the Old Testament more than any other sentence — in Numbers, Nehemiah, Psalms, Joel, Jonah, Nahum. It functions as Israel's creed. Jonah even complains about it: I knew you were like this, which is why I ran.",
{aside:{t:"Why this matters for songwriting",p:"If hesed is God's most-repeated self-description, and roughly half its occurrences are in the songbook, then a repertoire that leans mainly on God's power and holiness while under-representing his covenant loyalty is out of proportion with the Bible's own worship material. Hesed is what Israel sang about most."}}]}],
words:[
{o:"חֶסֶד",tr:"hesed",lang:"he",gl:"covenant loyalty, steadfast love",n:"Faithfulness within a bond, beyond obligation, persisting after failure. Roughly 250 occurrences, half in the Psalms."},
{o:"אֱמֶת",tr:"emet",lang:"he",gl:"truth, reliability",n:"Paired with hesed in Exodus 34:6. From the root behind amen — truth as trustworthiness, not merely accuracy."},

{o:"נֶפֶשׁ",tr:"nefesh",lang:"he",gl:"throat, appetite, life, self",n:"Not an immaterial soul. The whole living person, often with the sense of hunger or need."},

{q:"Nefesh, often translated soul, more literally means:",a:["Breath of God","An immaterial spirit separable from the body","Throat, appetite, life — the whole living person","Mind or intellect"],c:2,why:"Hebrew anthropology is unified. The nefesh gets hungry."},

{id:20,phase:4,title:"Wisdom literature",sub:"Yirah, Job, Ecclesiastes",
aim:"Hold Proverbs, Job and Ecclesiastes together without flattening any of them, and see why the canon keeps all three.",
sections:[
{h:"Three books in argument",p:[
"Proverbs says: the world has a grain, live along it and things generally go well. Job says: sometimes they emphatically do not, and the standard explanation is not just inadequate but offensive. Ecclesiastes says: nothing stays, you cannot see the whole, and you will die — now eat your bread and enjoy your work.",
"The canon keeps all three without harmonising them, which is itself a wisdom teaching. Reality is not reducible to one register, and a faith that can only speak in the Proverbs voice will break the first time it meets a Job situation. Israel's answer was not to resolve the tension but to canonise it."]},
{h:"The fear of the LORD",p:[
"יִרְאַת יְהוָה (yirat YHWH) is called the beginning — רֵאשִׁית (reshit), the first and chief part — of knowledge and wisdom. The word covers a range from terror to reverence to awe, and the biblical usage sits mostly at the reverence end while never entirely losing the edge.",
"It is a posture before it is a feeling: the recognition that you are not the measure, that reality has an owner, and that your judgement is not the final court. Proverbs sets it against being חָכָם בְּעֵינָיו (chakham be'einav), wise in one's own eyes — the same construction as Judges' everyone did what was right in his own eyes.",
"חָכְמָה (chokmah) itself is skill before it is philosophy. It is used of Bezalel's craftsmanship, of sailors, of administrators. Biblical wisdom is competence at living, not abstract knowledge."]},
{h:"Job, and the friends who defended God wrongly",p:[
"The prologue tells the reader what none of the characters know: this is not punishment. Then thirty-five chapters of speeches in which the friends apply a rigid retribution theology — you suffer, therefore you sinned — with increasing cruelty, and Job refuses to accept it while never denying God's existence. He demands a hearing. He wants a mediator, an umpire who can lay a hand on both parties.",
"When God finally speaks he answers no questions. He asks seventy-odd of his own, about wild goats and ostriches and the storehouses of snow and two enormous creatures that serve no human purpose whatever. The effect is not a rebuke of Job's protest but a relocation of it: the world is vast, strange, and not organised around your case.",
"Then the sting: God tells the friends they have not spoken rightly about him, as Job has. The man who shouted is commended; the men who defended God with tidy theology are not. Job never learns why. He does get an encounter, which the book treats as the better outcome — “I had heard of you by the hearing of the ear, but now my eye sees you.”"]},
{h:"Ecclesiastes",p:[
"הֶבֶל (hevel) opens and closes the book and appears thirty-eight times. It literally means vapour, breath, mist — Abel's name is the same word. Meaningless is too strong and too modern; the sense is fleeting, insubstantial, impossible to grasp. You cannot hold it, not that it is worthless.",
"Qohelet's method is empirical: he tries pleasure, achievement, wealth, wisdom, and reports that each evaporates. The same fate meets the wise and the fool. Work passes to someone who may waste it. You cannot find out what God has done from beginning to end — the phrase תַּחַת הַשֶּׁמֶשׁ (tachat hashemesh), under the sun, marks the limit of his vantage point.",
"And yet the recurring refrain is not despair but a strange, stubborn contentment: eat your bread, drink your wine, enjoy your work and the person you love, because this is your portion and it is from God's hand. Received rather than achieved. The book ends by pointing past its own horizon — fear God and keep his commandments, for God will bring every deed into judgement.",
{aside:{t:"For worship",p:"These three books between them supply the honesty that keeps worship truthful. Proverbs gives you songs about a world that makes sense. Job gives you permission to protest inside faith rather than outside it. Ecclesiastes gives you a theology of ordinary Tuesday gladness that does not depend on anything being resolved. Most congregations have plenty of the first and almost none of the other two."}}]}],
words:[

{o:"חָכְמָה",tr:"chokmah",lang:"he",gl:"wisdom, skill",n:"Used of craftsmen and sailors before philosophers. Competence at living."},

{id:21,phase:5,title:"Second Temple Judaism",sub:"The four hundred years, the sects, the expectation",
aim:"Walk into the Gospels knowing the room — the parties, the pressures and the hopes Jesus stepped into.",
sections:[
{h:"The world Rome made",p:[
"By the time Luke 2 opens, Judea has been through Persian, Ptolemaic, Seleucid, Hasmonean and Roman control in four centuries. The formative trauma is Antiochus IV Epiphanes, who in 167 BC outlawed circumcision, sabbath and Scripture, and installed an altar to Zeus in the temple — the abomination of desolation of Daniel 11. The Maccabean revolt succeeded, the temple was rededicated (the origin of Hanukkah), and Judea had eighty years of independence under the Hasmoneans, who then became exactly the kind of corrupt dynasty they had rebelled against.",
"Pompey walked into the holy of holies in 63 BC. Herod the Great, an Idumean client king, rebuilt the temple on a colossal scale and murdered members of his own family. By the first century Judea is under a Roman prefect, taxed, garrisoned, and periodically convulsed by revolts that end with mass crucifixions along the roads."]},
{h:"The parties",p:[
"Pharisees: a lay renewal movement, numbering a few thousand on Josephus's figure, committed to applying priestly purity to ordinary life through an oral tradition alongside the written Torah. They believed in resurrection, angels and providence. They were popular, they were serious, and they controlled the synagogues rather than the temple. Paul was one, and remained willing to say so in the present tense.",
"Sadducees: the priestly aristocracy, temple-based, wealthy, cooperating with Rome to preserve their position. They accepted only the Torah as authoritative and denied resurrection, angels and spirits — which is why the question about the woman with seven husbands is a trap designed by people who think the whole idea is absurd. They vanish with the temple in AD 70.",
"Essenes: a separatist community, most likely the group behind the Dead Sea Scrolls at Qumran, who regarded the Jerusalem priesthood as illegitimate, withdrew to the desert, practised ritual washing and communal ownership, and expected an imminent final war.",
"Zealots: the revolutionary option, holding that paying tribute to Caesar was treason against God. One of the Twelve is called Simon the Zealot. They drove the revolt of AD 66 that ended with the temple in ruins.",
"And beneath all four, the עַם הָאָרֶץ (am ha'aretz), the people of the land — the majority, too poor and too busy to keep the purity code, looked down on by the pious. These are the crowds."]},
{h:"What they were waiting for",p:[
"Messianic expectation was neither uniform nor vague. Most hoped for a Davidic king who would drive out the occupier and restore the kingdom. Qumran appears to have expected two messiahs, one priestly and one royal. Some looked for a prophet like Moses; some for the Son of Man of Daniel 7 coming with the clouds.",
"What almost nobody expected was a messiah who would be executed by the occupier. Crucifixion was not merely a death but a public statement of total defeat, and Deuteronomy 21:23 declared anyone hung on a tree to be cursed. That is why the resurrection is not a decorative addition to the story. Without it, the crucifixion is a straightforward refutation of the claim."]},
{h:"The furniture of first-century faith",p:[
"Synagogue: present in every town, with a Torah scroll, a reading, a translation into Aramaic, exposition and prayer. Jesus attends as a matter of course.",
"Festivals: Passover, Pentecost and Tabernacles brought pilgrims to Jerusalem, swelling the city many times over — which is why the authorities were nervous during Passover week, and why a triumphal entry into a packed city was so dangerous.",
"The Septuagint, giving Greek-speaking Jews across the empire a shared Bible and Christian preachers a shared vocabulary. Synagogues throughout the Mediterranean, each with a fringe of interested Gentiles — the God-fearers — who turn out to be the seedbed of the early church.",
{aside:{t:"Why this lesson matters",p:"Nearly every argument Jesus has in the Gospels makes better sense once you know who is asking and what they have at stake. A Pharisee's question about handwashing is not fussiness; it is a serious programme for national holiness under occupation. A Sadducee's question about resurrection is not curiosity; it is a defence of a theological position that also happens to protect a political one."}}]}],

{id:22,phase:5,title:"Four gospels, one Jesus",sub:"Genre, audience, purpose",
aim:"Read each gospel for its own argument, and understand why four portraits are a strength rather than a problem.",
sections:[
{h:"What kind of writing is this?",p:[
"The Gospels most closely resemble ancient βίος (bios), Greco-Roman biography — a genre that selects episodes to display a person's character and significance rather than narrating a life chronologically from cradle to grave. Ancient biography was not expected to preserve strict sequence, and it routinely arranged material thematically.",
"That single observation dissolves a great many apparent contradictions. Matthew gathering teaching into five great discourses is not a claim that Jesus said it all on one hillside. John placing the temple cleansing early is not necessarily a chronological claim against the Synoptics. εὐαγγέλιον (euangelion) itself was imperial vocabulary — the announcement of a birth or a victory of the emperor. Mark's opening line borrows the language of the empire and applies it to a Galilean."]},
{h:"The Synoptic relationship",p:[
"Matthew, Mark and Luke are called synoptic, seen together, because of extensive shared material, often word for word. Around ninety percent of Mark appears in Matthew. The most widely held explanation is that Mark was written first, that Matthew and Luke used it, and that they also shared a further body of sayings material conventionally labelled Q, plus material unique to each.",
"None of this is a threat. Luke says openly in his prologue that many have undertaken accounts, that he has investigated everything carefully, and that he is writing an orderly account for Theophilus. Ancient readers expected authors to use sources. The claim of inspiration has never required that writers stopped doing research."]},
{h:"Four portraits",p:[
"Mark: the shortest, fastest and earliest, probably written for a Roman audience under pressure. εὐθύς (euthys), immediately, appears more than forty times. Jesus acts before he explains; the disciples repeatedly fail to understand; and the first human being in the book to confess him as Son of God is the centurion at the cross. The theme is a kingdom that comes through suffering, addressed to people who might have to suffer for it.",
"Matthew: written for a Jewish-Christian readership. Opens with a genealogy tracing Jesus to David and Abraham. Uses the formula “this took place to fulfil what was spoken by the prophet” more than a dozen times. Structures teaching into five discourses, echoing the five books of Moses, and presents Jesus as the new Moses — down to escaping a slaughter of infants and coming out of Egypt. Closes with all authority and a commission to all nations.",
"Luke: the most literary Greek, addressed to Theophilus, and volume one of a two-part work. The emphases are the poor, women, Samaritans, tax collectors, prayer, the Spirit and joy. Only Luke gives us the good Samaritan, the prodigal son, Zacchaeus and the Magnificat. His Jesus is the saviour of the outsider, and Acts continues the movement outward from Jerusalem to Rome.",
"John: written last and structured differently — seven signs, seven I am sayings, long discourses instead of parables, and a prologue that starts before Genesis 1. About ninety percent of its content is unique. Its purpose is stated explicitly in 20:31: these are written so that you may believe, and that believing you may have life."]},
{h:"Why four is better than one",p:[
"A single official version would be easier to defend and far less useful. Four accounts, agreeing on the shape and differing in detail and emphasis, are what testimony actually looks like — and the early church's willingness to keep all four, including the tensions, is itself evidence of a certain honesty. Tatian's second-century attempt to merge them into a single harmony was eventually set aside in favour of the four.",
"Practically, read each one whole and on its own terms before harmonising. Ask what this writer includes, omits, and places where. The differences are the interpretation, and they are the point."]}],

{o:"εὐαγγέλιον",tr:"euangelion",lang:"gk",gl:"good news, announcement",n:"Imperial vocabulary for the proclamation of an emperor's birth or victory, redirected to a Galilean."},
{o:"βίος",tr:"bios",lang:"gk",gl:"a life, ancient biography",n:"The Gospels' closest genre — episodes selected to display significance, not strict chronology."},

{id:23,phase:5,title:"Kingdom and parables",sub:"Basileia, fulfilment, the already and not yet",
aim:"Understand the central subject of Jesus's preaching and the strange teaching form he chose for it.",
sections:[
{h:"The announcement",p:[
"Mark summarises Jesus's message in a sentence: the time is fulfilled, the βασιλεία (basileia) of God is at hand, repent and believe the good news. Basileia is the reign of a king rather than the territory he rules — an activity, not a place. So the kingdom is not somewhere we go when we die; it is God's rule breaking into history now.",
"Matthew writes kingdom of heaven where the others write kingdom of God — a Jewish circumlocution avoiding the divine name, not a different kingdom. And Jesus's opening at Nazareth is a deliberate act: he reads Isaiah 61, stops mid-sentence before the day of vengeance, sits down and says today this Scripture is fulfilled in your hearing. The stopping point is the sermon."]},
{h:"Already and not yet",p:[
"The kingdom is announced as present — it has come upon you, it is among you, the strong man is being bound — and as future — thy kingdom come, they will come from east and west and recline at table. Both are true simultaneously, and holding them together resolves most of the confusion about Christian experience.",
"George Ladd's phrase for it, the already and the not yet, describes a kingdom genuinely inaugurated and not yet consummated. This is why healing happens and people still die; why the church is real and disappointing; why we can sing with confidence and still ask how long. Collapse the tension either way and you get either triumphalism that cannot account for suffering, or a deferred faith that expects nothing now."]},
{h:"Why parables",p:[
"Around forty parables, and Mark says he did not speak to the crowds without one. The word παραβολή (parabolē) translates Hebrew מָשָׁל (mashal) — a comparison, a riddle, a saying that works by likeness. Parables are not simple illustrations that make hard ideas easy. Mark 4 says something far stranger: that they are told so that seeing they may not perceive, quoting Isaiah 6.",
"The best explanation is that a parable is a sorting mechanism. It draws in anyone willing to listen, defers judgement until the hearer has already agreed with the story, and then lands. Nathan's parable of the ewe lamb is the model: David convicts himself before he knows he is the defendant. A parable disarms first and detonates second, which is why they were dangerous enough to contribute to Jesus's arrest — the tenants in the vineyard was heard, correctly, as being about the people listening.",
{aside:{t:"How to read one",p:"Look for the single main point rather than allegorising every detail. Ask what would have surprised or offended the original audience — a Samaritan as the hero, a shepherd abandoning ninety-nine sheep, a father running, a landowner paying identical wages. The offence is usually the message. And notice who Luke says is listening: the parables of chapter 15 are told in answer to a complaint about the company Jesus keeps."}}]},
{h:"The upside-down shape",p:[
"The kingdom's values invert the expected order at nearly every point. The first will be last. The greatest is the servant. Entry requires becoming like a child — which in that culture meant accepting a status with no honour, not being innocent. The Beatitudes pronounce blessing on the poor in spirit, the mourning and the persecuted. The banquet is filled with people dragged in from the roads because the invited guests would not come.",
"And it grows in ways that are easy to miss. A mustard seed. Yeast worked through dough — an image that would have registered as slightly unclean and subversive rather than homely. Seed scattered that grows while the farmer sleeps and he does not know how. The kingdom in Jesus's parables is small, hidden, unstoppable and frequently unwelcome."]}],

{o:"βασιλεία",tr:"basileía",lang:"gk",gl:"reign, kingly rule",n:"An activity before a territory. God's rule breaking in, not a destination after death."},
{o:"παραβολή",tr:"parabolē",lang:"gk",gl:"a placing alongside, comparison",n:"Translating Hebrew mashal — a riddle or likeness, not a simple illustration."},
{o:"μετανοέω",tr:"metanoéō",lang:"gk",gl:"to change one's mind, turn around",n:"Not merely to feel sorry. A reversal of direction, matching Hebrew shuv."},
{o:"πεπλήρωται",tr:"peplērōtai",lang:"gk",gl:"the time has been fulfilled",n:"Perfect tense in Mark 1:15 — the moment has arrived and stands arrived."},
{o:"καιρός",tr:"kairos",lang:"gk",gl:"the appointed moment",n:"As distinct from chronos, clock time. The kingdom arrives at a right time, not merely a date."},
{o:"μυστήριον",tr:"mystērion",lang:"gk",gl:"a disclosed secret",n:"Mark 4:11 — the secret of the kingdom is given, not withheld. Something revealed, not something obscure."}],

{id:24,phase:5,title:"Cross and atonement",sub:"Pesach, hilastērion, and the language of the cross",
aim:"Hold the New Testament's several images of the cross together without collapsing them into a single theory.",
sections:[
{h:"The week",p:[
"All four gospels devote disproportionate space to the final week — roughly a third of Mark. Whatever else they are, these are passion narratives with extended introductions. The sequence is deliberate: an entry that claims kingship, an action in the temple that claims authority over it, days of confrontation, a Passover meal reinterpreted, an arrest, a trial before the Sanhedrin, a trial before Pilate, and a Roman execution.",
"The charge that sticks with Rome is political — king of the Jews — and Pilate has it written above the cross in three languages. The charge that matters to the Sanhedrin is blasphemy. Both are responding to the same claim."]},
{h:"The meal",p:[
"Jesus takes the Passover, a meal whose entire structure recounts the exodus, and changes the script. He takes bread that means the bread of affliction and says this is my body. He takes a cup that means the blood of the lamb and says this is my blood of the covenant, poured out for many. Luke and Paul add “the new covenant” — Jeremiah 31's promise, attached to a cup.",
"Every element of the Passover pointed backwards to a rescue. He turns them to point at himself, the night before he is killed, during the festival, in the city, while lambs are being slaughtered a few hundred yards away."]},
{h:"The images",p:[
"The New Testament describes what the cross accomplishes with several overlapping pictures, drawn from different areas of life. Reducing them to one produces a distorted theology; holding them together produces something like the full account.",
"Sacrifice, from the temple: Christ our Passover has been sacrificed; the lamb of God. ἱλαστήριον (hilastērion) in Romans 3:25 is the Septuagint's word for the mercy seat — the place where blood met the throne — and Paul says God put Christ forward as that place, publicly.",
"Redemption, from the slave market: ἀπολύτρωσις (apolytrosis), the price paid to free a slave; λύτρον (lytron), ransom, in Mark 10:45. Bought with a price.",
"Justification, from the law court: δικαιόω (dikaióō), to declare in the right. Not made innocent by pretence but reckoned righteous, with the verdict of the last day brought forward.",
"Reconciliation, from broken relationship: enemies made friends, the dividing wall demolished, both parties brought to one table.",
"Victory, from the battlefield: Colossians 2:15 has him disarming the powers and making a public spectacle of them, triumphing over them — in the very act by which they appeared to have won.",
"Substitution runs through several of these: the righteous for the unrighteous, he bore our sins, made sin who knew no sin. And example, in 1 Peter 2:21, though the same passage refuses to let example stand alone."]},
{h:"Isaiah 53 and the seven words",p:[
"The fourth servant song is quoted or echoed more than any other Old Testament passage in relation to the cross. Wounded for our transgressions, crushed for our iniquities, the chastisement that brought us peace, and by his wounds we are healed. The LORD laid on him the iniquity of us all. Written centuries earlier, it reads as a description.",
"From the cross itself the gospels record seven sayings: forgiveness for the executioners, paradise promised to a criminal, his mother entrusted to a disciple, the cry of dereliction quoting Psalm 22, I thirst, τετέλεσται — it is finished — and finally into your hands I commit my spirit, which is Psalm 31.",
"Two of the seven are psalms. He dies praying the songbook. And the cry of dereliction quotes the opening line of a psalm that ends in vindication and a declaration to the nations — which is either a coincidence or the point."]}],

{o:"ἀπολύτρωσις",tr:"apolytrōsis",lang:"gk",gl:"redemption, release by payment",n:"Slave-market language, continuous with the exodus verbs ga'al and padah."},
{o:"δικαιόω",tr:"dikaióō",lang:"gk",gl:"to justify, declare in the right",n:"A courtroom verb. The verdict of the last day pronounced now."},
{o:"καταλλαγή",tr:"katallagē",lang:"gk",gl:"reconciliation",n:"From the language of exchange and restored relationship — enemies brought to one table."},
{o:"ἀμνὸς τοῦ θεοῦ",tr:"amnos tou theou",lang:"gk",gl:"lamb of God",n:"John 1:29 — supplying the noun Abraham left unspoken on Moriah."},
{o:"τετέλεσται",tr:"tetélestai",lang:"gk",gl:"it has been finished",n:"Perfect tense, and the word written on receipts: paid in full."}],
