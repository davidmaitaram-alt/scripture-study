<title>Scripture study</title>
<style>
:root{
color-scheme: light;
--ink:#1c1a16; --ink2:#4d4a43; --ink3:#7e7a70; --ink4:#a9a498;
--page:#faf7f0; --card:#fffefb; --sunk:#f4f1e8; --line:#e8e3d6; --line2:#d6d1c0;
--accent:#3d5c8a; --accent-bg:#ecf1f8; --accent-line:#c6d5e8;
--gold:#a87a1e; --gold-bg:#faf2dd;
--green:#3d7a4f; --green-bg:#e9f3ea;
--red:#a8443c; --red-bg:#fbecea;
--plum:#6b4f7d; --plum-bg:#f2ecf5;
--r:10px;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-weight:500;margin:0;line-height:1.3;}
h1{font-size:26px;} h2{font-size:19px;} h3{font-size:16px;} h4{font-size:14px;}
p{margin:0 0 0.9em;}
a{color:var(--accent);}
button{font-family:inherit;font-size:14px;cursor:pointer;}
.btn{background:var(--card);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:8px 14px;transition:background .12s,border-color .12s;}
.btn:hover{background:var(--sunk);border-color:var(--ink4);}
.btn:active{transform:scale(.985);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.pri:hover{background:#35507a;border-color:#35507a;}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:default;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

#app{display:flex;min-height:100vh;align-items:stretch;}
#side{width:252px;flex:none;background:var(--sunk);border-right:1px solid var(--line);padding:14px 0 40px;overflow-y:auto;max-height:100vh;position:sticky;top:0;}
#main{flex:1;min-width:0;padding:26px 34px 80px;max-width:860px;}

.brand{padding:4px 16px 14px;}
.brand .bt{font-family:var(--serif);font-size:17px;letter-spacing:.01em;}
.brand .bs{font-size:11.5px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

.navlink{display:flex;align-items:center;gap:9px;padding:7px 16px;font-size:13.5px;color:var(--ink2);cursor:pointer;border-left:2px solid transparent;}
.navlink:hover{background:#ebe8df;}
.navlink.on{background:#e6e2d6;color:var(--ink);border-left-color:var(--accent);}
.navlink .pill{margin-left:auto;font-size:11px;background:var(--accent);color:#fff;border-radius:9px;padding:1px 6px;min-width:18px;text-align:center;}
.navsep{height:1px;background:var(--line2);margin:12px 16px;}

.ph{margin:0 0 2px;}
.phh{display:flex;align-items:center;gap:8px;padding:8px 16px 5px;cursor:pointer;}
.phh:hover{background:#ebe8df;}
.phn{font-size:10.5px;color:var(--ink4);letter-spacing:.07em;text-transform:uppercase;}
.pht{font-size:12.5px;color:var(--ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.phb{height:3px;border-radius:2px;background:var(--line2);width:34px;flex:none;overflow:hidden;}
.phb i{display:block;height:100%;background:var(--green);}
.lsn{display:flex;align-items:center;gap:8px;padding:4px 16px 4px 22px;font-size:13px;color:var(--ink2);cursor:pointer;border-left:2px solid transparent;}
.lsn:hover{background:#ebe8df;}
.lsn.on{background:#e6e2d6;color:var(--ink);border-left-color:var(--accent);}
.lsn .num{font-size:11px;color:var(--ink4);min-width:15px;font-variant-numeric:tabular-nums;flex:none;}
.lsn .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line2);}
.dot.done{background:var(--green);} .dot.prog{background:var(--gold);}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 14px;}
.sunk{background:var(--sunk);border-radius:var(--r);padding:14px 16px;}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px;}
.muted{color:var(--ink3);} .small{font-size:13px;}
.hr{height:1px;background:var(--line);margin:20px 0;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 16px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;}
.stat .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);}
.stat .v{font-family:var(--serif);font-size:27px;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums;}
.stat .s{font-size:11.5px;color:var(--ink4);}

.bar{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s;}

.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;}
.gc{aspect-ratio:1;border-radius:5px;background:var(--sunk);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--ink4);cursor:pointer;font-variant-numeric:tabular-nums;}
.gc:hover{border-color:var(--ink4);}
.gc.m1{background:#f0f4ea;color:#6a7a58;border-color:#dfe7d2;}
.gc.m2{background:#dfeadb;color:#4d6b4a;border-color:#cadcc4;}
.gc.m3{background:#bcd8bd;color:#2f5c38;border-color:#a5c9a7;}
.gc.m4{background:#8fbf96;color:#1e4428;border-color:#78ae81;}
.gc.cur{outline:2px solid var(--accent);outline-offset:1px;}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 20px;flex-wrap:wrap;}
.tab{padding:8px 13px;font-size:13.5px;color:var(--ink3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab:hover{color:var(--ink);}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);}
.tab .b{display:inline-block;margin-left:5px;font-size:10.5px;background:var(--line2);color:var(--ink2);border-radius:8px;padding:0 5px;}
.tab.on .b{background:var(--accent);color:#fff;}

.prose{font-size:15.5px;line-height:1.72;}
.prose h3{margin:26px 0 9px;font-family:var(--serif);font-size:17.5px;}
.prose h3:first-child{margin-top:0;}
.prose ul{margin:0 0 1em;padding-left:20px;} .prose li{margin-bottom:.35em;}
.prose em{font-style:italic;}
.prose b{font-weight:500;}
.q{font-family:var(--serif);font-size:16px;line-height:1.6;border-left:2px solid var(--accent-line);padding:2px 0 2px 15px;margin:14px 0;color:var(--ink2);}
.q cite{display:block;font-family:var(--sans);font-size:12px;font-style:normal;color:var(--ink4);margin-top:5px;}
.aside{background:var(--accent-bg);border-radius:var(--r);padding:13px 15px;margin:16px 0;font-size:14.5px;}
.aside .t{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}

.wcard{border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:9px;background:var(--card);}
.worig{font-family:var(--serif);font-size:21px;direction:rtl;unicode-bidi:isolate;}
.worig.gk{direction:ltr;}
.wtr{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--accent);}
.wgl{font-size:14px;color:var(--ink);}
.wnote{font-size:13.5px;color:var(--ink2);margin-top:6px;}
.wtag{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink4);border:1px solid var(--line2);border-radius:20px;padding:1px 8px;}

.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:10px 13px;margin-bottom:7px;font-size:14.5px;line-height:1.5;color:var(--ink);transition:border-color .12s,background .12s;}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg);}
.opt.sel{border-color:var(--accent);background:var(--accent-bg);}
.opt.right{border-color:var(--green);background:var(--green-bg);}
.opt.wrong{border-color:var(--red);background:var(--red-bg);}
.opt .lt{display:inline-block;width:20px;color:var(--ink4);font-size:12.5px;}
.fb{font-size:13.5px;padding:9px 12px;border-radius:8px;margin:6px 0 4px;line-height:1.55;}
.fb.ok{background:var(--green-bg);color:#2c5c3a;} .fb.no{background:var(--red-bg);color:#8b3830;}

.flash{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:34px 24px;text-align:center;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px;}

svg{display:block;max-width:100%;}
.vwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px;overflow:hidden;}
.vcap{font-size:12.5px;color:var(--ink3);margin-top:9px;line-height:1.5;}
.vtitle{font-size:13px;color:var(--ink2);margin-bottom:9px;display:flex;align-items:center;gap:7px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink3);margin-top:9px;}
.legend span{display:flex;align-items:center;gap:5px;}
.sw{width:9px;height:9px;border-radius:2px;flex:none;}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:20px;padding:3px 11px;border:1px solid var(--line2);color:var(--ink2);background:var(--card);}

code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px;}

/* ---- today's session ---- */
.sessbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
 background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:0 0 18px;
 backdrop-filter:blur(8px);}

.sessbar .sb{display:flex;gap:4px;}

.splan{list-style:none;margin:0;padding:0;counter-reset:sp;}

 padding-bottom:9px;border-bottom:1px solid var(--line);}

/* ---------- motion ---------- */
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

var LESSONS=[];
LESSONS.push(
{id:1,phase:1,title:"What is the Bible?",sub:"One story, not 66 books",
aim:"See the Bible as a single unfolding story carried by many human voices, and learn where the collection came from.",
sections:[
{h:"A library that behaves like a book",p:[
"Our word Bible comes through Latin from Greek τὰ βιβλία (ta biblía), a plural — “the little scrolls.” Somewhere in the journey into Latin the plural was heard as a singular, and the library became a book. That accident of grammar is a good theological instinct. Sixty-six documents, written across roughly a millennium and a half, in three languages, on three continents, by shepherds, kings, prophets, fishermen and a physician — and yet they hold together as one narrative with one central figure.",
"The alternative to reading it as one story is reading it as an anthology of religious wisdom. That approach can still yield good sermons, but it cannot explain why Luke has the risen Jesus walk two disciples through “Moses and all the Prophets” and interpret “in all the Scriptures the things concerning himself.” Jesus assumed the Old Testament had a plot, and that he was its resolution."]},
{h:"God-breathed, human-written",p:[
"2 Timothy 3:16 uses a word Paul appears to have coined: θεόπνευστος (theópneustos), from θεός (God) and πνέω (to breathe). Not “God-inspiring” — that would describe its effect on us. It describes origin: Scripture is exhaled by God. The image reaches back to Genesis 2:7, where God breathes into dust and it lives, and forward to John 20:22, where the risen Christ breathes on the disciples.",
{aside:{t:"Concursive inspiration",p:"The breath of God and the voice of the writer are not competing for the same space. Luke researched (Luke 1:1–4). Paul dictated and asked for his cloak. Amos writes like a farmer, Isaiah like a courtier, John like a poet. The personality is not interference in the signal — it is the signal. This is the position you already hold, and it is the one the text itself keeps demonstrating."}},
"So inspiration is not dictation. It is not mechanical. Peter's phrase in 2 Peter 1:21 is that writers were “carried along” (φερόμενοι, pherómenoi) by the Spirit — a nautical word, used of a ship borne by wind. The sailors still steer. The wind still decides where they arrive."]},
{h:"How the collection was recognised",p:[
"Canon comes from Hebrew קָנֶה (qaneh), a reed used as a measuring rod, into Greek κανών — a standard, a straight edge. The vital point is that councils did not create the canon; they recognised what the believing community had already been treating as authoritative for generations. The tests applied were roughly: apostolic or prophetic origin, consistency with what was already received, and widespread use in the churches.",
"The Hebrew Bible is not ordered as ours is. It is the TaNaK, an acronym for its three parts: Torah (instruction), Nevi'im (prophets), Ketuvim (writings). Same books, different sequence — and the sequence preaches. The Christian Old Testament ends with Malachi, on a promise of Elijah returning: the story leans forward into the Gospels. The TaNaK ends with 2 Chronicles and Cyrus's decree — go up and build. Both endings are about return; neither is a full stop."]},
{h:"The oldest words and the first author",p:[
"Job is widely regarded as among the earliest material in the Bible. It is set in a patriarchal world — wealth measured in livestock, the head of the family offering sacrifice, no mention of Israel, Sinai, temple or priesthood. The oldest question in Scripture is therefore not “how do I get saved” but “why do the innocent suffer, and is God good?”",
"Moses is traditionally credited with Genesis, which he did not witness. He is not writing memoir; he is compiling — oral tradition carefully transmitted, likely earlier written sources, and revelation. Genesis itself hints at seams with its repeated formula אֵלֶּה תּוֹלְדוֹת (elleh toledot), “these are the generations of,” which appears eleven times and reads very much like the header of a source document."]},
{h:"The four hundred years and the Greek Bible",p:[
"Between Malachi and Matthew lies a gap often called silent. It was not quiet. Persia gave way to Alexander, whose empire fractured among his generals; Judea was squeezed between Ptolemies in Egypt and Seleucids in Syria. Antiochus IV Epiphanes desecrated the temple in 167 BC, the Maccabean revolt won a brief independence, and Rome absorbed the region under Pompey in 63 BC.",
"In that period Jewish scholars in Alexandria translated the Hebrew Scriptures into Greek — the Septuagint, abbreviated LXX for the traditional seventy translators. This is the Bible most New Testament writers quote. When Matthew cites Isaiah 7:14 with παρθένος (parthénos, virgin) rather than the broader Hebrew עַלְמָה (almah, young woman), he is quoting the Greek his readers used. The Septuagint also supplied the vocabulary of Christian theology: χριστός for messiah, δόξα for glory, διαθήκη for covenant.",
"By the first century the synagogue had emerged — born in exile when there was no temple to attend — with a portable liturgy of reading, translation, exposition and prayer. It is the structure Jesus steps into at Nazareth in Luke 4, and it is the direct ancestor of most Christian services you have ever led."]},
{h:"Worship inside the story",p:[
"The temple had a professional music department. 1 Chronicles 25 describes Levitical musicians set apart “to prophesy with lyres, harps and cymbals” — worship and prophecy in the same sentence. Asaph, Heman and Jeduthun head three guilds; twelve psalms carry Asaph's name.",
"Fifty-five psalm headings address the לַמְנַצֵּחַ (lamnatzéach) — “to the choirmaster,” from נָצַח (natzach), to oversee or lead to completion. The same root gives נֶצַח (netzach), enduring, everlasting. The one directing the music shares a root with the word for permanence. Israel's songs were led by someone whose title implied they would outlast the singing."]},
{h:"Deep dive: Hosanna",p:[
"הוֹשִׁיעָה נָּא (hoshiah na) is not a word of praise. It is an imperative plus a particle of entreaty: “save, please” or “save now, we beg.” The verb is יָשַׁע (yasha), to deliver, rescue, bring into a wide open place — the same root behind Joshua and Jesus (יְהוֹשֻׁעַ / Ἰησοῦς, “the LORD saves”).",
"It appears in Psalm 118:25, part of the Hallel sung at the great festivals, and above all at Sukkot, where worshippers processed with palm and willow branches. Over centuries of liturgical use the cry compressed and hardened into a single shout, ὡσαννά, and its function shifted: a petition became an acclamation, the way “God save the king” became a way of cheering rather than praying.",
{aside:{t:"Both at once",p:"When the crowds shout it in Matthew 21:9 they are in a worship setting, singing a psalm they had sung every year, and they mean it as praise. But they add “to the Son of David,” which is a throne claim, and they wave the branches of a festival soaked in national hope. The petition has not been emptied out — it has found its object. Save us, please, is being shouted at someone they believe can actually do it, days before he does it in a way none of them expected."}},
"That layering is the whole discipline in miniature. The word means what it means; the history of its use means something too; the context decides how much of each is in play. Flatten it to politics and you lose the worship. Flatten it to worship and you lose the danger."]}],

{o:"θεόπνευστος",tr:"theópneustos",lang:"gk",gl:"God-breathed",n:"2 Timothy 3:16. Describes origin, not effect. Coined by Paul from theós + pnéō."},
{o:"קָנֶה",tr:"qaneh",lang:"he",gl:"reed, measuring rod",n:"Behind Greek kanōn — canon. A standard against which things are measured, not a committee's invention."},

{o:"לַמְנַצֵּחַ",tr:"lamnatzéach",lang:"he",gl:"to the choirmaster",n:"From natzach, to oversee or lead to completion; cognate with netzach, everlasting."},
{o:"הוֹשִׁיעָה נָּא",tr:"hoshiah na",lang:"he",gl:"save, we pray",n:"Psalm 118:25. Imperative of yasha plus entreaty. Became the shout hosanna."}],

recap:["The Bible is a plural that became a singular — and the grammar was right.","Theópneustos means God-breathed at the source; the human voice is the signal, not the noise.","Canon is a measuring reed: the church recognised authority, it did not manufacture it.","The TaNaK ends with “go up and build”; the Christian order ends leaning toward Elijah. Both lean forward.","The silent centuries were loud — and they gave us the Septuagint and the synagogue.","Hosanna is a prayer that learned to shout. In Matthew 21 it is petition and praise at once."],

{q:"The word canon derives from a Hebrew word meaning:",a:["A council of elders","A reed used as a measuring rod","A royal decree","A sealed scroll"],c:1,why:"Qaneh, a reed — hence a straight edge or standard. The canon is a measure, and it was recognised rather than invented."},

{q:"Why is Job usually placed among the earliest biblical material?",a:["It is quoted more often than any other book","Moses names himself as its author","It is written in the oldest known alphabet","Its setting knows nothing of Israel, Sinai, temple or priesthood"],c:3,why:"The world of Job is patriarchal — family sacrifice, wealth in livestock, no covenant nation in view."},
{q:"The Septuagint is:",a:["The Greek translation of the Hebrew Scriptures","A collection of intertestamental histories","The Aramaic paraphrase read in synagogues","A Latin translation made by Jerome"],c:0,why:"Greek, produced from the third century BC onward, and the version most quoted in the New Testament."},
{q:"Lamnatzéach, in fifty-five psalm headings, addresses whom?",a:["The high priest","The choirmaster or music director","The king","The scribe copying the scroll"],c:1,why:"From natzach, to oversee or bring to completion — a root also meaning everlasting."},
{q:"Hoshiah na is grammatically what kind of statement?",a:["A declaration of praise","A covenant oath","An imperative plea — save now, we beg","A blessing pronounced over a king"],c:2,why:"Imperative verb plus the particle na. It is a petition; liturgical use gradually turned it into an acclamation."},
{q:"Which best describes the crowd's cry in Matthew 21:9?",a:["A misquotation of Psalm 118","Purely political, with no worship content","Purely liturgical, with no royal claim","Both at once — festival praise carrying a throne claim"],c:3,why:"They are singing the Hallel they sing every year, but adding “to the Son of David” and waving Sukkot branches. Worship and kingship are inseparable here."}]},

{id:2,phase:1,title:"How we got the Bible",sub:"Manuscripts, transmission, translation",
aim:"Trace the physical journey from a scribe's reed to the Bible on your desk, and learn why the differences between manuscripts are both real and manageable.",
sections:[
{h:"Nothing survives in the author's hand",p:[
"We possess no autographs — no original of Isaiah, no letter in Paul's own writing. What we have are copies of copies, and a great many of them. For the New Testament: on the order of 5,800 catalogued Greek manuscripts, plus roughly 10,000 Latin and thousands more in Syriac, Coptic, Armenian and Georgian. By comparison, the standard text of Tacitus rests on about three medieval manuscripts.",
"That abundance is a double gift. More copies means more small divergences, and it also means more evidence for reconstructing what was first written. The discipline that does this is textual criticism, and its working principle is not “count the manuscripts” but “weigh them”: which reading best explains the origin of the others."]},
{h:"The scribes of the Hebrew Bible",p:[
"Hebrew was written for centuries with consonants only. כתב could be read several ways; the vowels lived in the reading tradition, in the memory of the community. Between roughly the sixth and tenth centuries AD the Masoretes — from מָסֹרֶת (masoret), tradition, from a root meaning to hand over — added a system of points and accents to fix pronunciation, and hedged the text with counting notes in the margins: how many words in a book, which word stands at the midpoint.",
"Until 1947 the oldest complete Hebrew Bible we had was the Leningrad Codex, from AD 1008. Then a Bedouin shepherd found jars in a cave at Qumran. The Dead Sea Scrolls pushed our evidence back a thousand years. The great Isaiah scroll, copied around 125 BC, is word-for-word substantially identical to the Masoretic Isaiah — with spelling variations and a handful of small differences, none of which alter doctrine. A thousand years of copying, and the text held."]},
{h:"What the variants actually are",p:[
"The number often quoted is 400,000 variants across the New Testament manuscripts. It sounds catastrophic until you look at the categories. The overwhelming majority are spelling differences and word-order changes that do not survive translation into English — Greek is inflected, so “Jesus loves Paul” and “Paul, Jesus loves” mean the same thing.",
"A small number are meaningful and viable, and modern Bibles flag them in footnotes rather than hiding them. The longer ending of Mark (16:9–20), the woman caught in adultery (John 7:53–8:11), and the Comma Johanneum in 1 John 5:7 are the three most discussed. No contested passage establishes a doctrine that is not taught plainly elsewhere.",
{aside:{t:"An honest framing",p:"The strength of the case is not that the transmission was miraculous and flawless. It is that it was ordinary, human, and left an enormous paper trail — and that trail lets us see the errors and correct back through them. A tradition with one perfect manuscript would be far easier to doubt."}}]},
{h:"Chapters, verses and other latecomers",p:[
"Chapter divisions were added by Stephen Langton, Archbishop of Canterbury, around 1227. Verse numbers came from the printer Robert Estienne in 1551, reportedly worked out on horseback between Paris and Lyon. They are a navigation aid, not part of the inspired text, and they occasionally fall in unhelpful places — Isaiah 53 begins mid-thought, and the chapter break at 2 Corinthians 6/7 cuts an argument in half.",
"Read paragraphs and whole letters. The verse is a postcode, not a dwelling."]},
{h:"Into English, at cost",p:[
"John Wycliffe's circle translated from the Latin Vulgate in the 1380s; his bones were later exhumed and burned. William Tyndale went back to the Hebrew and Greek, printed his New Testament in 1526, and was strangled and burned in 1536. His gift to English is not only the Bible but the language: “let there be light,” “the powers that be,” “a law unto themselves,” “the salt of the earth,” “my brother's keeper.” A large share of the King James New Testament — often estimated at around 80 percent, though estimates vary — is Tyndale's wording.",
"Translation philosophies sit on a spectrum. Formal equivalence (NASB, ESV, NKJV) keeps closer to word order and structure. Dynamic or functional equivalence (NIV, CSB, NLT) prioritises how the meaning lands in the receiving language. Paraphrase (The Message) is a restatement, not a translation. There is no neutral option — every translation is a series of interpretive decisions, which is exactly why comparing two or three is a study method rather than a luxury."]}],

{o:"סוֹפֵר",tr:"sofer",lang:"he",gl:"scribe, counter",n:"From safar, to count. Scribes literally counted letters to verify their copies."},
{o:"κριτική",tr:"kritikē",lang:"gk",gl:"the art of judging",n:"Behind textual criticism. Not criticising Scripture — judging between readings of it."},
{o:"κοινή",tr:"koinē",lang:"gk",gl:"common",n:"The everyday Greek of the New Testament, not the literary dialect. God spoke street Greek."},

quiz:[
{q:"What is an autograph, in textual terms?",a:["The original document in the author's own hand","An officially authorised copy","A translation approved by a council","A scribe's signature in the margin"],c:0,why:"None survive for any biblical book. Everything we have descends from copies."},
{q:"What did the Dead Sea Scrolls demonstrate about the Hebrew text?",a:["That the Masoretic text had been heavily rewritten","That a thousand years of copying preserved it with remarkable stability","That the Septuagint was the more original text","That Isaiah was composed after the exile"],c:1,why:"The great Isaiah scroll from c. 125 BC is substantially identical to a Masoretic text a millennium later."},
{q:"Most New Testament textual variants are:",a:["Disputes between Greek and Latin","Deliberate doctrinal alterations","Spelling and word-order differences invisible in translation","Missing whole chapters"],c:2,why:"Greek is inflected, so word order carries less weight — most variants never reach an English page."},
{q:"Who added the chapter divisions we use?",a:["Robert Estienne, in 1551","The Masoretes","Jerome, in the fourth century","Stephen Langton, around 1227"],c:3,why:"Langton did chapters; Estienne added verse numbers in 1551."},
{q:"Koinē Greek is best described as:",a:["The common everyday Greek of the Mediterranean world","A liturgical language used only in worship","A dialect invented by the apostles","The literary dialect of Athenian philosophy"],c:0,why:"Koinē means common. The New Testament is written in the language of markets and letters."},
{q:"The Masoretes' central contribution was:",a:["Translating the Hebrew Bible into Aramaic","Adding vowel points and accents, and counting the text to guard it","Deciding which books belonged in the canon","Producing the first printed Hebrew Bible"],c:1,why:"Their name comes from masoret, tradition handed on — preservation, not innovation."},
{q:"Which of these is a disputed passage flagged in most modern Bibles?",a:["The Lord's Prayer in Matthew 6","The Sermon on the Mount","John 7:53–8:11, the woman caught in adultery","Romans 8"],c:2,why:"Along with Mark 16:9–20 and the Comma Johanneum. Modern Bibles print the question rather than concealing it."},
{q:"A translator working by functional equivalence will tend to:",a:["Refuse to translate ambiguous terms","Follow the Latin Vulgate","Preserve Hebrew word order even when it reads oddly","Render the meaning in natural English, resolving idioms"],c:3,why:"The gain is clarity; the cost is that an interpretive decision has been made on your behalf and is hard to detect."}]},

{id:3,phase:1,title:"The languages of Scripture",sub:"Hebrew, Aramaic, Koine Greek",
aim:"Understand how the shape of each language shapes the theology written in it — and why a concordance beats a synonym list.",
sections:[
{h:"Hebrew: verbs, roots and dirt",p:[
"Hebrew is built from roots, usually three consonants, from which nouns and verbs are grown by adding vowels and patterns. כ־ת־ב (k-t-b) yields katav (he wrote), ketav (writing), miktav (letter), katuv (it is written). Learning a root gives you a family, not a word.",
"The vocabulary is overwhelmingly concrete. Anger is “a burning of the nose.” Compassion, רַחֲמִים (rachamim), is the plural of רֶחֶם (rechem), womb — God's mercy is described with a word for the organ that carries a child. Stubbornness is a stiff neck, an ox refusing the yoke. Hebrew does not have much abstract vocabulary because Hebrew thinks in bodies and dirt and weather.",
"Hebrew verbs are not primarily tensed. They mark aspect: whether an action is complete (perfect) or incomplete (imperfect). This is why prophetic texts can describe future deliverance in what looks like past tense — the so-called prophetic perfect. It is as good as done."]},
{h:"Aramaic: the language of empire and exile",p:[
"Aramaic is Hebrew's cousin, and it became the international language of the Assyrian, Babylonian and Persian empires. Portions of Daniel (2:4b–7:28) and Ezra are written in it, along with a verse in Jeremiah. By the first century it was the everyday speech of Galilee — Hebrew survived as the language of Scripture and the synagogue.",
"So Jesus taught in Aramaic. The Gospels preserve fragments, and the writers keep them untranslated where they carry weight: talitha koum (little girl, arise), ephphatha (be opened), Eloi Eloi lema sabachthani, and abba. Paul keeps abba in Greek letters in Romans 8:15 and Galatians 4:6 — a household word for father, retained because no Greek word did the job."]},
{h:"Greek: precision and reach",p:[
"Alexander's conquests spread a simplified common Greek from Egypt to India. It was nobody's literary ideal and everybody's second language, and it is why a letter written in Corinth could be read in Rome.",
"Greek is far more precise than Hebrew about time and voice. It distinguishes aorist (a whole action viewed as a point), present (ongoing), and perfect (a completed action with a standing result). That last one carries theological freight: when Jesus says τετέλεσται (tetélestai) on the cross, it is perfect tense — it has been finished and it stands finished. The same form appears on ancient receipts meaning “paid in full.”",
"Greek also has the range Hebrew lacks for love. ἀγάπη (agápē), φιλία (philía), ἔρως (érōs) and στοργή (storgē) are not a tidy hierarchy — usage overlaps and agápē can describe wrong loves too — but the vocabulary lets John 21 stage a conversation in which Jesus and Peter use two different verbs, and something is happening in the difference."]},
{h:"What this means for study",p:[
"You do not need to read Hebrew and Greek to benefit from them. You need three habits. First, notice repetition — biblical writers emphasise by repeating, and English translations often vary the word for style, hiding the pattern. Second, follow a word through a concordance rather than trusting a dictionary gloss; meaning is set by usage across a corpus, not by an entry.",
"Third, respect semantic range. A word does not carry all its meanings every time it appears. ruach can mean wind, breath or spirit; the context chooses, and reading all three in at once is a common way to preach something the text never said."]}],

{id:4,phase:1,title:"Reading in context",sub:"Genre, covenant, and the ancient Near East",
aim:"Learn the interpretive habits that keep you asking what a text meant before asking what it means.",
sections:[
{h:"The first question",p:[
"Every text was written to somebody who was not you. Before asking what a passage means for a Sunday morning in your city, ask what it meant to a Judean farmer in the eighth century BC, or a slave in a Corinthian household, or an exile by a Babylonian canal. Application that skips this step is not application; it is projection.",
"This is not a modern scepticism imposed on Scripture. It is what the text itself invites. Prophets date themselves by reigning kings. Letters name their recipients and answer their specific questions. Luke tells Theophilus exactly why he is writing."]},
{h:"Genre decides the rules",p:[
"You already read a newspaper differently from a novel and a joke differently from a will. Scripture contains at least a dozen genres, and each has conventions.",
"Narrative shows rather than tells: it reports what happened without always approving it. Judges recounts appalling things without endorsing any of them. Poetry compresses and exaggerates on purpose — “the mountains skipped like rams” is not a geological claim. Law is embedded in covenant and often case-based, describing how to handle a situation rather than legislating an ideal. Wisdom states what is generally true, not what is universally guaranteed; Proverbs and Job are in argument with each other, and both are in the canon. Prophecy is mostly covenant lawsuit — you agreed to this, look at you — with prediction serving that case. Apocalyptic uses saturated symbol to say that God rules while the world says otherwise. Epistle is occasional: one side of a correspondence, answering questions we have to infer.",
{aside:{t:"A working test",p:"When a reading of a passage requires the genre to behave unlike itself — a proverb treated as a promise, a poem treated as a physics text, a vision treated as a timetable — the reading is almost certainly wrong."}}]},
{h:"Covenant is the spine",p:[
"The word בְּרִית (berith) appears roughly 280 times. A covenant is a binding relationship with stated obligations and consequences, ratified by ceremony — usually by cutting. Hebrew says one karat berith, cuts a covenant, because animals were cut in half and the parties walked between the pieces, invoking the same fate on themselves if they broke faith. Genesis 15 is startling because God alone passes between the pieces.",
"Ancient Near Eastern treaties between a great king and a vassal follow a recognisable form: preamble naming the king, historical prologue rehearsing what he has done, stipulations, witnesses, blessings and curses, arrangements for deposit and public reading. Deuteronomy follows that structure closely. Israel would have recognised the genre instantly — and the point of the resemblance is the difference: this suzerain rescued them first and binds himself as well."]},
{h:"Living in the ancient Near East",p:[
"Israel's neighbours believed the world was made from the corpse of a defeated god, that humanity was created to feed the gods with sacrifices, that kings alone bore the divine image, and that gods were local and territorial. Genesis 1 is written in that world and contradicts it at nearly every point: no combat, no rival deities — the sun and moon are not even named, just called the greater and lesser lights — humanity as a whole bears the image, and rest, not slave labour, is the goal.",
"Knowing the neighbours turns Genesis 1 from a bare account into a polemic. Much of the Old Testament works this way: it is not written in a vacuum, it is written against something."]},
{h:"The habits",p:[
"Read whole units — the paragraph, then the chapter, then the book. Ask who is speaking and to whom; Job's friends say things that are quoted accurately and are wrong. Watch for repeated words and structural patterns, especially chiasm, where a passage mirrors itself around a centre that carries the point. Let clear passages govern obscure ones. And distinguish description from prescription: that something happened in the narrative is not by itself an instruction."]}],
words:[
{o:"בְּרִית",tr:"berith",lang:"he",gl:"covenant",n:"One does not make a covenant in Hebrew; one cuts it — karat berith. Blood ratifies the bond."},
{o:"חֶסֶד",tr:"hesed",lang:"he",gl:"covenant loyalty, steadfast love",n:"Faithfulness inside a bond, freely given and beyond obligation. The single hardest Hebrew word to translate."},
{o:"תּוֹרָה",tr:"torah",lang:"he",gl:"instruction, teaching",n:"From yarah, to point or aim, as with an arrow. Direction, not merely legislation."},
{o:"מָשָׁל",tr:"mashal",lang:"he",gl:"proverb, comparison, parable",n:"A saying that works by likeness. Wisdom in the shape of a resemblance, not a guarantee."},
{o:"ἀποκάλυψις",tr:"apokálypsis",lang:"gk",gl:"unveiling, disclosure",n:"The genre's name means a pulling back of the curtain on what is already true, not a forecast."}],

recap:["Ask what it meant before asking what it means. Skipping that is projection, not application.","Genre sets the rules: a proverb is not a promise, a poem is not a physics text.","Covenant is cut, not made — and in Genesis 15 God walks between the pieces alone.","Deuteronomy is shaped like a suzerain treaty, and the differences are the gospel in it.","Genesis 1 is a polemic. Learn the neighbours and it comes alive.","Read whole units, watch repetition, and never confuse description with prescription."],

{q:"What is theologically startling about Genesis 15?",a:["Abraham passes between the pieces alone","God alone passes between the pieces","No animals are used","The covenant is made at the temple"],c:1,why:"The lesser party should bear the self-curse. God takes both sides of the oath."},
{q:"Proverbs states what is:",a:["A prophecy about the messiah","Universally guaranteed in every case","Generally true in the ordinary run of things","True only for ancient Israel"],c:2,why:"Which is why Job can sit in the same canon and press the exceptions."},

{q:"Torah is best translated as:",a:["Instruction or teaching, from a root meaning to aim","Covenant","Commandment","Law, in the sense of legislation"],c:0,why:"From yarah, to point or shoot an arrow. Direction toward a target, wider than legal code."},
{q:"In Genesis 1, the sun and moon are called the greater and lesser lights because:",a:["Hebrew had no words for sun and moon","The writer is deliberately refusing to name what neighbours worshipped as gods","The account was written before those words existed","They are metaphors for angels"],c:1,why:"Demoting deities to fixtures. The polemic is in the vocabulary."},
{q:"Apokálypsis, the name of the apocalyptic genre, means:",a:["The end of the age","Catastrophe","Unveiling or disclosure","Judgement"],c:2,why:"A pulling back of the curtain on what is already true — not primarily a forecast of the future."},
{q:"That a practice appears in a biblical narrative means:",a:["It is condemned by the narrator","It is symbolic only","It is commanded for all believers","It happened, and the narrative may be reporting rather than endorsing it"],c:3,why:"Description is not prescription. Judges reports horrors it never approves."}]},

{id:5,phase:1,title:"The big story in one arc",sub:"Creation, fall, Israel, Christ, church, new creation",
aim:"Hold the entire biblical narrative in one movement, so that any passage can be located inside it.",
sections:[
{h:"Why an arc, not a list",p:[
"If you cannot say what the Bible is about in a paragraph, individual passages will float. The arc is not a substitute for detail; it is the frame that lets detail land. Every text you study for the next twenty-nine lessons sits somewhere on this line.",
"The shortest version: God makes a world and puts his image in it to rule under him; the image rebels and the world fractures; God chooses one family to carry the repair; the family becomes a nation, is given land, law and a king, and fails as thoroughly as everyone else; God comes himself, as the true image, true Israel and true king, and absorbs the failure; his Spirit forms a new people who spread the repair outward; and the story ends where it started, in a garden — except it is now a city, and God lives in it."]},
{h:"Creation and vocation",p:[
"Genesis 1–2 is not chiefly about mechanism. It is about function, order and vocation. God separates and fills, then places humanity as צֶלֶם (tselem), image — a word used for the statue a king erected in a distant province to declare who ruled there. To be image is to be a living declaration of God's rule, entrusted with a garden to extend.",
"The seventh day is the goal. In ancient thought a deity took up residence in a temple and rested — not from exhaustion but as an act of governance. Creation is a sanctuary, and rest is enthronement."]},
{h:"Fracture",p:[
"Genesis 3 is a coup by suggestion: is God good, did he really say, would you not be better as your own authority. The consequences are relational before they are penal — hiding, blame, and the ground itself fighting back. Genesis 4 to 11 traces the spread: murder in one generation, violence filling the earth, and finally Babel, humanity building upward for a name.",
"Notice that God's response to Babel — scattering into nations — is precisely what Genesis 12 addresses. The problem is stated, then a solution is named."]},
{h:"One family, one nation",p:[
"Abraham is promised land, offspring and blessing, and the last of the three is global: “in you all the families of the earth shall be blessed.” Election is instrumental. Israel is chosen for the nations, not instead of them.",
"The nation is formed in Exodus, given identity at Sinai, brought into land, and asks for a king. David receives a promise of a house that will not end. Solomon builds the temple, and then the kingdom divides, both halves rot, prophets prosecute the covenant, and both go into exile. The return under Cyrus is real, and it is small: a modest temple, no king, foreign rule. The story is unfinished and the Old Testament knows it."]},
{h:"The turn",p:[
"Jesus arrives as everything the story needed and nothing it expected. He is the true image, the true Israel who succeeds where the nation failed, the son of David with an unending throne, the prophet, the priest and the sacrifice. He announces a kingdom, dies under Roman and religious authority, and is raised — the first instalment of the new creation rather than a resuscitation into the old one.",
"Pentecost forms a people by the Spirit. Babel's scattering is answered as every language hears. Acts pushes the blessing outward from Jerusalem to Rome, and the letters work out what it looks like to be this people in real cities with real disagreements."]},
{h:"The end that is a beginning",p:[
"Revelation 21–22 ends with a city that has a garden in it: the tree of life, the river, no more curse, the nations healed. The last two chapters deliberately answer the first two. What was lost is not merely restored — it is fulfilled, populated and secured. God dwells with his people, which was the point of the tabernacle, the temple, the incarnation and Pentecost all along.",
{aside:{t:"For a worship leader",p:"This arc is the reason a service can hold lament and celebration in the same hour without contradiction. We are past the resurrection and before the city. Songs that only celebrate lie about the present; songs that only lament lie about the future. Locating a congregation on the arc is most of the work of choosing what they sing."}}]}],
words:[
{o:"צֶלֶם",tr:"tselem",lang:"he",gl:"image, statue",n:"The marker a king set up in a province to declare his rule. Humanity is God's standing claim on the earth."},
{o:"שַׁבָּת",tr:"shabbat",lang:"he",gl:"cessation, rest",n:"Not recovery from tiredness. A deity resting in a temple is a deity taking up rule."},
{o:"שָׁלוֹם",tr:"shalom",lang:"he",gl:"wholeness, flourishing, peace",n:"Far more than absence of conflict — everything in right relation and functioning as intended."},

{q:"For a worship leader, locating a congregation on the arc matters because:",a:["Only new creation songs are appropriate","It dictates the length of the service","It determines which key to sing in","We live after resurrection and before the city, so lament and celebration are both truthful"],c:3,why:"Songs that only celebrate misdescribe the present; songs that only lament misdescribe the future."}]}

LESSONS.push(
{id:6,phase:2,title:"Genesis 1–2",sub:"Temple cosmology, tselem, imago Dei",
aim:"Read the creation accounts as their first hearers did — as a temple being built and a vocation being given.",
sections:[
{h:"Two accounts, two jobs",p:[
"Genesis 1:1–2:3 and Genesis 2:4–25 are not rival reports. The first is a liturgy of order, structured in sevens, with a cosmic camera; the second is a close-up on a garden, a man, a job and a wife. The first uses אֱלֹהִים (Elohim), the general word for God; the second uses יהוה אֱלֹהִים (YHWH Elohim), joining the covenant name to it. The move is deliberate: the God of the cosmos is the God who plants a garden and gets his hands dirty.",
"The opening word בְּרֵאשִׁית (bereshit) is a construct — “in beginning of.” Hebrew opens the Bible mid-breath. And תֹהוּ וָבֹהוּ (tohu vavohu) in 1:2 does not mean nothing; it means formless and empty, unproductive and uninhabited. The problem in view is not absence of matter but absence of order and life."]},
{h:"Forming and filling",p:[
"Once you see tohu (unformed) and bohu (unfilled) as the two problems, the six days resolve into two columns of three. Days one to three form the realms; days four to six fill them. Day one light and dark, day four sun, moon and stars. Day two sky and sea, day five birds and fish. Day three land and vegetation, day six animals and humanity. The account solves its own stated problem in order.",
"The verb בָּרָא (bara) is used only with God as subject, and in the Hebrew Bible it is far more concerned with assigning function than with manufacturing substance. Notice how much of the account is separating and naming — activities of ordering, not of fabricating."]},
{h:"A cosmic temple",p:[
"Ancient temple dedications ran seven days, and on the seventh the deity entered and rested. Genesis 1 is shaped that way. Later Scripture confirms the reading: Isaiah 66:1 calls heaven God's throne and earth his footstool; Psalm 132 speaks of God's resting place. The tabernacle is described with the same verbs as creation — Moses saw the work, blessed it, finished it — and it is decorated with garden imagery: almond blossom, pomegranates, and cherubim like the ones stationed at Eden's gate.",
"So creation is a sanctuary, Eden is its holy of holies, and the human is placed there as priest. Genesis 2:15 says the man was put in the garden לְעָבְדָהּ וּלְשָׁמְרָהּ (le'ovdah uleshomrah) — to work it and keep it. That exact pair of verbs recurs in Numbers 3:7–8 for the duties of Levites in the sanctuary. Adam's job description is priestly."]},
{h:"Image and likeness",p:[
"צֶלֶם (tselem) is a statue; דְּמוּת (demut) is a resemblance. In Mesopotamia and Egypt only the king was the image of the god. Genesis makes the claim universal — male and female, the whole species — which is a stunning democratisation in its context and the foundation of every argument for human dignity that follows.",
"The image is followed immediately by a mandate: be fruitful, fill, subdue, rule. רָדָה (radah) is a strong verb, and it is placed on creatures who are themselves made from dust and told to serve a garden. Dominion inside Genesis 1 is defined by Genesis 2: rule looks like cultivation and protection, not extraction."]},
{h:"Rest as the goal",p:[
"The seventh day is the only day God blesses and makes holy — the first thing in Scripture called holy is a piece of time, not a place or an object. And it has no evening and morning formula. The day is left open.",
"Hebrews 4 picks this up: there remains a sabbath rest for the people of God. The seventh day was never merely a rule about a weekend. It is the shape of where the whole story is going, and Genesis 1 hands it to us on page one."]}],
words:[
{o:"בְּרֵאשִׁית",tr:"bereshit",lang:"he",gl:"in the beginning of",n:"A construct form. The Bible opens mid-phrase, as though the story is already underway."},
{o:"תֹּהוּ וָבֹהוּ",tr:"tohu vavohu",lang:"he",gl:"formless and empty",n:"Not nothingness — unproductive and uninhabited. Days 1–3 fix tohu, days 4–6 fix bohu."},

recap:["Genesis 1 is a liturgy of order; Genesis 2 is a close-up. Elohim becomes YHWH Elohim — the cosmic God plants a garden.","Tohu vavohu is unformed and unfilled; days 1–3 form, days 4–6 fill.","Creation is a temple. Eden is its inner sanctuary and the human is its priest.","Le'ovdah uleshomrah — work it and keep it — is Levitical language in a garden.","Tselem makes every human what only kings were: God's standing image.","The first holy thing in the Bible is a day, and it has no evening. The story is still heading there."],
quiz:[
{q:"Tohu vavohu in Genesis 1:2 describes the earth as:",a:["Formless and empty — unordered and uninhabited","Under judgement","Covered in ice","Non-existent"],c:0,why:"Two problems, solved in two sets of three days: forming, then filling."},
{q:"The verb bara is distinctive because:",a:["It is borrowed from Egyptian","It only ever takes God as its subject","It appears only once in the Bible","It means to build from existing material"],c:1,why:"And its concern is ordering and assigning function more than manufacturing substance."},
{q:"Genesis 2:15 says the man was placed in the garden to work it and keep it. That verb pair elsewhere describes:",a:["Shepherding","Farming in Egypt","Levitical service in the sanctuary","Military guard duty"],c:2,why:"Numbers 3:7–8. Adam's job description is priestly, which is why creation reads as a temple."},
{q:"What is theologically radical about applying tselem to humanity in its ancient context?",a:["It implied humans were divine","It replaced the need for temples","Images were forbidden entirely","Only kings were considered the image of a god"],c:3,why:"Genesis extends royal status to male and female, the whole species."},
{q:"The seventh day is unique in Genesis 1 because:",a:["It has no evening and morning formula, and is the first thing called holy","God speaks most on that day","It is the longest day described","It is when humanity is created"],c:0,why:"Left open, and blessed — the shape of where the story is going, as Hebrews 4 argues."},
{q:"In ancient temple dedications, a deity resting on the seventh day meant:",a:["The building work had exhausted the god","The god took up residence and began to rule","The temple would be closed","Sacrifices could begin"],c:1,why:"Which is exactly the sense Genesis 2:2–3 carries."},
{q:"Radah, dominion, is qualified within Genesis by:",a:["The naming of the animals","The prohibition on eating meat","Chapter 2's picture of serving and guarding a garden","The flood narrative"],c:2,why:"Rule is defined as cultivation and protection by creatures themselves made of dust."},
{q:"The shift from Elohim in chapter 1 to YHWH Elohim in chapter 2 signals:",a:["A scribal error","A change of historical period","A different author with a different god","That the God of the cosmos is the covenant God who comes close"],c:3,why:"The joining of the names is the point: transcendence and intimacy in the same subject."}]},

{id:7,phase:2,title:"Genesis 3–11",sub:"Fall, flood, Babel",
aim:"Follow the spread of the fracture and see how each judgement narrative sets up the call of Abraham.",
sections:[
{h:"The shape of the temptation",p:[
"The serpent does not begin with a lie but with a distortion: “did God actually say you shall not eat of any tree?” Overstate the restriction, and generosity starts to look like meanness. Eve corrects him but adds a clause of her own — “neither shall you touch it” — and once the command is being edited by both parties, the outcome is already in motion.",
"Then the flat contradiction: you will not surely die. And the motive: you will be like God, knowing good and evil. The offer is not knowledge as information but the authority to decide what is good — sovereignty rather than trust. That is why the sin is not fundamentally about fruit."]},
{h:"What breaks",p:[
"The immediate consequences are relational. They see they are עֲרוּמִּים (arummim), naked — a word that echoes the serpent's עָרוּם (arum), crafty, one letter apart in the consonantal text. They hide from God, then the man blames the woman and, by implication, God for giving her.",
"The sentences in 3:14–19 touch each relationship: the serpent and the woman's offspring, childbearing and marriage, work and the ground. And then 3:15 — often called the protoevangelium, the first gospel — announces enmity and a bruising, a wound to the head against a wound to the heel. The exile from the garden is guarded by cherubim to the east, and every subsequent movement in Genesis away from God is described as eastward."]},
{h:"The spread",p:[
"Cain kills Abel in the next chapter — worship goes wrong before anything else does. Lamech escalates to a boast of seventy-sevenfold vengeance. By Genesis 6 the earth is filled with חָמָס (hamas), violence, and the divine assessment is grief: “it grieved him to his heart.” Judgement in Scripture is rarely detached.",
"The flood is described in creation vocabulary run backwards — the waters above and below, separated on day two, come back together. It is decreation. Then a wind, רוּחַ (ruach), passes over the waters as in 1:2, dry land appears, and the commands to Noah echo Genesis 1. Noah is a new Adam in a re-set world, and he plants a garden, gets drunk, and it goes wrong again by the end of the chapter. The problem was never the environment."]},
{h:"Babel and the answer",p:[
"Genesis 11 is a compact masterpiece. They say “let us make bricks,” “let us build ourselves a city and a tower,” and “let us make a name for ourselves, lest we be dispersed.” The verbs are all first person plural and self-directed. God says “let us go down” — and the Hebrew has a pun the English loses: they make לְבֵנִים (levenim), bricks, and God confuses their שָׂפָה (safah), lip or language, so the city is called בָּבֶל (Bavel), sounding like בָּלַל (balal), to confuse. Babylon's own etymology claimed bab-ilu, gate of God. Genesis is making a joke at an empire's expense.",
"Their fear was being scattered and having no name. Genesis 12 opens with God saying to Abram: go — and I will make your name great. What humanity grasped at, God gives. And the scattering of nations at Babel becomes the audience for the blessing promised to Abraham, and the crowd in Acts 2 when the languages are gathered again."]}],
words:[
{o:"עָרוּם / עֲרוּמִּים",tr:"arum / arummim",lang:"he",gl:"crafty / naked",n:"A deliberate sound-play across Genesis 2:25–3:1. The craft of the serpent and the exposure of the pair are one letter apart."},
{o:"חָמָס",tr:"hamas",lang:"he",gl:"violence, wrongful ruin",n:"Genesis 6:11. The specific charge that brings the flood — not irreligion but brutality."},
{o:"בָּבֶל / בָּלַל",tr:"Bavel / balal",lang:"he",gl:"Babel / to confuse",n:"Babylon called itself the gate of God. Genesis renames it babble."},
{o:"שֵׁם",tr:"shem",lang:"he",gl:"name, renown",n:"Babel builds to make a shem for itself. God then promises to make Abram's shem great."},
{o:"תְּשׁוּקָה",tr:"teshuqah",lang:"he",gl:"desire, urge toward",n:"Genesis 3:16, and again in 4:7 of sin crouching at the door — the parallel shapes how 3:16 is read."},
{o:"קַיִן",tr:"Qayin",lang:"he",gl:"Cain — acquired",n:"Eve names him with qanah, I have gotten. The first human born is named for acquisition."}],

recap:["Temptation begins by overstating the restriction until generosity looks like meanness.","Arum and arummim — the serpent's craft and the couple's exposure share a sound.","The flood is written as decreation, then a ruach blows and dry land reappears. Noah is a new Adam who fails.","Hamas, violence, is the charge that fills the earth; God's response is grief, not detachment.","Babel wanted a name and feared scattering. God gives Abram a name and uses the scattering.","Every judgement in Genesis 3–11 is followed by a mercy — and by chapter 12, a plan."],

{q:"The serpent's opening move in Genesis 3 is:",a:["Overstating the prohibition so God's generosity looks stingy","A promise of wealth","An offer of immortality","A direct denial that God exists"],c:0,why:"Did God really say you shall not eat of any tree? The distortion comes before the lie."},
{q:"The wordplay between arum and arummim links:",a:["The garden and the flood","The serpent's craftiness and the couple's nakedness","Cain and Abel","Babel and Babylon"],c:1,why:"One letter apart in the consonantal text, across the chapter break at 2:25–3:1."},
{q:"The specific charge that brings the flood in Genesis 6:11 is:",a:["Intermarriage","Idolatry","Hamas — violence","Sabbath-breaking"],c:2,why:"The earth was filled with violence, and God's response is described as grief in his heart."},
{q:"The flood narrative is written using vocabulary that:",a:["Predicts the exile","Mirrors the Babel story","Echoes the plagues of Egypt","Reverses the creation account — decreation, then recreation"],c:3,why:"Waters above and below rejoin; then a ruach passes over, dry land appears, and Genesis 1 commands are repeated to Noah."},
{q:"Genesis renames Babylon Bavel to pun on:",a:["Balal, to confuse","Bavel, gate of God","Baal, lord","Bara, to create"],c:0,why:"Babylon's own etymology claimed gate of God; Genesis hears babble."},
{q:"Babel's stated fear was:",a:["Famine","Being dispersed and having no name","Invasion by Egypt","The return of the flood"],c:1,why:"And Genesis 12 answers both: God sends Abram out, and makes his name great."},
{q:"Genesis 3:15 is often called the protoevangelium because:",a:["It establishes sacrifice","It promises land","It announces enmity and a decisive wound to the serpent's head","It names the messiah"],c:2,why:"A bruised head against a bruised heel — the first hint that the fracture will be answered."},
{q:"What does the drunkenness of Noah after the flood establish narratively?",a:["That Noah was not righteous","That the covenant had failed","That wine is forbidden","That the problem was never the environment — a fresh world still yields the same failure"],c:3,why:"A new Adam in a reset world plants a garden and it goes wrong again by the end of the chapter."}]},

{id:8,phase:2,title:"Abraham",sub:"Berith, promise, faith",
aim:"See how a single family becomes the vehicle of God's answer to Babel, and how covenant works when only one party can keep it.",
sections:[
{h:"The call",p:[
"Genesis 12:1–3 is the hinge of the book. Eleven chapters of widening ruin are answered by seven clauses of promise: go, and I will make you a great nation, bless you, make your name great, make you a blessing, bless those who bless you, curse the one who dishonours you — and in you all the families of the earth shall be blessed.",
"That last clause is the mission statement of the Bible. It is quoted by Paul in Galatians 3:8 as the gospel preached beforehand to Abraham. The particular exists for the universal from the very first sentence of Israel's story.",
"Abram is seventy-five and childless, and the promise is offspring. The call requires him to leave country, kindred and father's house — three concentric circles of security, stripped in order from outermost to most intimate."]},
{h:"Cutting the covenant",p:[
"Genesis 15 is the most extraordinary covenant ceremony in the ancient world. Abram asks how he can know. God tells him to bring animals, cut them in half and lay the halves opposite each other — the standard rite, in which the parties walk between the pieces and effectively say: may I become like these if I break faith.",
"Then darkness falls, Abram sleeps, and a smoking fire pot and a flaming torch pass between the pieces alone. The vassal never walks. God takes both sides of the self-maledictory oath. The covenant's security rests entirely on the party who cannot fail — which is precisely why Paul builds the argument of Romans 4 and Galatians 3 on this chapter rather than on Sinai.",
"Just before this, 15:6: “he believed the LORD, and he counted it to him as righteousness.” The verb הֶאֱמִן (he'emin) is from אמן (aman), to be firm or reliable — the root behind amen. To believe is to lean on something that will hold."]},
{h:"Sign, name, and the long wait",p:[
"Genesis 17 renames Abram (exalted father) as Abraham (father of a multitude) and gives circumcision as the sign — a mark placed on the organ of generation, at the exact point where the promise of offspring is being doubted. The covenant sign is cut into the site of the impossibility.",
"Twenty-five years pass between the promise and Isaac. Along the way Abraham lies about Sarah twice, and takes Hagar at Sarah's suggestion — a legally normal move in that world and a failure of trust in this story, with consequences that outlive everyone involved. Faith in Genesis is not the absence of wobble. It is a direction of travel."]},
{h:"The mountain",p:[
"Genesis 22 is unbearable and deliberate. God asks for Isaac — “your son, your only son, whom you love” — on a mountain in the land of Moriah, later identified in 2 Chronicles 3:1 as the temple mount. Abraham says to the servants, “we will come again to you,” and to Isaac, “God will provide for himself the lamb.”",
"The ram caught in the thicket is a substitute, and Abraham names the place יְהוָה יִרְאֶה (YHWH yireh), the LORD will see or provide. The narrative pointedly does not end with a lamb; it ends with a ram, and a name that says provision is still future tense. The Gospels read that as unfinished business, and John the Baptist's first words about Jesus supply the noun.",
{aside:{t:"Handle with care",p:"This chapter has been badly used. Read in context it is not a divine endorsement of child sacrifice but a direct confrontation with it — the one thing the surrounding cultures did routinely is the one thing God stops. And the ordeal falls on Abraham, not Isaac, in a story about whether the God who gave the promise can be trusted with it."}}]}],
words:[
{o:"בְּרִית",tr:"berith",lang:"he",gl:"covenant",n:"Cut, not made. Genesis 15's ceremony has only one party walking the path."},
{o:"אָמַן / הֶאֱמִן",tr:"aman / he'emin",lang:"he",gl:"to be firm / to believe",n:"Genesis 15:6. The root behind amen. Faith means leaning on what holds."},
{o:"צְדָקָה",tr:"tsedaqah",lang:"he",gl:"righteousness",n:"Relational rightness — being in the right within a bond, not abstract moral perfection."},
{o:"יְהוָה יִרְאֶה",tr:"YHWH yireh",lang:"he",gl:"the LORD will see, will provide",n:"Genesis 22:14, in the imperfect. Provision named as still to come."},
{o:"לֶךְ־לְךָ",tr:"lekh lekha",lang:"he",gl:"go, for yourself / go from yourself",n:"Genesis 12:1 and 22:2 — the only two occurrences. The first call and the hardest are verbally twinned."},
{o:"זֶרַע",tr:"zera",lang:"he",gl:"seed, offspring",n:"A collective noun that can mean many or one — a grammatical ambiguity Paul exploits in Galatians 3:16."}],

{q:"In Genesis 15, who passes between the divided animals?",a:["Abram alone","God alone, as fire pot and torch","Both Abram and God","Abram's servants"],c:1,why:"The vassal should walk and never does. God takes both sides of the self-maledictory oath."},
{q:"He'emin, believed, in Genesis 15:6 comes from a root meaning:",a:["To swear an oath","To see clearly","To be firm or reliable — the root behind amen","To obey a command"],c:2,why:"Faith is leaning your weight on something that holds."},
{q:"Why is circumcision a fitting covenant sign in Genesis 17?",a:["It replaced animal sacrifice","It was painless and easily hidden","It was unique to Israel among all nations","It marks the covenant at the precise point where the promise of offspring is doubted"],c:3,why:"The sign is cut into the site of the impossibility."},
{q:"Lekh lekha occurs only twice in the Hebrew Bible — in Genesis 12:1 and:",a:["Genesis 22:2","Genesis 24:1","Genesis 15:1","Genesis 17:1"],c:0,why:"The first call and the command to Moriah are verbally twinned, bracketing Abraham's story with going."},
{q:"Abraham names the place on Moriah YHWH yireh, which is:",a:["A past tense — the LORD has provided","An imperfect — the LORD will see or provide","An imperative — let the LORD provide","A participle — the LORD providing"],c:1,why:"Provision is named as still future. A ram is given; the lamb Abraham spoke of is not."},
{q:"Genesis 22 read in its ancient context functions as:",a:["A prophecy about the exile","An endorsement of child sacrifice","A direct confrontation with the practice — God stops what the neighbours did routinely","A legal precedent for inheritance"],c:2,why:"And the ordeal falls on Abraham, in a story testing whether the giver of the promise can be trusted with it."},
{q:"Paul builds his argument in Romans 4 and Galatians 3 primarily on:",a:["The conquest of Canaan","The Davidic covenant","Sinai and the giving of the law","Abraham's justification by faith before circumcision"],c:3,why:"Genesis 15:6 precedes Genesis 17 — faith is reckoned as righteousness before the sign is given."}]},

{id:9,phase:2,title:"Exodus",sub:"YHWH, pesach, redemption",
aim:"Understand the event that defines Israel's God, and the vocabulary of rescue that the rest of Scripture borrows from it.",
sections:[
{h:"The name",p:[
"At the bush Moses asks for a name, and gets אֶהְיֶה אֲשֶׁר אֶהְיֶה (ehyeh asher ehyeh) — I am who I am, or I will be what I will be. The verb is imperfect: unfinished, ongoing. Then the third-person form, יהוה (YHWH), the four letters, from the same root היה (hayah), to be.",
"Out of reverence Jewish readers say אֲדֹנָי (Adonai), Lord, rather than pronouncing the name. That is why English Bibles print LORD in small capitals — it is not a translation but a marker that the divine name stands in the Hebrew. The hybrid Jehovah arose in the sixteenth century from combining YHWH's consonants with Adonai's vowels; it is a misreading that became a hymnal.",
"The name matters because Exodus 6:3 says the patriarchs knew God as El Shaddai but not by this name. Something new is being disclosed: not just the God who promises, but the God who acts to fulfil, present tense, in history."]},
{h:"The plagues as theology",p:[
"The ten plagues are not arbitrary displays of power. Exodus 12:12 states the target: “on all the gods of Egypt I will execute judgements.” The Nile, source of life and a god, turns to blood. Frogs, associated with Heqet, swarm. Darkness covers the land for three days against Ra. And the final plague strikes the firstborn, including Pharaoh's son — Pharaoh himself being regarded as divine, his heir the future god-king.",
"Meanwhile Pharaoh's heart is repeatedly described as כָּבֵד (kaved), heavy, and חָזַק (chazaq), strengthened. In Egyptian belief the heart was weighed against a feather at death. The narrative is telling an Egyptian joke: Pharaoh's heart grows heavier with every refusal."]},
{h:"Passover",p:[
"פֶּסַח (pesach) is usually rendered pass over, and the traditional image is the destroyer skipping a house. Isaiah 31:5 uses the same verb for a bird hovering protectively over a nest, which suggests something stronger: not avoidance but protective covering — God standing over the doorway.",
"The details matter. A lamb without blemish, taken into the household four days beforehand, killed at twilight by the whole assembly, blood on lintel and doorposts, eaten roasted with bitter herbs and unleavened bread, in haste and dressed for travel. Nothing left until morning, no bone broken. Every one of those details reappears in the passion narratives, and John dates the crucifixion to the hour the Passover lambs were slaughtered.",
"And the sequence is worth marking: the blood comes before the law. Israel is rescued first and given commandments second. Sinai is not the price of the exodus; it is the shape of life after it."]},
{h:"Redemption vocabulary",p:[
"Two verbs carry the event. גָּאַל (ga'al) is family language — the go'el is the kinsman-redeemer, obliged to buy back a relative's land, freedom or line. Boaz is a go'el; Job says “I know that my Redeemer lives.” The word assumes relationship and cost. פָּדָה (padah) is commercial: to ransom by payment, to buy out of slavery.",
"Both are picked up in the New Testament through λύτρον (lytron), ransom, and ἀπολύτρωσις (apolytrosis), redemption — the price paid to free a slave. When Jesus says the Son of Man came “to give his life as a ransom for many,” he is speaking exodus."]}],
words:[

recap:["The name at the bush is an unfinished verb: I will be what I will be.","LORD in small capitals marks YHWH in the Hebrew; Jehovah is a sixteenth-century misreading.","The plagues target Egypt's gods, and Pharaoh's heart grows heavy — an Egyptian joke about the weighing of the heart.","Pesach may mean protective hovering, not merely skipping — God standing over the door.","Blood before law. Rescue first, commandments second. Sinai is the shape of life after redemption, not its price.","Ga'al is family obligation, padah is a price paid. Jesus takes up both when he speaks of a ransom for many."],

{q:"Ehyeh asher ehyeh is grammatically notable because the verb is:",a:["Imperfect — ongoing and unfinished","Imperative — a command","Passive","Perfect — a completed state"],c:0,why:"I am who I am, or I will be what I will be. The name refuses containment."},
{q:"Why do English Bibles print LORD in small capitals?",a:["To mark emphasis","To indicate the divine name YHWH stands in the Hebrew","To show the word is Aramaic","To indicate a textual variant"],c:1,why:"It is a typographic marker, not a translation. Jewish practice reads Adonai in its place."},
{q:"Exodus 12:12 states that the plagues execute judgement on:",a:["The magicians","Pharaoh's army","All the gods of Egypt","The Hebrew slaves who doubted"],c:2,why:"Each plague strikes a domain claimed by an Egyptian deity, culminating in Pharaoh's own divine heir."},
{q:"Isaiah 31:5 uses the verb behind pesach to describe:",a:["A judge passing sentence","A door being shut","An army marching past","A bird hovering protectively over its nest"],c:3,why:"Which suggests covering and shielding rather than merely skipping a house."},
{q:"The order of events in Exodus is significant because:",a:["The blood and rescue come first, and Sinai follows","Sinai and the exodus happen simultaneously","The covenant precedes the promise to Abraham","The law is given before the rescue"],c:0,why:"Obedience is the shape of life after redemption, never its purchase price."},
{q:"A go'el in Israelite society was:",a:["A priest offering sacrifice","A kinsman obliged to buy back a relative's land, freedom or line","A judge in the city gate","A prophet anointing a king"],c:1,why:"Family obligation with a cost attached — Boaz in Ruth, and Job's confession that his Redeemer lives."},
{q:"Pharaoh's heart being kaved, heavy, is a pointed detail because Egyptians believed:",a:["Hearts were removed before burial","Heavy hearts indicated courage","The heart was weighed against a feather at death","The heart was the seat of the soul only in kings"],c:2,why:"With every refusal his heart grows heavier — and heavier is exactly what you do not want it to be."},
{q:"Apolytrosis in the New Testament draws its imagery from:",a:["Legal adoption","Military conquest","Temple sacrifice","The price paid to free a slave"],c:3,why:"Ransom language, continuous with ga'al and padah — the exodus vocabulary carried into the gospel."}]},

{id:10,phase:2,title:"Sinai and the tabernacle",sub:"Torah, mishkan, holiness",
aim:"Grasp what law is for inside a covenant already given, and why God's first building project is a tent.",
sections:[
{h:"Law inside a rescue",p:[
"The Ten Words open with history, not command: “I am the LORD your God, who brought you out of the land of Egypt, out of the house of slavery.” Identity and rescue first; instruction second. Exactly the treaty structure — the great king rehearses what he has done before stating what he asks.",
"תּוֹרָה (torah) is instruction, from יָרָה (yarah), to aim or shoot. It is direction toward a target, and it is given to a people already free. Israel does not keep torah in order to be rescued; they keep it because they have been.",
"The Hebrew calls them עֲשֶׂרֶת הַדְּבָרִים (aseret hadevarim), the ten words, not the ten laws. And the body of law that follows is largely case law — if this happens, then this — describing how justice is worked out in ordinary disputes, and consistently more protective of the vulnerable than the surrounding legal codes: limits on debt slavery, gleaning rights, protection of the resident foreigner, and a sabbath that applies to servants and animals."]},
{h:"Holiness as belonging",p:[
"קֹדֶשׁ (qodesh) means set apart, devoted to a particular use. It is not primarily about moral achievement; it is about ownership and purpose. A pot in the sanctuary is holy in the same sense that a wedding ring is set apart — not morally superior, but not available for general use.",
"Which is why טָמֵא (tame), unclean, is not the same as sinful. Childbirth, mildew, corpses and normal bodily functions render one ritually unclean. The categories are teaching a lesson through the body: life and death do not mix, and approaching God is not casual. Israel's holiness code is a curriculum in distinction, delivered daily, in the kitchen and the bedroom and the field."]},
{h:"The tent",p:[
"מִשְׁכָּן (mishkan) means dwelling place, from שָׁכַן (shakan), to settle or dwell — the root behind the later rabbinic term shekinah for God's manifest presence, and behind John's σκηνόω in John 1:14. The purpose is stated in Exodus 25:8: “let them make me a sanctuary, that I may dwell in their midst.”",
"It is portable. God's first house moves. The tribes camp around it, and it sits at the centre of the community rather than on a hill above it. Thirteen chapters of Exodus are devoted to its construction — considerably more than are given to creation — which tells you what the book thinks is at stake.",
"Its craftsman, Bezalel, is the first person in Scripture described as filled with the Spirit of God, and it is for artistic skill. That is a detail worth carrying into any theology of the arts in worship."]},
{h:"Graded space, graded access",p:[
"The tabernacle is a set of concentric zones: the camp, the outer court with the bronze altar and basin, the holy place with lampstand, table of bread and incense altar, and behind a woven curtain the holy of holies with the ark. The materials get more precious as you move inward — bronze, then silver, then gold. So does the restriction on who may enter: all Israel, then priests, then the high priest alone, once a year, with blood.",
"The geography teaches a doctrine. God is genuinely present and genuinely dangerous, and access is real but mediated. When the gospels report the curtain tearing from top to bottom, they are making a claim about that whole architecture — and they specify the direction of the tear, because it matters who did it.",
{aside:{t:"Eden again",p:"The tabernacle is decorated with garden imagery — almond blossoms on the lampstand, pomegranates on the hem, cherubim woven into the curtain, and an entrance facing east, guarded, exactly as Eden's was. It is a portable garden. Israel carries a fragment of the world as it was meant to be through the wilderness."}}]}],

{o:"תּוֹרָה",tr:"torah",lang:"he",gl:"instruction, direction",n:"From yarah, to aim. Given to a people already rescued, not as the price of rescue."},
{o:"קֹדֶשׁ",tr:"qodesh",lang:"he",gl:"holiness, set-apartness",n:"Devoted to a purpose. Ownership and use before morality."},
{o:"מִשְׁכָּן",tr:"mishkan",lang:"he",gl:"dwelling place, tabernacle",n:"From shakan, to settle. Behind shekinah, and behind John's skēnóō in John 1:14."},

recap:["The Ten Words begin with rescue, not command. Identity precedes instruction.","Torah is aiming language — direction for people already free.","Qodesh is set-apartness: devoted to a use, not morally superior. Tame is not the same as sinful.","Mishkan is a dwelling that moves. God's first house has tent pegs.","Bezalel is the first person filled with the Spirit — for craftsmanship.","The tabernacle is a portable Eden: cherubim, a tree of light, an eastern gate. The curtain tears from the top."],
quiz:[
{q:"The Ten Words open with:",a:["A statement of who God is and what he has done","A warning of judgement","An instruction about the sabbath","A command to have no other gods"],c:0,why:"I am the LORD your God who brought you out — rescue is the ground of the commands, not their reward."},
{q:"Torah comes from a root meaning:",a:["To bind","To aim or shoot, as with an arrow","To write","To judge"],c:1,why:"Yarah. Instruction as direction toward a target, wider than legislation."},
{q:"Qodesh, holiness, primarily denotes:",a:["Priestly descent","Moral perfection","Being set apart and devoted to a purpose","Ritual cleanliness"],c:2,why:"Ownership and use. A sanctuary pot is holy the way a wedding ring is set apart."},
{q:"Ritual uncleanness, tame, is best understood as:",a:["A punishment for disobedience","A description of foreigners","A synonym for sin","A category teaching that life and death do not mix, and that approach is not casual"],c:3,why:"Childbirth and corpses render one unclean; neither is a sin."},
{q:"Mishkan is related to which later term for God's manifest presence?",a:["Shekinah","Selah","Shema","Shalom"],c:0,why:"Both from shakan, to settle or dwell — and John 1:14 uses the Greek equivalent, skēnóō."},
{q:"Bezalel is the first person in Scripture said to be filled with the Spirit of God, and it is for:",a:["Military leadership","Artistic craftsmanship","Interpreting dreams","Prophecy"],c:1,why:"Exodus 31. A significant datum for any theology of the arts in worship."},
{q:"The kapporet, or mercy seat, is significant because:",a:["Only Levites could touch it","It held the tablets of the law","It was the lid of the ark where blood was applied — Greek hilastērion","It stood in the outer court"],c:2,why:"Paul uses hilastērion of Christ in Romans 3:25, placing him at the point where blood meets the throne."},
{q:"That the tabernacle curtain tears from top to bottom is emphasised because:",a:["It marks the end of the sacrificial system in Jewish law","It fulfils a specific prophecy in Exodus","It shows the strength of the earthquake","It indicates who tore it — the access is opened from God's side"],c:3,why:"Direction is doctrine. The architecture of restricted access is opened from above."}]}
