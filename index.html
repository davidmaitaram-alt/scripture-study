1:{t:"Foundations",
 prompt:"A passage you have never read before is put in front of you. In your own words, describe how you would read it responsibly — what you would check, and in what order.",
 keys:["genre","paragraph","book","covenant stage","whole arc","context before application","usage not etymology","original audience"],
 model:"Establish the genre and its rules. Read the whole paragraph, then the book's argument. Locate it on the covenant line — before or after Sinai, exile, the cross. Ask what it meant to its first hearers. Check word meanings by usage across the corpus rather than by root. Then, last, ask what it asks of you. Application is the final step, never the first."},
2:{t:"Origins and covenant",
 prompt:"Tell the story from creation to Sinai in a paragraph. Include what humanity was made for, what went wrong, and how God's answer narrowed to one family and then one nation.",
 keys:["image","tselem","sanctuary","rest","rebellion","scattering","Abraham","promise","blessing to the nations","exodus","rescue before law","tabernacle","dwelling"],
 model:"God builds the world as a sanctuary and places humanity in it as image and priest, with rest as the goal. The image rebels, and the fracture spreads from a garden to a civilisation grasping at a name. God answers by calling one man out of Ur, promising land, offspring and blessing for all families — and binding himself alone to the oath. The family becomes a nation of slaves, is rescued at Passover, and only then, at Sinai, receives instruction and a tent so that God can dwell among them. Rescue always precedes law."},
3:{t:"Israel: land, kings, prophets",
 prompt:"Explain how Israel got from entering the land to losing it. What was the covenant's conditional clause, who prosecuted it, and on what two charges?",
 keys:["tenancy","land is mine","conditional","judges","cycle","king","Deuteronomy 17","temple","prophets","covenant lawsuit","idolatry","injustice","exile","glory departs"],
 model:"The land was always tenancy, held on covenant terms that included exile for breach. Judges shows a downward spiral and argues for a king; the king is given, constrained by Deuteronomy 17, and breaks every clause. The temple is built and the glory fills it. The prophets then prosecute the covenant lawsuit on two charges — idolatry described as adultery, and injustice against the poor and the foreigner — insisting that worship cannot substitute for justice. Ezekiel watches the glory leave, and in 586 BC city, temple, monarchy and land all fall, exactly as the covenant said they would."},
4:{t:"Psalms and wisdom",
 prompt:"Someone in your congregation is in a season that has not turned. Using what you now know of the Psalter and the wisdom books, what would you give them, and what would you avoid giving them?",
 keys:["lament","Psalm 88","does not resolve","turn","hesed","Job","friends were wrong","retribution","Ecclesiastes","hevel","proverbs are not promises","presence not argument","Psalm 73","sanctuary"],
 model:"Give them lament, and specifically the psalms that do not resolve — Psalm 88 ends in darkness and is in the canon for exactly this person. Give them Job, where the friends apply a tidy formula and are told they spoke wrongly, while the man who protests is commended. Give them Psalm 73, which turns not by argument but by location. Avoid handing them a proverb as a promise, avoid explaining the cause, and avoid asking them to sing only what they cannot presently mean — though they can be carried by a congregation singing it for them."},
5:{t:"Christ and the gospels",
 prompt:"A thoughtful friend says the resurrection is a later legend that grew up around an executed teacher. Using the world of the first century and the earliest evidence, answer them.",
 keys:["expectation","crucifixion","cursed","Deuteronomy 21","1 Corinthians 15","received","delivered","early","creed","women","embarrassment","Greek","body escaped","fits nobody's hope"],
 model:"Crucifixion signalled total defeat, and Deuteronomy 21:23 called anyone hung on a tree cursed, so a crucified messiah refuted the claim rather than confirming it. Jewish expectation was a corporate resurrection at the end of the age, not one man mid-history; Greek assumption was that the body is what the soul escapes. The claim therefore fits nobody's existing hope, which is not how legends form. And 1 Corinthians 15:3–7 quotes a fixed formula Paul says he received, datable to within a few years, naming witnesses who were still alive — and flattering nobody, since it lists the man who denied him, the brother who disbelieved and the persecutor."},
6:{t:"Church and consummation",
 prompt:"Take a service you are actually planning. Locate that congregation on the arc, then say what the whole story asks of that hour — and name one thing you would change about the set as a result.",
 keys:["after the cross","after Pentecost","before the city","lament and celebration","reasons","confession","assurance","oikodomē","justice","dwelling","teaching by repetition"],
 model:"They sit after the resurrection and after Pentecost, and before the city — genuinely forgiven, genuinely indwelt, and genuinely unfinished. So lament and celebration are both truthful in the same hour, and a set that permits only one lies to somebody. Give praise its reasons, make room for the person whose season has not turned, keep confession and assurance rather than assuming them, and test every element by whether it builds the body. And remember Amos: the justice question is answered outside the room, not in it. The story has been about a God closing the distance — garden, tent, temple, body, people, city — and the hour is a rehearsal of that."}

function area(a,b){

/* --- how-to-read lines, so the reader never has to infer the form --- */
function readAs(v){
 if(v.type==="map")return "A map. Where these events happened — settlements sit at true coordinates, coastlines are simplified.";
 if(v.type==="timeline")return "A timeline. When these things happened; bands are periods, dots are single events.";
 if(v.type==="root")return "A word family. One root at the top, the words grown from it below.";
 if(v.type==="columns")return "Grouped side by side. Each column is one category — compare across, not down.";
 if(v.type==="flow"){
  var u=FLOWUNIT[VKEY]||"step";
  return FLOWLOOP[VKEY]?("A repeating cycle. Read left to right, then back to the start — each "+u+" leads to the next."):
   ("In order. Read left to right; each "+u+" follows from the one before it.");
 }
 if(v.type==="stack"){
  var m=STACKMODE[VKEY]||"steps";
  if(m==="nested")return "Concentric. Each row sits inside the one above it — read top to bottom as moving inward.";
  if(m==="chiasm")return "A mirror. The rows pair off around the centre, and the centre row carries the point.";
  if(m==="list")return "A set. These belong together; the order carries no argument.";
  return "In sequence. Read top to bottom — the order is part of the meaning.";
 }
 if(v.type==="compare"){
  var r=COMPAREREL[VKEY]||"contrast";
  return {contrast:"Two things set against each other. The left is what the right corrects, refuses or reverses.",
   pair:"Two halves of one thing. Not rivals — both are true, and they belong together.",
   fulfil:"Pattern and fulfilment. The left is echoed, answered or completed by the right.",
   expect:"Expectation against outcome. The left is what was anticipated; the right is what actually came.",
   tradeoff:"Two live options. Each gains something the other loses; neither is simply wrong."}[r];
 }
 return "";
}

/* --- stack: four genuinely different shapes --- */
function stackHTML(v){
 var mode=STACKMODE[VKEY]||"steps", n=v.layers.length;
 function row(l,i,indent,col,badge,emph){
  return '<div style="display:flex;gap:0;align-items:stretch;">'+
   (indent?'<div style="width:'+indent+'px;flex:none;"></div>':'')+
   '<div style="width:3px;background:'+col+';border-radius:2px;flex:none;"></div>'+
   '<div style="flex:1;background:'+(emph?"var(--accent-bg)":"var(--sunk)")+';border-radius:0 8px 8px 0;padding:8px 12px;min-width:0;">'+
   '<div style="display:flex;gap:8px;align-items:baseline;">'+
   (badge?'<span style="font-size:10px;color:'+col+';flex:none;letter-spacing:.05em;">'+badge+'</span>':'')+
   '<span style="font-size:13.5px;font-weight:500;">'+esc(l.n)+'</span></div>'+
   '<div style="font-size:11.5px;color:var(--ink3);line-height:1.45;">'+esc(l.s)+'</div></div></div>';
 }
 var out='<div style="display:flex;flex-direction:column;gap:4px;">';
 if(mode==="chiasm"){
  var mid=Math.floor(n/2);
  v.layers.forEach(function(l,i){
   var depth=i<=mid?i:(n-1-i);
   var pairIdx=i<mid?String.fromCharCode(65+i):(i===mid?"":String.fromCharCode(65+(n-1-i))+"&prime;");
   var badge=i===mid?"CENTRE":pairIdx;
   out+=row(l,i,depth*16,i===mid?"#a8443c":"#3f5f8f",badge,i===mid);
  });
  out+='</div><div class="legend" style="margin-top:8px;"><span>A pairs with A&prime;, B with B&prime;, and so on. The highlighted centre is the point.</span></div>';
  return out;
 }
 if(mode==="nested"){
  v.layers.forEach(function(l,i){
   out+=row(l,i,i*17,["#3f5f8f","#4a6a96","#55759d","#6b4f7d","#8a5f74","#a8443c","#a87a1e"][i%7],"&#8627;",false);
  });
  out+='</div><div class="legend" style="margin-top:8px;"><span>Each row sits inside the one above it. The innermost is at the bottom.</span></div>';
  return out;
 }
 if(mode==="list"){
  v.layers.forEach(function(l,i){ out+=row(l,i,0,"#3f5f8f","&bull;",false); });
  return out+'</div>';
 }
 v.layers.forEach(function(l,i){ out+=row(l,i,0,"#3f5f8f",(i+1)+".",false); });
 return out+'</div>';
}

/* --- reference parsing --- */
function parseRefs(str){
 var note="", s=String(str);
 var pm=s.match(/\s*\(([^)]*)\)\s*$/);
 if(pm){note=pm[1];s=s.slice(0,pm.index);}
 var chunks=s.split(/\s+alongside\s+|;/).map(function(x){return x.trim();}).filter(Boolean);
 var out=[],lastBook=null;
 chunks.forEach(function(c){
  var m=c.match(/^((?:[1-3]\s+)?[A-Za-z][A-Za-z' ]*?)\s+([0-9].*)$/);
  var book,nums;
  if(m){book=m[1].trim().toLowerCase();nums=m[2];}
  else if(/^[0-9]/.test(c)&&lastBook){book=lastBook;nums=c;}
  else return;
  var abbr=BOOKS[book];
  if(!abbr){
   var alt=Object.keys(BOOKS).filter(function(k){return k.indexOf(book)===0||book.indexOf(k)===0;})[0];
   if(alt)abbr=BOOKS[alt];else return;
  }
  lastBook=book;
  var ref=nums.replace(/[–—]/g,"-").replace(/:/g,".").replace(/\s+/g,"").replace(/[^0-9.\-,]/g,"");
  if(!ref)return;
  out.push({display:c,ref:abbr+ref});
 });
 return {refs:out,note:note};
}

 return "https://ref.ly/logosres/"+cfg.res+"?ref="+encodeURIComponent(cfg.pre+"."+ref);
}

/* --- the weekly plan --------------------------------------------- */
function planStart(){ if(!S.planStart)S.planStart=S.created||today(); return S.planStart; }
function weekNo(){ return Math.floor((dayNum()-dayNum(planStart()))/7)+1; }
function dayOfWeek(){ return ((dayNum()-dayNum(planStart()))%7+7)%7; }
function targetLesson(){ return Math.min(30,Math.max(1,weekNo())); }
function nextUnread(){
 var n=LESSONS.filter(function(l){return !L(l.id).done;})[0];
 return n?n.id:null;
}
function planStatus(){
 var target=targetLesson(), done=doneCount();
 if(done>=30)return {state:"finished",msg:"All thirty complete. Review is what keeps it."};
 if(done>=target)return {state:"ahead",msg:done>target?"Ahead of the weekly plan by "+(done-target)+" lesson"+(done-target===1?"":"s")+".":"On plan."};
 var behind=target-done;
 if(behind<=1)return {state:"on",msg:"On plan for week "+weekNo()+"."};
 return {state:"behind",msg:behind+" lessons behind the weekly plan. The plan is a guide, not a debt — pick up where you are."};
}

/* --- phase capstones ---------------------------------------------- */
function capState(p){ if(!S.caps)S.caps={}; if(!S.caps[p])S.caps[p]={synth:"",attempts:[],best:0,done:false}; return S.caps[p]; }
function phaseLessons(p){ return LESSONS.filter(function(l){return l.phase===p;}); }
function phaseComplete(p){ var a=phaseLessons(p); return a.length>0&&a.every(function(l){return L(l.id).done;}); }
/* the first phase that is finished but whose capstone is not */
function capstoneReady(){
 for(var p=1;p<=6;p++){ if(phaseComplete(p)&&!capState(p).done)return p; }
 return null;
}
function capstoneQuestions(p,n){
 var pool=[];
 phaseLessons(p).forEach(function(l){ l.quiz.forEach(function(q,i){ pool.push({l:l,q:q,key:l.id+"-"+i}); }); });
 shuffle(pool);
 var picked=[],perLesson={};
 pool.forEach(function(x){
  if(picked.length>=n)return;
  var c=perLesson[x.l.id]||0;
  if(c>=Math.ceil(n/phaseLessons(p).length)+1)return;
  perLesson[x.l.id]=c+1;picked.push(x);
 });
 while(picked.length<n&&pool.length>picked.length){
  var extra=pool.filter(function(x){return !picked.some(function(y){return y.key===x.key;});})[0];
  if(!extra)break;picked.push(extra);
 }
 return picked;
}

function memState(r){
 if(!S.mem)S.mem={};
 if(!S.mem[r])S.mem[r]={text:"",stage:0,reps:0,ef:2.5,iv:0,due:dayNum(),best:0,lapses:0};
 return S.mem[r];
}
function memEntry(r){ for(var i=0;i<MEMLIST.length;i++)if(MEMLIST[i].r===r)return MEMLIST[i]; return null; }
function memStarted(){ return MEMLIST.filter(function(m){return (memState(m.r).text||"").trim();}); }
function memDue(){ var d=dayNum(); return memStarted().filter(function(m){var s=memState(m.r);return s.stage>0&&s.due<=d;}); }
function memHeld(){ return memStarted().filter(function(m){var s=memState(m.r);return s.stage>=4&&s.iv>=21;}); }

/* --- text transforms for the drill ladder --- */
function memTokens(t){
 return String(t||"").trim().split(/(\s+)/).filter(function(x){return x.length;});
}
function memWords(t){ return String(t||"").trim().split(/\s+/).filter(Boolean); }
function firstLetters(t){
 return memWords(t).map(function(w){
  var m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9])/);
  if(!m)return w;
  var tail=w.match(/([^A-Za-z0-9]*)$/)[1];
  return m[1]+m[2]+(tail&&tail!==m[1]?tail:"");
 }).join(" ");
}
function gapText(t,frac,seed){
 var w=memWords(t), n=0;
 var out=w.map(function(x,i){
  var content=x.replace(/[^A-Za-z0-9]/g,"").length>3;
  var hit=((i*7+(seed||3))%10)/10 < frac;
  if(content&&hit){n++;return "_".repeat(Math.max(3,Math.min(9,x.length)));}
  return x;
 });
 return {text:out.join(" "),blanked:n};
}

/* --- word-level accuracy, so recitation is measured rather than self-rated --- */
function memScore(given,expect){
 function norm2(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();}
 var g=norm2(given).split(" ").filter(Boolean), e=norm2(expect).split(" ").filter(Boolean);
 if(!e.length)return {pct:0,marks:[]};
 /* longest common subsequence so a dropped word does not misalign everything after it */
 var n=g.length,m=e.length,dp=[];
 for(var i=0;i<=n;i++){dp[i]=[];for(var j=0;j<=m;j++)dp[i][j]=0;}
 for(i=1;i<=n;i++)for(j=1;j<=m;j++)dp[i][j]=g[i-1]===e[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
 var matched={},i2=n,j2=m;
 while(i2>0&&j2>0){
  if(g[i2-1]===e[j2-1]){matched[j2-1]=1;i2--;j2--;}
  else if(dp[i2-1][j2]>=dp[i2][j2-1])i2--; else j2--;
 }
 var eWords=String(expect).trim().split(/\s+/);
 var marks=eWords.map(function(w,k){return {w:w,ok:!!matched[k]};});
 return {pct:Math.round(dp[n][m]/m*100),marks:marks,extra:Math.max(0,n-dp[n][m])};
}

/* --- scheduling: five stages, then spaced review --- */
var MEMSTAGES=[
 {n:"Read it",s:"Read the passage aloud three times, slowly."},
 {n:"First letters",s:"Only the first letter of each word. Speak the whole thing."},
 {n:"Half gone",s:"Half the words are blanked. Fill them in aloud."},
 {n:"Nearly blank",s:"Most words gone. You are carrying it now."},
 {n:"From the reference",s:"Reference only. Type it from memory."}];
function memAdvance(r,pct){
 var s=memState(r);
 if(s.stage<4){
  if(pct>=85||s.stage===0)s.stage++;
  s.due=dayNum(); s.iv=0;
 }else{
  if(pct>=90){s.reps++;s.ef=Math.min(2.8,s.ef+0.1);s.iv=s.reps===1?3:Math.max(1,Math.round((s.iv||3)*s.ef));}
  else if(pct>=70){s.reps++;s.ef=Math.max(1.3,s.ef-0.1);s.iv=Math.max(2,Math.round((s.iv||2)*1.3));}
  else{s.lapses++;s.reps=0;s.ef=Math.max(1.3,s.ef-0.2);s.iv=1;}
  s.due=dayNum()+s.iv;
 }
 if(pct>s.best)s.best=pct;
 addXP(pct>=90?20:(pct>=70?10:4));
 save();
}

/* --- fuzzy answer matching --- */
function norm(s){
 return String(s||"").toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[’'`´]/g,"").replace(/[^a-z0-9 ]/g," ")
  .replace(/\s+/g," ").trim();
}
function lev(a,b){
 if(a===b)return 0; if(!a.length)return b.length; if(!b.length)return a.length;
 var prev=[],cur=[],i,j;
 for(j=0;j<=b.length;j++)prev[j]=j;
 for(i=1;i<=a.length;i++){cur[0]=i;
  for(j=1;j<=b.length;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
  prev=cur.slice();}
 return prev[b.length];
}
function sim(a,b){a=norm(a);b=norm(b);if(!a&&!b)return 1;var m=Math.max(a.length,b.length);return m?1-lev(a,b)/m:0;}
/* grade a typed answer: 2 = right, 1 = close, 0 = wrong.
   Single-word targets (transliterations) are judged strictly by edit distance.
   Multi-word targets (glosses, definitions) also get credit for content-word overlap,
   because there is no single correct wording for "steadfast covenant love". */
function judge(given,expect,alts){
 var pool=[expect].concat(alts||[]);
 var g=norm(given);
 if(!g)return{v:0,s:0};
 var best=0;
 pool.forEach(function(e){var s=sim(given,e);if(s>best)best=s;});
 // containment: typing the key term inside a longer answer counts
 pool.forEach(function(e){var n=norm(e);if(n.length>3&&g.indexOf(n)>=0)best=Math.max(best,0.95);});
 var expContent=norm(expect).split(" ").filter(function(x){return x.length>3&&!STOP[x];});
 if(expContent.length>=2){
  var gt=g.split(" ");
  var matched=expContent.filter(function(k){
   return gt.some(function(t){return t===k||(t.length>3&&sim(t,k)>=0.85);});
  }).length;
  var overlap=matched/expContent.length;
  if(overlap>=0.6)best=Math.max(best,0.86);
  else if(matched>=1)best=Math.max(best,0.62);
 }
 if(best>=0.82)return{v:2,s:best};
 if(best>=0.55)return{v:1,s:best};
 return{v:0,s:best};
}

/* --- keyword extraction for self-graded short answers --- */
var STOP={the:1,a:1,an:1,of:1,and:1,is:1,in:1,to:1,it:1,that:1,for:1,as:1,with:1,on:1,by:1,not:1,but:1,are:1,was:1,be:1,at:1,from:1,or:1,which:1,this:1,than:1,you:1,its:1,his:1,her:1,they:1,them:1,has:1,have:1,had:1,what:1,when:1,who:1,into:1,out:1,up:1,one:1,two:1,all:1,does:1,do:1,did:1,can:1,will:1,would:1,more:1,most:1,only:1,also:1,about:1,over:1,after:1,before:1,because:1,were:1,been:1,being:1,other:1,same:1,such:1,then:1,there:1,their:1,while:1,how:1,why:1,any:1,each:1,both:1,very:1,own:1,so:1,if:1,no:1,nor:1,too:1,just:1,now:1,ever:1,never:1,yet:1};
function keywords(s,n){
 var w=norm(s).split(" ").filter(function(x){return x.length>3&&!STOP[x];});
 var seen={},out=[];
 w.forEach(function(x){if(!seen[x]){seen[x]=1;out.push(x);}});
 return out.slice(0,n||6);
}
function keywordHit(given,expect){
 var ks=keywords(expect,8),g=norm(given);
 if(!ks.length)return 0;
 var hit=ks.filter(function(k){
  if(g.indexOf(k)>=0)return true;
  return g.split(" ").some(function(t){return t.length>3&&sim(t,k)>=0.85;});
 }).length;
 return hit/ks.length;
}

/* --- drill item generation (derived from existing lesson data, no new authoring) --- */
function drillsFor(id){
 var l=lesson(id);if(!l)return [];
 var out=[];
 (l.words||[]).forEach(function(w,i){
  // 1. produce the term from its meaning
  out.push({k:"term",id:"L"+id+"D t"+i,
   prompt:"Which term means: "+w.gl+"?",
   hint:w.n.length>90?w.n.slice(0,90)+"…":w.n,
   expect:w.tr, alts:[w.o], reveal:w.o+" — "+w.tr+" — "+w.gl, mode:"type"});
  // 2. produce the meaning from the term
  out.push({k:"gloss",id:"L"+id+"Dg"+i,
   prompt:"What does "+w.tr+" ("+w.o+") mean?",
   expect:w.gl, alts:keywords(w.gl,3), reveal:w.gl+"  ·  "+w.n, mode:"type"});
  // 3. cloze the term out of its own note, where the note names it
  var re=new RegExp("\\b"+w.tr.split(" ")[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
  if(re.test(w.n)){
   out.push({k:"cloze",id:"L"+id+"Dc"+i,
    prompt:w.n.replace(re,"______"), lead:"Fill the gap",
    expect:w.tr.split(" ")[0], alts:[w.tr], reveal:w.n, mode:"type"});
  }
 });
 // 4. short answer from recap principles — self-graded against keywords
 (l.recap||[]).forEach(function(r,i){
  var words=r.split(" ");
  if(words.length<8)return;
  out.push({k:"short",id:"L"+id+"Ds"+i,
   prompt:"Finish the principle in your own words: “"+words.slice(0,5).join(" ")+"…”",
   expect:r, reveal:r, mode:"free"});
 });
 return out;
}

  var take=Math.min(3,l.quiz.length);
  for(var i=0;i<take;i++){
   var step=Math.floor(l.quiz.length/take)||1;
   var q=l.quiz[i*step]||l.quiz[i];
   out.push({id:"L"+l.id+"C"+i,concept:true,lid:l.id,lt:l.title,
    w:{o:q.q,tr:"",gl:q.a[q.c],n:q.why,lang:"la"}});
  }
 });
 return out;
}

/* --- cumulative interleaved review --- */
function cumulativePool(){
 var pool=[];
 LESSONS.forEach(function(l){
  var st=L(l.id);
  if(!st.read)return;
  var lastDay=st.attempts.length?dayNum(st.attempts[st.attempts.length-1].d):dayNum()-30;
  var staleness=Math.min(30,dayNum()-lastDay)/30;      // 0..1, older = higher
  var weakness=(100-(st.best||0))/100;                  // 0..1, worse = higher
  var weight=0.25+weakness*1.5+staleness*1.0;
  l.quiz.forEach(function(q,i){pool.push({l:l,q:q,qi:i,w:weight});});
 });
 return pool;
}
function drawCumulative(n){
 var pool=cumulativePool();
 if(!pool.length)return [];
 var picked=[],usedLesson={};
 var total=pool.reduce(function(a,p){return a+p.w;},0);
 var guard=0;
 while(picked.length<Math.min(n,pool.length)&&guard++<n*40){
  var r=Math.random()*total,acc=0,sel=null;
  for(var i=0;i<pool.length;i++){acc+=pool[i].w;if(acc>=r){sel=i;break;}}
  if(sel===null)sel=pool.length-1;
  var p=pool[sel];
  var key=p.l.id+"-"+p.qi;
  // spread across lessons: allow max 2 per lesson until we run short
  if(picked.some(function(x){return x.key===key;})){continue;}
  if((usedLesson[p.l.id]||0)>=2&&picked.length<n-1&&Object.keys(usedLesson).length<12){continue;}
  usedLesson[p.l.id]=(usedLesson[p.l.id]||0)+1;
  picked.push({key:key,l:p.l,q:p.q});
 }
 return picked;
}

 });
 return out.concat(conceptCards()).concat(typeof argumentCards==='function'?argumentCards():[]);
}

/* --- pronunciation via the browser's speech synthesis --- */
function canSpeak(){return typeof window!=="undefined"&&typeof window.speechSynthesis!=="undefined";}
function speak(txt,lang){
 if(!canSpeak()){toast("This browser has no speech support");return;}
 try{
  var u=new SpeechSynthesisUtterance(txt);
  u.lang=lang==="he"?"he-IL":(lang==="gk"?"el-GR":"en-GB");
  u.rate=0.75;
  var vs=window.speechSynthesis.getVoices()||[];
  var pref=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf(u.lang.slice(0,2))===0;})[0];
  if(pref)u.voice=pref;
  else if(lang==="he"||lang==="gk"){toast("No "+(lang==="he"?"Hebrew":"Greek")+" voice installed — skipping");return;}
  window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
 }catch(e){toast("Could not play that");}
}
function sayBtn(txt,lang){
 return '<button class="say" title="Hear it (modern pronunciation)" aria-label="Hear this term pronounced" onclick="speak(&quot;'+String(txt).replace(/"/g,"")+'&quot;,&quot;'+(lang||"")+'&quot;)">&#9654;</button>';
}

 });

function searchAll(q){
 if(!q||q.trim().length<2)return [];
 var terms=norm(q).split(" ").filter(Boolean);
 var out=[];
 buildIndex().forEach(function(e){
  var t=norm(e.text),score=0;
  terms.forEach(function(w){
   var i=t.indexOf(w);
   if(i>=0){score+=3;if(norm(e.title).indexOf(w)>=0)score+=4;}
   else if(t.split(" ").some(function(x){return x.length>4&&sim(x,w)>=0.86;}))score+=1;
  });
  if(score>=terms.length)out.push({e:e,s:score});
 });
 // user's own material
 (S.clips||[]).forEach(function(c){
  var t=norm(c.text+" "+(c.note||""));
  var score=0;terms.forEach(function(w){if(t.indexOf(w)>=0)score+=3;});
  if(score>=terms.length*3)out.push({e:{lid:c.lid,tab:"read",kind:"your clipping",title:c.text.slice(0,80),text:c.text},s:score+2});
 });
 Object.keys(S.notes||{}).forEach(function(k){
  var n=S.notes[k];if(!n.t)return;
  var t=norm(n.t),score=0;terms.forEach(function(w){if(t.indexOf(w)>=0)score+=3;});
  if(score>=terms.length*3)out.push({e:{lid:+k,tab:"notes",kind:"your note",title:n.t.slice(0,80),text:n.t},s:score+2});
 });
 out.sort(function(a,b){return b.s-a.s;});
 return out.slice(0,60);
}

}

function dueCards(){ var s=splitCards(); return s.rev.concat(s.nw.slice(0,newBudget())); }
function waitingNew(){ var s=splitCards(); return Math.max(0,s.nw.length-newBudget()); }

/* boot now lives at the end of D3_grow.js, the last file in the bundle */
/* ============ ONE MAP, A RESPONSE JOURNAL, AND A PARTNER ============

   Three things here.

   1. The app was drawing the journey twice. The sidebar showed six curricular
      phases; the Today strip showed six narrative movements that straddled
      them — "Israel" spanned lessons 8 to 20 across three phases, while
      lessons 1 to 5 appeared in no movement at all. The cause turned out to be
      a real property of the curriculum: the narrative runs 1–16 and then
      21–30, because lessons 17–20 step out of the timeline to look at the
      songbook and the wisdom books. The fix is not to hide that but to say it.

   2. A response journal. Knowledge retention was measured; what the reader
      intends to DO about it was not. This records that, and brings it back on
      the spacing schedule asking what actually happened. Deliberately
      unscored — no xp, no streak, no badge. Obedience is not a metric.

   3. Partner mode. No server, so two people are joined by a short code one
      sends the other. The code carries progress only — never note or clip
      text. */

/* ---------- 1. one map ---------- */
/* Aligned to phase boundaries and sharing the phase colours, so the strip on
   Today and the dots in the sidebar are finally the same structure. */
ARC=[
 {n:"The toolkit",       s:"how to read it, before reading it",        ls:[1,2,3,4,5],       ph:1, c:PHASECOL[0], aside:true},
 {n:"Creation to covenant",s:"a world made, broken, and a family called",ls:[6,7,8,9,10],    ph:2, c:PHASECOL[1]},
 {n:"Land and prophets", s:"the covenant tested to breaking",          ls:[11,12,13,14,15,16],ph:3, c:PHASECOL[2]},
 {n:"The songbook",      s:"an interlude, stepping out of the timeline",ls:[17,18,19,20],    ph:4, c:PHASECOL[3], interlude:true},
 {n:"Christ",            s:"the story's centre",                       ls:[21,22,23,24,25],  ph:5, c:PHASECOL[4]},
 {n:"Church and new creation",s:"outward, and then home",              ls:[26,27,28,29,30],  ph:6, c:PHASECOL[5]}
];

function arcOf(id){ var m=null; ARC.forEach(function(a){ if(a.ls.indexOf(id)>=0)m=a; }); return m; }

/* The strip, extracted so Today and elsewhere draw the same thing. */
function storyStrip(){

 ARC.forEach(function(a,i){ if(a.ls.indexOf(last)>=0)pos=i; });

var RESP_AT=[10,30,90,240];

function blank(){return{v:3,xp:0,streak:0,best:0,last:null,lessons:{},cards:{},badges:[],reviewed:0,
 lastLesson:null,lastTab:"read",created:today(),notes:{},clips:[],services:[],drills:{},cum:{attempts:[]},
 logos:false,logosVer:"esv",openPhase:{},clipFilter:"all",atlasFilter:"all",

function respOf(lid){
 if(!S.resp)S.resp={};
 return S.resp[lid]||{t:"",d:null,checks:[]};
}
function respSave(lid){
 var e=document.getElementById("resp"+lid); if(!e)return;
 if(!S.resp)S.resp={};
 var r=respOf(lid), txt=e.value.trim();
 if(!txt){ delete S.resp[lid]; save(); render(); toast("Cleared"); return; }
 var isNew=!r.d;
 r.t=txt; if(isNew)r.d=today(); r.checks=r.checks||[];
 S.resp[lid]=r; save(); render();
 toast(isNew?"Written down":"Updated");
}
/* due = the next unmet checkpoint has passed */
function respDue(){
 if(!S.resp)return [];
 var d=dayNum(), out=[];
 Object.keys(S.resp).forEach(function(k){
  var r=S.resp[k]; if(!r||!r.d||!r.t)return;
  var n=(r.checks||[]).length;
  if(n>=RESP_AT.length)return;
  var when=dayNum(r.d)+RESP_AT[n];
  if(when<=d){
   var l=lesson(+k);
   out.push({lid:+k,title:l?l.title:("Lesson "+k),wrote:r.d,days:d-dayNum(r.d),stage:n,text:r.t});
  }
 });
 out.sort(function(a,b){return b.days-a.days;});
 return out;
}
function respCheckin(lid){
 var e=document.getElementById("respck"+lid); if(!e)return;
 var txt=e.value.trim(); if(!txt){toast("Write a line first");return;}
 var r=respOf(lid); r.checks=r.checks||[];
 r.checks.push({d:today(),n:txt,days:dayNum()-dayNum(r.d)});
 S.resp[lid]=r; save(); render(); toast("Logged");
}

/* ---------- boot: the true last line of the bundle ---------- */
/* Boot lives only in the last file of the bundle. Every file that called
   render() here fired it before the NEXT file's `var` constants existed —
   function declarations hoist, plain assignments do not — which is how
   renderBottom came to run with PLACES still undefined. */
/* ============ SCHEDULER, CARD TIMING, ONE NAME, ONE VOICE ============

   Four defects, all measured:

   1. On a brand-new card, Hard and Good both offered 1 day, so the grading
      choice was theatre. New cards now get proper learning steps.

   2. Cards entered the review pool the moment a lesson was OPENED — thirteen
      of them, two already due, before a word had been read. They now enter
      when the lesson has actually been studied.

   3. Every phase carried two different names, because the story strip I added
      introduced a second set alongside the curriculum's own. One name now.

   4. Four competing reward systems ran at once — xp, levels, a daily streak
      and fourteen badges — while the Response page promised nothing was
      scored. The points are gone. What remains is earned by retaining,
      teaching and responding. */

/* ---------- 1. one name per thing ---------- */
var PHASE_NAMES=["Foundations","Creation to covenant","Land, kings and prophets",
                 "The songbook","Christ","Church and new creation"];
PHASES.forEach(function(p,i){ if(PHASE_NAMES[i])p.t=PHASE_NAMES[i]; });
ARC.forEach(function(a,i){ if(PHASE_NAMES[i])a.n=PHASE_NAMES[i]; });

/* ---------- 2. cards enter review once the lesson is studied ---------- */
/* "Read" means opened. "Studied" means the learner reached the end of the
   teaching — the recap — or completed the lesson. Vocabulary should not be
   tested before it has been met. */
function markStudied(id){
 var st=L(id);
 if(!st.studied){ st.studied=true; save(); }
}
function studiedLesson(id){
 var st=L(id);
 /* older saves have no flag: anything completed or quizzed counts */
 return !!(st.studied||st.done||(st.attempts&&st.attempts.length));
}
function allCards(){
 var out=[];
 LESSONS.forEach(function(l){
  if(!studiedLesson(l.id))return;
  (l.words||[]).forEach(function(w,i){out.push({id:cardId(l.id,i),w:w,lid:l.id,lt:l.title});});
 });
 return out.concat(conceptCards()).concat(typeof argumentCards==="function"?argumentCards():[]);
}
/* conceptCards and argumentCards read l.read directly; gate them the same way */
var _conceptCore=conceptCards, _argCore=(typeof argumentCards==="function")?argumentCards:null;
conceptCards=function(){ return _conceptCore().filter(function(c){return studiedLesson(c.lid);}); };
if(_argCore) argumentCards=function(){ return _argCore().filter(function(c){return studiedLesson(c.lid);}); };

/* ---------- 3. learning steps, so the four buttons mean four things ---------- */
var NEWSTEPS={1:1,2:3,3:7};     /* Hard, Good, Easy on a card met for the first time */
function isNewCard(c){ return c.reps===0&&!c.lapses; }
function rate(id,q){
 var fresh=!S.cards[id];
 var c=card(id),d=dayNum();
 if(isNewCard(c)&&q>0){
  /* first real answer: fixed steps rather than the SM-2 curve */
  c.reps=1; c.iv=NEWSTEPS[q]; c.due=d+c.iv;
  if(q===1)c.ef=Math.max(1.3,c.ef-0.15);
  if(q===3)c.ef=Math.min(2.8,c.ef+0.15);
 }
 else if(q===0){c.reps=0;c.iv=0;c.lapses++;c.ef=Math.max(1.3,c.ef-0.2);c.due=d;}
 else if(q===1){c.ef=Math.max(1.3,c.ef-0.15);c.iv=Math.max(1,Math.round((c.iv||1)*1.2));c.reps++;c.due=d+c.iv;}
 else if(q===2){c.reps++;c.iv=c.reps===1?1:c.reps===2?3:Math.max(1,Math.round(c.iv*c.ef));c.due=d+c.iv;}
 else{c.ef=Math.min(2.8,c.ef+0.15);c.reps++;c.iv=Math.max(1,Math.round(c.iv*c.ef*1.3));c.due=d+c.iv;}
 if(fresh){ if(!S.newToday||S.newToday.d!==today())S.newToday={d:today(),n:0}; S.newToday.n++; }
 S.reviewed++;
}
/* the interval preview under each button must agree with what rate() will do */
function previewIv(c,q){
 if(isNewCard(c))return q===0?0:NEWSTEPS[q];
 if(q===0)return 0;
 if(q===1)return Math.max(1,Math.round((c.iv||1)*1.2));
 if(q===2)return c.reps===0?1:c.reps===1?3:Math.max(1,Math.round(c.iv*c.ef));
 return Math.max(1,Math.round(c.iv*c.ef*1.3));
}

/* ---------- boot ---------- */
/* Boot lives only in the last file of the bundle. Every file that called
   render() here fired it before the NEXT file's `var` constants existed —
   function declarations hoist, plain assignments do not — which is how
   renderBottom came to run with PLACES still undefined. */
/* ============ DURABILITY ============

   Thirty weeks of notes, responses and review history lived in one browser's
   local storage, with the "automatic backup" written into the same storage it
   was meant to protect. The app never asked the browser to keep that storage,
   so a phone short on space could clear it, and on some iOS versions deleting
   the home-screen icon wiped everything.

   Four changes: ask for persistent storage, register an offline layer when the
   app is served over http(s), write the safety-net snapshot somewhere the main
   store cannot take with it, and show the learner plainly where their data
   stands instead of leaving them to guess. */

/* ---------- 1. ask the browser to keep this ---------- */
function persistState(){
 if(S.persistAsked)return;
 S.persistAsked=true; save();
 try{
  if(navigator.storage&&navigator.storage.persist){
   navigator.storage.persist().then(function(granted){
    S.persisted=!!granted; save();
    if(typeof renderStorage==="function")renderStorage();
   }).catch(function(){});
  }
 }catch(e){}
}
function persistStatus(){
 /* re-read rather than trust the stored flag, since the browser can revoke */
 try{
  if(navigator.storage&&navigator.storage.persisted)
   navigator.storage.persisted().then(function(p){ if(p!==S.persisted){S.persisted=!!p;save();} });
 }catch(e){}
 return S.persisted===true;
}

/* ---------- 2. an offline layer, where one is possible ---------- */
/* A service worker cannot be registered from inside a single file, so this
   only engages on the hosted copy, which ships sw.js alongside index.html.
   Opened as a local file the app is already offline by definition, and the
   panel below says which of the two you are looking at. */
var SWSTATE="unknown";
function initOffline(){
 try{
  if(location.protocol!=="http:"&&location.protocol!=="https:"){ SWSTATE="local file — already offline"; return; }
  if(!("serviceWorker" in navigator)){ SWSTATE="not supported by this browser"; return; }
  navigator.serviceWorker.register("sw.js").then(function(){
   SWSTATE="ready — opens without a signal";
   if(typeof renderStorage==="function")renderStorage();
  }).catch(function(e){
   SWSTATE="unavailable ("+(e&&e.name?e.name:"failed")+")";
  });
 }catch(e){ SWSTATE="unavailable"; }
}

/* ---------- 3. a snapshot that does not share the fate of the main store ---------- */
/* sessionStorage survives a corrupted write to the main key within a session,
   and the download below leaves the browser entirely. */
function snapshotAside(){
 try{
  var raw=localStorage.getItem(KEY);
  if(raw)sessionStorage.setItem(KEY+"_aside",raw);
 }catch(e){}
}
function restoreAside(){
 try{
  var raw=sessionStorage.getItem(KEY+"_aside");
  if(!raw){ toast("No in-session snapshot"); return; }
  var o=migrate(JSON.parse(raw));
  if(!o){ toast("Snapshot unreadable"); return; }
  S=o; save(); SEARCH_INDEX=null; R.queue=null; go("home"); toast("Snapshot restored");
 }catch(e){ toast("Snapshot unreadable"); }
}
function saveToFiles(){
 /* the same payload as a backup, but named for the day so successive saves do
    not overwrite each other in the Files app */
 try{
  var blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="scripture-study-"+today()+".json";
  a.click();
  S.lastBackup=today(); save();
  if(typeof renderStorage==="function")renderStorage();
  toast("Saved — choose Files to keep it off this device");
 }catch(e){ toast("Could not save"); }
}

 var start=h.lastIndexOf('<div class="card"',i);
 /* find the end of that card by brace-free scanning of div depth */
 var depth=0,j=start,end=-1;
 while(j<h.length){
  if(h.startsWith("<div",j)){depth++;j+=4;continue;}
  if(h.startsWith("</div>",j)){depth--;j+=6;if(depth===0){end=j;break;}continue;}
  j++;
 }
 if(end<0)return h+dataPanel();
 return h.slice(0,start)+dataPanel()+h.slice(end);
};

   render() here fired it before the NEXT file's `var` constants existed —
   function declarations hoist, plain assignments do not — which is how
   renderBottom came to run with PLACES still undefined. */
/* ============ ONE GUIDED PATH THROUGH A LESSON ============

   Six tabs mirrored how the data was stored — prose here, visuals there, words
   somewhere else — and left the learner to assemble a lesson out of them. The
   same material is now one path of seven steps in the order a person actually
   learns: orient, meet the text, write what you notice, be taught, be tested,
   carry it out, and close the loop on the question you were asked at the start.

   Nothing is removed and nothing is locked: every step is tappable, the path
   remembers where you stopped, and the old tab names still resolve so older
   links and saved positions keep working. */

var LSTEPS=[
 {k:"orient", n:"Orient",  m:1,  d:"where this sits, and the question"},
 {k:"text",   n:"The text",m:8,  d:"read the passages before the commentary"},
 {k:"observe",n:"Observe", m:2,  d:"what you noticed, before being told"},
 {k:"teach",  n:"Teach",   m:9,  d:"the lesson, with its pictures and words"},
 {k:"check",  n:"Check",   m:4,  d:"recognise, then produce from memory"},
 {k:"carry",  n:"Carry",   m:3,  d:"what you keep, and what you will do"},
 {k:"close",  n:"Close",   m:1,  d:"answer the opening question"}
];
var STEPALIAS={read:"teach",visuals:"teach",words:"teach",practice:"check",recap:"carry",quiz:"check",drill:"check"};
function stepKeys(){ return LSTEPS.map(function(s){return s.k;}); }
function normStep(t){
 if(!t)return null;
 if(stepKeys().indexOf(t)>=0)return t;
 return STEPALIAS[t]||null;
}
function stepIndex(k){ return stepKeys().indexOf(k); }
function lessonMinutes(l){
 return LSTEPS.reduce(function(a,s){ return a+(s.k==="text"||s.k==="teach"?0:s.m); },0)
   + Math.round(readMins(l)*0.55) + Math.round(readMins(l)*0.45);
}

/* where the learner stopped */
function savedStep(lid){ return (S.lstep&&S.lstep[lid])||"orient"; }
function setStep(lid,k){ if(!S.lstep)S.lstep={}; S.lstep[lid]=k; save(); }

/* completion is earned by being tested and by carrying it out */
function stepDone(lid,k){
 var st=L(lid);
 if(k==="check")  return st.attempts&&st.attempts.length>0;
 /* must NOT fall back to st.done: done is derived from this, so reading it
    here made the test circular and let a quiz alone complete a lesson */
 if(k==="carry")  return !!(S.resp&&S.resp[lid]&&S.resp[lid].t);
 if(k==="observe")return !!(S.obs&&S.obs[lid]&&String(S.obs[lid]).trim());
 if(k==="close")  return !!(S.closed&&S.closed[lid]);
 var seen=(S.seenStep&&S.seenStep[lid])||{};
 return !!seen[k];
}
function touchStep(lid,k){
 if(!S.seenStep)S.seenStep={};
 if(!S.seenStep[lid])S.seenStep[lid]={};
 if(!S.seenStep[lid][k]){ S.seenStep[lid][k]=1; save(); }
}
function maybeComplete(lid){
 if(stepDone(lid,"check")&&stepDone(lid,"carry")&&!L(lid).done){ markDone(lid); }
}

function saveObs(lid){
 var e=document.getElementById("obs"+lid); if(!e)return;
 if(!S.obs)S.obs={};
 S.obs[lid]=e.value; save(); render(); toast("Noted");
}
function closeLesson(lid){
 var e=document.getElementById("close"+lid);
 if(!S.closed)S.closed={};
 S.closed[lid]={d:today(),t:e?e.value.trim():""};
 markStudied(lid); maybeComplete(lid); save(); render();
}

   sets st.done directly at 70%, which let a learner finish a lesson without
   ever writing down what they would do about it. Rather than race that write,
   `done` is recomputed from the evidence: a lesson is complete when it has
   been tested and carried, or when the learner declared they had done it
   elsewhere. Deriving it means no ordering bug can leave the flag wrong. */
function completionAllowed(id){ return stepDone(id,"check")&&stepDone(id,"carry"); }
function reconcileDone(){
 LESSONS.forEach(function(l){
  var st=S.lessons&&S.lessons[l.id]; if(!st)return;
  var earned=st.manual===true||completionAllowed(l.id);
  if(st.done!==earned)st.done=earned;
 });
}
/* the explicit "I did this elsewhere" route stays authoritative */
var _markDoneCore6=markDone;
markDone=function(id){ var st=L(id); st.manual=true; return _markDoneCore6(id); };
/* …but the path's own completion is earned, not declared */
function maybeComplete(id){
 if(completionAllowed(id)&&!L(id).done){ L(id).done=true; markStudied(id); checkBadges(); save(); }
}
var _renderCore6=render;
render=function(){ reconcileDone(); _renderCore6(); };

/* ============ SCRIPTURE FIRST ============

   The guided path had a step called "The text" that contained no text — only a
   list of references and a link out to Logos. A learner on a phone, on a bus,

   This bundles the World English Bible (public domain, no permission needed
   and nothing to pay) for the main passage of every lesson, so the app opens
   on Scripture with no network and no second app. It does not replace the
   reader's own translation: the Logos links stay, and the memorisation track
   still takes whatever translation they paste.

   Each passage carries two "look for" prompts, written for that passage, so
   the reading has a question in hand before the commentary arrives. */

   the Mac and survives a cleared browser.

   Deliberate choices:

   - Offline first. The app still works with no signal and no account; the
     cloud is a mirror of local state, never a dependency. Every read and write
     the lesson code does still goes to localStorage first.

     here ever asks you to type a password into something I wrote.
   - The key below is the publishable key, which is safe in public: the
     database's row-level security is what protects the data, and it grants a
     signed-in person access to their own row and to nothing else. An anonymous
     caller with this key can read nothing at all.

     changed since the last sync, the losing copy is kept in local storage and
     the Account panel says so. */

   would capture this wrapper and call itself forever. */
var _saveLocal=save;

   Opening the app presented twelve sidebar destinations and five thumb tabs,

   serves memory: clear the review debt, say the passages, answer the
   commitments that have come back, then take the next step of this week's

   '<p class="small muted" style="margin:0 0 12px;">The week&rsquo;s lesson is done and nothing has come back round yet. '+
   'A good day to reread a recap, or write up what you would teach.</p>'+
   '<div class="btnrow"><button class="btn" onclick="go(\'response\')">What I said I would do</button>'+
   '<button class="btn ghost" onclick="go(\'cumulative\')">Cumulative review</button></div></div>';
 return '<div class="card sessc"><div class="eyebrow">Today</div>'+
  '<h2 style="font-family:var(--serif);font-size:21px;margin:4px 0 2px;">'+
   (ranToday?"Pick up where you left off":"Start today&rsquo;s session")+'</h2>'+
  '<p class="small muted" style="margin:2px 0 11px;">'+plan.length+' thing'+(plan.length===1?"":"s")+', about '+mins(total)+'. In order, so you do not have to choose.</p>'+
  '<ol class="splan">'+plan.map(function(x){
    return '<li><b>'+esc(x.n)+'</b><span>'+esc(x.s)+'</span></li>';}).join("")+'</ol>'+
  '<div class="btnrow" style="margin-top:12px;"><button class="btn pri" onclick="sessionStart()">'+
   (ranToday?"Continue":"Start")+'</button></div></div>';
}
viewHome=function(){
 var h=_viewHomeCore7();
 /* the session card replaces the old list of four competing calls to action */
 h=h.replace(/<button class="todo[\s\S]*?<\/button>(?=\s*<div class="herofoot")/,"");
 var i=h.indexOf('<div class="herofoot"');
 if(i<0) return sessionCard()+h;
 return h.slice(0,i)+'</div>'+sessionCard()+h.slice(i).replace(/^<div class="herofoot"/,'<div class="herofoot hidden"');
};

/* ---------- four places ---------- */
var PLACES=[
 {k:"today",  n:"Today",    i:"◉", v:["home","review","memorise","cumulative","capstone"]},
 {k:"course", n:"Course",   i:"≡", v:["lesson","atlas","search"]},
 {k:"note",   n:"Notebook", i:"✎", v:["commonplace","response","workspace"]},
 {k:"you",    n:"You",      i:"◍", v:["stats","partner"]}
];
function placeOf(v){ var k="today"; if(typeof PLACES==="undefined")return k; PLACES.forEach(function(p){ if(p.v.indexOf(v)>=0)k=p.k; }); return k; }
function goPlace(k){
 var first={today:"home",course:"lesson",note:"commonplace",you:"stats"}[k];
 if(k==="course"){ go('lesson',S.lastLesson||nextUnread()||1); return; }
 go(first);
}
function renderBottom(){
 var b=document.getElementById("bottom"); if(!b||typeof PLACES==="undefined")return;
 var cur=placeOf(view.name);
 var counts={today:dueCards().length+((typeof memDue==="function")?memDue().length:0),
             note:(typeof respDue==="function")?respDue().length:0};
 b.innerHTML=PLACES.map(function(p){
  var c=counts[p.k]||0;
  return '<button class="'+(cur===p.k?"on":"")+'" onclick="goPlace(\''+p.k+'\')" aria-label="'+p.n+(c?", "+c+" due":"")+'">'+
   '<span class="bi" aria-hidden="true">'+p.i+'</span>'+p.n+
   (c?'<span class="bdot">'+(c>99?"99+":c)+'</span>':'')+'</button>';
 }).join("");
}

/* sidebar grouped the same four ways, so the two navigations agree */
var _renderNavCore7=renderNav;
renderNav=function(){
 _renderNavCore7();
 var n=document.getElementById("nav"); if(!n)return;
 n.innerHTML=n.innerHTML
  .replace(/>Study</,">Today<")
  .replace(/>Library</,">Notebook<")
  .replace(/>Curriculum</,">Course<");
};

/* the bar rides above every view while a session is running */
var _renderCore7=render;
render=function(){
 _renderCore7();
 var v=document.getElementById("view"); if(!v)return;
 var bar=sessionBar();
 if(bar)v.innerHTML=bar+v.innerHTML;
 renderBottom();
};

if(typeof autoBackupCheck==="function")autoBackupCheck();
render();
</script>
</body>
</html>
