{id:25,phase:5,title:"Resurrection and ascension",sub:"Aparchē, lordship, new creation",
aim:"See the resurrection as the beginning of the new creation rather than a happy ending, and understand what the ascension secured.",
sections:[
{h:"Not a resuscitation",p:[
"Lazarus was raised and died again. The New Testament claims something different for Jesus: a body that is continuous with the one that died — it bears the wounds, it eats fish — and also transformed, appearing in locked rooms and not immediately recognised. Paul calls it a σῶμα πνευματικόν (sōma pneumatikon), a spiritual body, meaning a body animated by the Spirit rather than a body made of spirit. Physical, and different.",
"This matters because a purely spiritual survival would leave the material world unredeemed. The resurrection is a claim that God's answer to death is not escape from the body but the renewal of it — and by extension of everything else."]},
{h:"Firstfruits",p:[
"Paul's key term in 1 Corinthians 15 is ἀπαρχή (aparchē), firstfruits — the first sheaf of the harvest, brought to the temple as both a thank-offering and a guarantee that the rest of the field is coming. The resurrection is not an isolated miracle; it is the first instalment of a general resurrection, and Paul's argument is that you cannot have the first sheaf without the harvest it announces.",
"He is blunt about the stakes: if Christ has not been raised, our preaching is useless, your faith is useless, we are false witnesses, you are still in your sins, and those who have died are lost — and we are of all people most to be pitied. He does not offer the resurrection as an optional extra or a symbol of hope; he stakes the whole thing on an event."]},
{h:"The evidence as the writers present it",p:[
"The empty tomb, in all four gospels. Appearances to individuals and to groups — Paul's list in 1 Corinthians 15 includes more than five hundred at once, with the remark that most are still alive, which is an invitation to ask them. The transformation of the disciples from a group hiding behind locked doors to public preachers within weeks, in the same city, at a cost.",
"And a detail that no first-century writer would invent: women as the first witnesses. Women's testimony was of limited value in Jewish legal contexts, and a fabricated account would have used men. All four gospels name women first."]},
{h:"The ascension and what it means",p:[
"Forty days later, in Acts 1, he is taken up. The ascension is not Jesus leaving; it is Jesus being enthroned. Daniel 7's son of man goes up with the clouds to receive dominion — the direction of travel in that vision is toward the Ancient of Days, not away from it. The New Testament's dominant image is not absence but session: seated at the right hand.",
"Three consequences follow. He reigns — κύριος (kyrios), Lord, the Septuagint's word for YHWH, applied to Jesus in a confession that in a Roman world directly contradicts Caesar is lord. He intercedes — a human being permanently in the presence of God on our behalf, which is Hebrews' whole argument. And he sends — the Spirit comes precisely because he has gone, and Pentecost happens ten days later.",
{aside:{t:"What it does to worship",p:"Philippians 2 is very likely an early hymn, and it is the shape of Christian worship in miniature: he did not grasp equality, he emptied himself, he became obedient to death on a cross — therefore God has highly exalted him, and every knee will bow. The exaltation is grounded in the humiliation. A worship service that sings only the throne without the descent has cut the therefore out of the middle of the hymn."}}]}],
words:[
{o:"ἀπαρχή",tr:"aparchē",lang:"gk",gl:"firstfruits",n:"The first sheaf brought to the temple — a thank-offering and a guarantee that the harvest is coming."},
{o:"σῶμα πνευματικόν",tr:"sōma pneumatikon",lang:"gk",gl:"spiritual body",n:"A body animated by the Spirit, not made of spirit. Physical, and transformed."},
{o:"κύριος",tr:"kyrios",lang:"gk",gl:"Lord",n:"The Septuagint's rendering of YHWH, applied to Jesus — and a direct collision with Caesar is lord."},
{o:"ἀνάστασις",tr:"anastasis",lang:"gk",gl:"standing up again",n:"Resurrection as getting up, not as survival of a soul. The Athenians laugh at it in Acts 17."},
{o:"ἐκένωσεν",tr:"ekenōsen",lang:"gk",gl:"he emptied himself",n:"Philippians 2:7. The hinge of the hymn — and the ground of the exaltation that follows."},
{o:"πρωτότοκος",tr:"prōtotokos",lang:"gk",gl:"firstborn",n:"Rank and priority rather than chronology — firstborn from the dead, head of a new humanity."}],
passages:["1 Corinthians 15","Luke 24","John 20–21","Acts 1:1–11","Romans 8:11","Philippians 2:5–11","Hebrews 7:23–25","Revelation 1:12–18"],
visual:[
{type:"compare",title:"Resuscitation against resurrection",caption:"The distinction is the whole argument of 1 Corinthians 15.",
left:{h:"Lazarus",s:"raised, and later died",items:["The same body returned to the same life","Grave clothes still needing removal","Recognised immediately","Subject to death again","A reprieve"]},
right:{h:"Jesus",s:"the firstfruits",items:["Continuous — wounds remain, he eats","Grave clothes left behind, folded","Often not recognised at first","Death has no more dominion","The first sheaf of a harvest"]}},
{type:"flow",title:"From tomb to throne to Pentecost",caption:"The ascension is enthronement, not departure — and it is why the Spirit comes.",
steps:[{n:"Empty tomb",s:"women as first witnesses"},{n:"Appearances",s:"individuals, groups, over five hundred"},{n:"Forty days",s:"teaching about the kingdom"},{n:"Ascension",s:"taken up — Daniel 7 in reverse view"},{n:"Session",s:"seated at the right hand, interceding"},{n:"Pentecost",s:"because he has gone, the Spirit comes"}]},
{type:"stack",title:"The shape of Philippians 2",caption:"Descent, then therefore. Cutting the middle out changes what the song is about.",
layers:[{n:"In the form of God",s:"did not grasp equality"},{n:"Emptied himself",s:"ekenōsen — took the form of a servant"},{n:"Born in human likeness",s:"found in human form"},{n:"Obedient to death",s:"even death on a cross"},{n:"Therefore God exalted him",s:"the hinge of the hymn"},{n:"Every knee will bow",s:"and every tongue confess kyrios"}]}],
recap:["The risen body is continuous and transformed — a body animated by the Spirit, not made of it.","Aparchē is the first sheaf: proof the harvest is coming. The resurrection is an instalment, not an exception.","Paul stakes everything on the event: if Christ is not raised, we are of all people most to be pitied.","Women as first witnesses is a detail nobody inventing an account would have chosen.","The ascension is enthronement — kyrios is the Septuagint's word for YHWH, and it collides with Caesar.","Philippians 2 grounds the exaltation in the descent. Do not sing the throne without the therefore."],
quiz:[
{q:"Aparchē, firstfruits, implies that the resurrection is:",a:["The first instalment guaranteeing a harvest to follow","A symbol of spiritual renewal only","A private experience of the disciples","A unique exception with no sequel"],c:0,why:"The first sheaf was brought to the temple precisely as a pledge that the rest of the field was coming."},
{q:"Sōma pneumatikon means:",a:["A body made of spirit","A body animated and empowered by the Spirit — physical and transformed","A ghost or apparition","A metaphor for the church"],c:1,why:"He bears wounds and eats fish, and also appears in locked rooms. Continuity and transformation together."},
{q:"Paul's argument in 1 Corinthians 15 is that if Christ has not been raised:",a:["Nothing significant changes","Faith is still valuable as a moral system","Preaching and faith are useless and we are still in our sins","Only the resurrection of believers is affected"],c:2,why:"He refuses to treat it as a symbol. The whole structure rests on an event."},
{q:"Women being named as the first witnesses is significant because:",a:["Only women were present in Jerusalem","It fulfils a specific prophecy","Women were the primary leaders of the early church","Their testimony carried limited legal weight, so an invented account would not have used them"],c:3,why:"All four gospels name women first — a detail against the interests of a fabricated narrative."},
{q:"The ascension is best understood as:",a:["His enthronement — taken up to receive dominion, as in Daniel 7","A symbolic image of spiritual elevation","The end of his human nature","Jesus's departure and absence"],c:0,why:"The New Testament's dominant image is session: seated at the right hand, reigning and interceding."},
{q:"Kyrios, applied to Jesus, is politically charged because:",a:["It was a title reserved for priests","It is the Septuagint's word for YHWH, and Rome required the confession that Caesar is lord","It meant military commander","It was used only of the emperor's family"],c:1,why:"Jesus is Lord is a confession with two edges, one theological and one imperial."},
{q:"According to John and Acts, the Spirit comes at Pentecost:",a:["Only to the twelve apostles","Independently of the ascension","Precisely because Jesus has gone to the Father","Before the ascension"],c:2,why:"It is to your advantage that I go away, for if I do not go, the Helper will not come."},
{q:"The word therefore in Philippians 2:9 links the exaltation to:",a:["The Father's arbitrary choice","The resurrection of the saints","Jesus's pre-existent glory","His self-emptying and obedience to death on a cross"],c:3,why:"The descent grounds the exaltation. Removing the middle changes what the hymn is claiming."}]}
);

{id:26,phase:6,title:"Pentecost and the church",sub:"Ekklēsia, ruach, and the book of Acts",
aim:"See how a scattered group becomes a movement, and what the Spirit's arrival actually established.",
sections:[
{h:"Pentecost",p:[
"Pentecost is Shavuot, the Feast of Weeks — fifty days after Passover, a harvest festival, and by the first century widely associated with the giving of the law at Sinai. Both associations land. At Sinai there was fire, a mountain, a sound and a covenant written on stone; here there is fire, a house, a sound like wind and a covenant written on hearts, as Jeremiah 31 promised.",
"The wind and fire imagery is not decoration. רוּחַ (ruach) and πνεῦμα (pneuma) both mean wind, breath and spirit. The Spirit who hovered over the waters in Genesis 1 and breathed into dust in Genesis 2 now fills a room.",
"And the sign is language. Every person hears in their own dialect. Babel scattered humanity by confusing speech; Pentecost gathers it without erasing the difference — the languages are not removed, they are all understood. The church begins multilingual on its first day, which is a permanent statement about what it is."]},
{h:"What the church is",p:[
"ἐκκλησία (ekklēsia) is not a religious word. In Greek city life it meant the assembly of citizens called out to conduct the city's business. The Septuagint also uses it for the assembly of Israel. Both senses are live: a called-out gathering, and the continuation of God's people.",
"Acts 2:42 gives the four things they devoted themselves to: the apostles' teaching, κοινωνία (koinōnia) — fellowship in the strong sense of common life and shared property, the breaking of bread, and the prayers. Note the definite article: the prayers, likely the fixed Jewish hours of prayer. The first church was not improvising from nothing.",
"They also kept meeting in the temple and in homes. Public and domestic, formal and informal, from the first week."]},
{h:"The reluctant expansion",p:[
"Acts 1:8 gives the programme: Jerusalem, Judea and Samaria, and the ends of the earth. The book follows it, but the church does not go willingly. They stay in Jerusalem until persecution scatters them. Philip goes to Samaria and to an Ethiopian official. Peter needs a vision repeated three times before he will enter a Gentile house, and is then criticised for it.",
"The Jerusalem council in Acts 15 settles the decisive question: do Gentiles have to become Jews to belong to the Messiah? The answer is no — with four practical requests to make table fellowship possible. It is the most consequential meeting in Christian history, and it is resolved by reading Scripture, hearing testimony, and reaching a judgement together.",
{aside:{t:"An honest observation",p:"The book of Acts is not a record of a church that got it right. It is a record of a church that was pushed, argued, misunderstood, split over a travelling companion, and had to be corrected by outsiders and visions. The Spirit's work is visible less in their competence than in the fact that it happened anyway."}}]},
{h:"Signs, opposition and the shape of the mission",p:[
"Acts is punctuated by summary statements — the word of God increased and the number of disciples multiplied — that divide the book into panels. Growth is attributed to the word rather than to strategy.",
"The mission moves along roads and through synagogues. Paul's pattern is to go to the synagogue first, where he finds both Jews and God-fearing Gentiles already attached, and where the Scriptures are already known. When rejected, he turns to the wider city. Persecution consistently spreads rather than suppresses the movement.",
"The book ends without an ending: Paul in Rome, under house arrest, preaching the kingdom of God with all boldness and without hindrance — ἀκωλύτως (akōlytōs), the last word of the Greek text. No verdict, no execution reported, no conclusion. Luke ends volume two mid-motion, which is either an accident of composition or the most eloquent full stop in the New Testament."]}],
words:[
{o:"ἐκκλησία",tr:"ekklēsia",lang:"gk",gl:"assembly, those called out",n:"A civic word for the citizens' assembly, also used in the Septuagint for the congregation of Israel."},
{o:"κοινωνία",tr:"koinōnia",lang:"gk",gl:"common life, participation",n:"Stronger than fellowship. In Acts it includes shared property and mutual obligation."},
{o:"πνεῦμα",tr:"pneuma",lang:"gk",gl:"wind, breath, spirit",n:"The Greek counterpart of ruach, carrying the same threefold range."},
{o:"παρρησία",tr:"parrēsia",lang:"gk",gl:"boldness, frank speech",n:"A civic virtue — the freedom of a citizen to speak plainly. Repeatedly what the church prays for."},
{o:"μάρτυς",tr:"martys",lang:"gk",gl:"witness",n:"A courtroom word. Its later meaning, martyr, was earned by what happened to witnesses."},
{o:"ἀκωλύτως",tr:"akōlytōs",lang:"gk",gl:"without hindrance",n:"The final word of Acts in Greek. The book ends mid-motion, on an adverb."}],

recap:["Pentecost is Shavuot — harvest, and by then associated with Sinai. Fire, sound and a covenant, twice.","Babel scattered by confusing language; Pentecost gathers without erasing it. The church is multilingual on day one.","Ekklēsia is a civic word for a called-out assembly, and the Septuagint's word for the congregation of Israel.","Acts 2:42's four devotions include the prayers, with a definite article — inherited, not invented.","Acts 15 settles the decisive question: Gentiles do not have to become Jews to belong to the Messiah.","The book ends on the adverb akōlytōs, without hindrance — mid-motion, with no conclusion."],

{q:"Ekklēsia was originally:",a:["A term for a household","A religious term for a temple","The civic assembly of citizens called out to do the city's business","A synonym for synagogue"],c:2,why:"And the Septuagint also uses it for the assembly of Israel — both senses are live in the New Testament."},

{q:"Martys, witness, later came to mean martyr because:",a:["It was a translation error","The words were unrelated and merged by accident","Of what consistently happened to those who testified","It was a title given by the church"],c:2,why:"A courtroom word whose meaning was reshaped by experience."},

{id:27,phase:6,title:"Paul",sub:"Dikaiosynē, charis, union with Christ",
aim:"Grasp Paul's central categories and read his letters as occasional documents addressing real situations.",
sections:[
{h:"The man and the letters",p:[
"A Pharisee trained under Gamaliel, a Roman citizen, a native of Tarsus, fluent in the Scriptures and in the Greek city. He persecuted the church and then, on the Damascus road, encountered the risen Jesus — and his own account emphasises not a change of religion but a reidentification of the messiah. Everything he already believed about God, Israel and the age to come is reorganised around one fact.",
"Thirteen letters bear his name. They are occasional documents: written to specific congregations about specific problems, which means we are always hearing one side of a conversation. Reconstructing the question is half of reading the answer. 1 Corinthians only makes sense once you notice he is working through a list."]},
{h:"Justification and the righteousness of God",p:[
"δικαιοσύνη θεοῦ (dikaiosynē theou) can mean God's own righteousness, or the status he gives, or his covenant faithfulness — and Paul probably exploits the ambiguity rather than settling it. The verdict of the last day is announced in advance over anyone who is in Christ.",
"The instrument is πίστις (pistis), which means both faith and faithfulness, trust and loyalty. This is not intellectual assent; it is the reliance the word aman describes in Genesis 15:6, which Paul quotes as his proof text.",
"χάρις (charis) is gift — and in the ancient world a gift created obligation and relationship. Paul's radical move is not that grace has no consequences but that it is given to the unworthy, which in a strict honour culture was close to scandalous. God gives to those who cannot reciprocate, and the gift creates the capacity to respond.",
"The old debate cast this as Paul against Jewish legalism. More recent work has stressed that Second Temple Judaism was not a religion of earning salvation, and that Paul's argument is substantially about whether Gentiles must take on the boundary markers of Israel — circumcision, food laws, calendar — in order to belong. The truth is likely that both are present: a genuine argument about the human inability to establish one's own standing, and a specific fight about who is in."]},
{h:"In Christ",p:[
"The phrase ἐν Χριστῷ (en Christō) and its variants occur more than 160 times, which makes union with Christ arguably Paul's most fundamental category — more basic than justification, since justification is one of its consequences.",
"The logic is participatory: what happened to Christ happened to those united with him. Crucified with him, buried with him, raised with him, seated with him. Romans 6 grounds the whole ethical argument here — you cannot continue in sin because you died to it, not because a rule forbids it.",
"This is also why the body imagery in 1 Corinthians 12 and Ephesians 4 is not a metaphor for organisational teamwork. If believers are in Christ, then they are in one another, and the diversity of gifts is a structural feature rather than an administrative convenience."]},
{h:"The shape of his ethics",p:[
"Almost every Pauline letter has a hinge. Romans turns at chapter 12 with “therefore, in view of God's mercies.” Ephesians turns at chapter 4 with “therefore… walk worthy of the calling.” Indicative first, then imperative: this is who you are, therefore live like it. Never the reverse.",
"His practical instruction is worked out under pressure, in mixed communities, with real disputes — food offered to idols, lawsuits, sexual ethics, disorderly worship, slaves and masters, a runaway named Onesimus. In 1 Corinthians 14 he addresses a church whose meetings had become chaotic, and his criterion is οἰκοδομή (oikodomē), building up: everything should be done for the strengthening of the body, and decently and in order. That criterion, applied honestly, will settle most disagreements about a service.",
{aside:{t:"Reading Paul well",p:"Three habits. Read a whole letter at a sitting — they were written to be read aloud in one go. Ask what problem the passage is answering; Paul is almost never speaking into the abstract. And let his own hinges organise your reading, so the imperatives stay attached to the indicative that grounds them."}}]}],
words:[
{o:"δικαιοσύνη",tr:"dikaiosynē",lang:"gk",gl:"righteousness, justice",n:"Both a status conferred and God's own covenant faithfulness. Paul exploits the range."},
{o:"χάρις",tr:"charis",lang:"gk",gl:"grace, gift",n:"In the ancient world a gift created relationship and obligation. Paul's scandal is that it goes to those who cannot reciprocate."},
{o:"πίστις",tr:"pistis",lang:"gk",gl:"faith, faithfulness, trust",n:"Reliance and loyalty in one word — closer to Hebrew emunah than to intellectual assent."},
{o:"ἐν Χριστῷ",tr:"en Christō",lang:"gk",gl:"in Christ",n:"Over 160 occurrences. Union is arguably Paul's most basic category, with justification as one of its results."},

{id:28,phase:6,title:"Hebrews and the general epistles",sub:"Christ as better, faith that works, love that tests",
aim:"Read the non-Pauline letters on their own terms, and let their different emphases correct rather than compete.",
sections:[
{h:"Hebrews: better",p:[
"Author unknown — Origen's third-century verdict, that God alone knows, has not been improved on. It is less a letter than a sermon, describing itself as a word of exhortation, and its structure alternates exposition with warning.",
"Its controlling word is κρείττων (kreittōn), better, used thirteen times. Better than angels, than Moses, than Joshua, than Aaron, a better covenant, better promises, a better sacrifice, a better country. The argument is not that the old was bad but that it was a σκιά (skia), a shadow — real, cast by something, and pointing to a body.",
"The central image is Jesus as high priest after the order of Melchizedek: a priesthood that predates Levi, is not inherited, and does not end. Hebrews 7:25 draws the conclusion — he always lives to intercede, so he is able to save completely.",
"And the warnings are severe: five of them, urging readers not to drift, not to harden, not to fall away. This is written to people under pressure who are considering going back, and its answer is not to lower the stakes but to raise the view of Christ."]},
{h:"James: faith that shows up",p:[
"Wisdom literature in New Testament clothing, closer to Proverbs and to the Sermon on the Mount than to Paul. Short, blunt, and organised as a series of practical tests.",
"Its famous line — faith without works is dead — is often set against Paul, and the tension is largely a matter of vocabulary. Paul uses works to mean the boundary markers of the law and any attempt to establish one's own standing; James uses it to mean the evidence a living faith produces. Paul uses faith to mean trusting reliance; James, in the passage in question, uses it of bare intellectual assent, and notes that the demons manage that much.",
"Both cite Abraham. Paul quotes Genesis 15:6, before circumcision; James quotes Genesis 22, where the belief of chapter 15 becomes visible. They are describing the same man at two points on the same line.",
"James is also merciless on the tongue, on partiality toward the rich, and on employers withholding wages. It is the New Testament book most continuous with the prophets."]},
{h:"Peter, John, Jude",p:[
"1 Peter is written to exiles — παρεπίδημοι (parepidēmoi), resident aliens — scattered across Asia Minor and suffering for their faith. Its argument is that suffering is neither an anomaly nor a failure, since they are following someone who suffered, and that their conduct under it is itself a testimony. It contains one of the New Testament's densest statements on the church as a royal priesthood and holy nation, applying Exodus 19 language directly to a mixed Gentile congregation.",
"2 Peter and Jude, closely related, deal with false teachers and with mockery about the delay of Christ's return. The answer offered is that God's patience is the reason for the delay, and that it is mercy, not indifference.",
"1 John gives three tests of genuine faith, cycling through them repeatedly: doctrinal — do you confess Jesus come in the flesh; moral — do you walk in the light; relational — do you love your brother and sister. It insists all three are non-negotiable, and it is written against an early teaching that denied Christ's real humanity."]},
{h:"What these letters contribute",p:[
"They keep the New Testament from being read as though Paul wrote all of it. Hebrews supplies the priestly and liturgical vocabulary that Paul largely does not. James supplies the ethical bluntness. Peter supplies a theology of suffering written from inside it. John supplies the tests that stop faith becoming an abstraction.",
"Read together, they describe a faith that is doctrinally definite, ethically visible, socially awkward and pastorally warm — and they consistently address people who are tired, tempted to quit, and being lied to."]}],
words:[
{o:"κρείττων",tr:"kreittōn",lang:"gk",gl:"better, superior",n:"Hebrews' controlling word, thirteen times. Not old versus bad, but shadow versus substance."},
{o:"σκιά",tr:"skia",lang:"gk",gl:"shadow",n:"A shadow is real and is cast by something. Hebrews' way of honouring the old covenant while moving past it."},
{o:"παρεπίδημοι",tr:"parepidēmoi",lang:"gk",gl:"resident aliens, sojourners",n:"1 Peter's address. Legally present, socially foreign — a status, not a mood."},
{o:"ὑπομονή",tr:"hypomonē",lang:"gk",gl:"endurance, remaining under",n:"Not passive patience. Staying put under weight, which James says produces maturity."},
{o:"δίψυχος",tr:"dipsychos",lang:"gk",gl:"double-souled, divided",n:"James's coinage for the unstable person — wanting two things at once."},
{o:"κοινωνία",tr:"koinōnia",lang:"gk",gl:"shared life",n:"1 John 1:3 — fellowship with the Father and the Son, and consequently with one another."}],

{q:"Parepidēmoi, 1 Peter's term for its readers, means:",a:["Persecuted believers","Resident aliens or sojourners — legally present, socially foreign","Travelling missionaries","Recent converts"],c:1,why:"A social status, which shapes the letter's entire argument about conduct under pressure."},

{q:"1 John's three tests of genuine faith are:",a:["Knowledge, experience and works","Scripture, tradition and reason","Baptism, communion, prayer","Doctrinal, moral and relational"],c:3,why:"Confessing Christ in the flesh, walking in the light, and loving one's brother and sister — all three required."}]},

{id:29,phase:6,title:"Revelation",sub:"Apocalyptic genre and worship in heaven",
aim:"Read Revelation as its first readers did — as pastoral encouragement in symbol, saturated with worship.",
sections:[
{h:"What kind of book",p:[
"Revelation announces three genres in its opening verses. It is an ἀποκάλυψις (apokalypsis), an unveiling. It is προφητεία (prophēteia), prophecy — covenant address to a present situation. And it is a letter, with a named author, named recipients and a standard epistolary greeting. All three constrain how it should be read.",
"Apocalyptic was a recognised genre with conventions: visions, an angelic guide, cosmic imagery, symbolic numbers, a sharp division between what appears to be happening and what is actually happening. Daniel, Ezekiel and Zechariah supply most of its vocabulary — around two-thirds of Revelation's verses allude to the Old Testament, though it never quotes directly.",
"Its purpose is pastoral. It is written to seven real congregations in Asia Minor facing pressure from the imperial cult, economic exclusion, internal compromise and, in places, execution. It exists to tell people under an empire that the empire is not what it appears, and that the Lamb is on the throne."]},
{h:"Reading the symbols",p:[
"The numbers are symbolic and consistent. Seven is completeness — seven churches, seals, trumpets, bowls, spirits, lampstands. Twelve is God's people, and multiples of it scale that up: 144,000 is 12 x 12 x 1000, a number of completeness rather than a headcount, and the group is described as both a numbered military census and an uncountable multitude in the same chapter. Six falls short. Three and a half, or forty-two months, or 1,260 days, is a broken seven — a limited period of trouble.",
"The most important interpretive move in the book occurs in chapter 5. John hears that the Lion of Judah has conquered, and turns to look — and sees a Lamb standing as though slain. What he hears and what he sees are held together, and the meaning of conquest is redefined by that juxtaposition. It happens again with the 144,000 heard and the multitude seen. Revelation repeatedly tells you one thing and shows you another, and the tension is the interpretation.",
{aside:{t:"Four ways people read it",p:"Preterist: it refers primarily to first-century events, especially Rome and AD 70. Historicist: it maps the whole sweep of church history. Futurist: it describes events still to come. Idealist: it depicts the ongoing conflict between God and evil in every age. Most careful readers now combine elements — a first-century address, with patterns that recur, and a genuine future consummation. What all four should share is a refusal to treat the book as a coded newspaper."}}]},
{h:"A book of worship",p:[
"There are more scenes of worship in Revelation than in any other New Testament book — at least fifteen hymns or acclamations. Chapters 4 and 5 are one continuous liturgy: the four living creatures, the twenty-four elders casting down crowns, the new song, and then every creature in heaven and on earth and under the earth and in the sea joining in.",
"The content is worth noting. Chapter 4 praises the Creator: worthy are you, for you created all things. Chapter 5 praises the Redeemer: worthy are you, for you were slain and by your blood you ransomed people for God from every tribe and language and people and nation. Creation and redemption, in that order, and the second is grounded in a death.",
"And the songs are political. Worthy is a word used of the emperor at his entrance. Lord and God was a title Domitian is said to have encouraged. Salvation belongs to our God was said of Caesar. Every acclamation in Revelation is being taken from one throne and given to another. Singing was how these churches told the truth about who actually ruled."]},
{h:"How it ends",p:[
"Not with escape but with descent. The new Jerusalem comes down out of heaven from God. The dwelling place of God is with man — the tabernacle promise, finally kept without qualification. Every tear wiped away, no death, no mourning, no crying, no pain, because the former things have passed away.",
"The city has no temple, because God and the Lamb are its temple. It has no sun or moon, because the glory of God is its light. The gates are never shut. The nations walk by its light and the kings bring their glory into it. The river of the water of life runs down the middle of the street, and the tree of life is on both sides, and its leaves are for the healing of the nations, and there is no more curse.",
"Genesis 3 stationed cherubim to guard the way to the tree. Revelation 22 opens it, in the middle of a city, with the nations invited. The last words of the book are a prayer — come, Lord Jesus — and a blessing."]}],
words:[
{o:"ἀποκάλυψις",tr:"apokalypsis",lang:"gk",gl:"unveiling, disclosure",n:"The curtain pulled back on what is already true, not primarily a forecast."},
{o:"ἀρνίον",tr:"arnion",lang:"gk",gl:"lamb, little lamb",n:"Used 28 times. A diminutive — and it is the one occupying the throne."},
{o:"ἄξιος",tr:"axios",lang:"gk",gl:"worthy",n:"An acclamation shouted at an emperor's entrance, redirected to the slain Lamb."},
{o:"μαρτυρία",tr:"martyria",lang:"gk",gl:"testimony, witness",n:"What the saints hold, and what costs them their lives — the word behind martyr."},
{o:"Βαβυλών",tr:"Babylōn",lang:"gk",gl:"Babylon",n:"A cipher for Rome, and for every empire that destroys the temple and trades in human lives."},
{o:"νικάω",tr:"nikáō",lang:"gk",gl:"to conquer, overcome",n:"Promised to each of the seven churches — and redefined in chapter 5 by a Lamb who conquers by dying."}],

{q:"Babylon in Revelation functions as:",a:["A cipher for Rome, and for every empire that trades in human lives","The name of a future city","A synonym for the church","A literal reference to Mesopotamia"],c:0,why:"The merchandise list in chapter 18 ends with bodies and human souls, which is the point of the indictment."},
{q:"Axios, worthy, is significant because it was:",a:["A term from temple sacrifice","An acclamation shouted at an emperor's entrance","A legal term for innocence","A greeting between believers"],c:1,why:"Every acclamation in Revelation is taken from one throne and given to another. The songs are political."},
{q:"The new Jerusalem in Revelation 21:",a:["Is a metaphor for the individual soul","Is ascended to by the faithful","Comes down out of heaven from God","Replaces the earth entirely"],c:2,why:"Descent, not escape — the dwelling place of God is with man, which is the tabernacle promise finally kept."},
{q:"Revelation 22 answers Genesis 3 by showing the tree of life:",a:["Destroyed in the final judgement","Transplanted to heaven","Still guarded by cherubim","Open, in the middle of a city, with leaves for the healing of the nations"],c:3,why:"What was guarded is now public, and there is no more curse."}]},

{id:30,phase:6,title:"Synthesis for worship leading",sub:"Leading from the whole story",
aim:"Convert twenty-nine lessons into working practice — a theology of worship you can actually plan a service with.",
sections:[
{h:"Where we are on the arc",p:[
"Every service happens at a specific point in the story: after creation, after the fall, after the exodus, after the cross and resurrection, after Pentecost, and before the city. That location generates everything else.",
"It means the congregation in front of you is genuinely forgiven and genuinely struggling; genuinely indwelt and genuinely tired; living in a world that is genuinely good and genuinely broken. A worship set that only affirms one half of each pair will feel untrue to somebody in the room within about four minutes, and they will conclude that either the songs are dishonest or their experience is illegitimate. Both conclusions are damaging and both are avoidable."]},
{h:"What Scripture's own worship material looks like",p:[
"Take the Psalter as the control sample. Roughly forty percent lament. Substantial thanksgiving, which is narrative and testimonial — I cried and he heard. Hymns that give reasons, always introduced by ki, for. Enthronement psalms that assert God's reign when circumstances contradict it. And hesed as the single most repeated theme in the book.",
"Take Revelation as the other control sample. Worship there is addressed to the Creator and to the Lamb, grounded in a death, sung by every nation, and politically pointed — it takes the empire's acclamations and gives them elsewhere.",
"Between the two, the Bible's own repertoire is more lament-heavy, more narrative, more explicitly reasoned and more corporately political than most contemporary sets. That is not a call to abandon what you sing. It is a call to audit the proportions."]},
{h:"Five practical commitments",p:[
"Sing the whole story, not one chapter. Over a season, a congregation should encounter creation, covenant, exodus, exile, incarnation, cross, resurrection, Spirit and new creation. If your repertoire only covers cross and personal response, the congregation will have a theology that starts at their conversion and stops at their comfort.",
"Give lament a liturgical home. Psalm 88 is in the canon. Make room for the person whose season has not turned, and do it before the crisis rather than during it.",
"Say why. Every biblical hymn gives reasons. Praise attached to reasons teaches; praise detached from reasons is mood management with a backing track.",
"Take craft seriously. Chenaniah was appointed because he was skilful, and Bezalel was the first person filled with the Spirit — for artistry. Skill is not a compromise with the world; it is named in Scripture as a qualification.",
"And remember Amos 5:23 and Ezekiel 10. Excellent music from a community that neglects justice is called noise; a fully functional liturgy can continue in a building the presence has left. Neither text is aimed at people who had stopped trying. Both are aimed at people who were doing it well."]},
{h:"How to keep studying",p:[
"Read whole books at a sitting, out loud where you can. Trace single words through a concordance rather than trusting a gloss. Read the passage in two translations from different philosophies and notice where they diverge — that is where the interpretive decisions are. Always ask what it meant before what it means, and what the genre permits.",
"And keep the habits that shaped these lessons: etymology to find the picture inside a word, history to find the room a text was spoken in, and the whole arc to locate any passage before interpreting it.",
{aside:{t:"The last word",p:"You started this study to lead worship better, and the deepest thing the thirty lessons have to say about that is not a technique. It is that the God being sung to has told a long, patient, costly story about coming to dwell with people — tent, temple, body, church, city. Everything you do on a platform is a small local instance of that. The songs are not the point. The dwelling is."}}]}],

   l.sections.splice(Math.min(s.at,l.sections.length),0,{h:s.h,p:s.p});});
  if(e.words)e.words.forEach(function(nw){
   var ex=null;
   l.words.forEach(function(w){ if(w.tr.toLowerCase()===nw.tr.toLowerCase()) ex=w; });
   if(ex){ /* same term reached twice — keep the fuller note rather than duplicating */
    if((nw.n||"").length>(ex.n||"").length) ex.n=nw.n;
    if(nw.parse&&!ex.parse) ex.parse=nw.parse;
    if((nw.gl||"").length>(ex.gl||"").length) ex.gl=nw.gl;
   } else l.words.push(nw);
  });
  if(e.visual)l.visual=(Array.isArray(l.visual)?l.visual:[l.visual]).concat(e.visual);
  if(e.recap)l.recap=l.recap.concat(e.recap);
  if(e.bridge)l.bridge=e.bridge;
 });
}

 sections:[
 {at:3,h:"Two testaments, one covenant vocabulary",p:[
  "The word testament is an accident of Latin. Hebrew בְּרִית (berith) was rendered into Greek as διαθήκη (diathēkē), and diathēkē in ordinary Greek usage meant a will — the disposition of an estate by someone about to die. Latin took that sense and gave us testamentum. So the two halves of your Bible are named after a legal instrument that only takes effect when somebody dies, which is either a translation drift or the most theologically loaded accident in publishing history. Hebrews 9:16–17 notices, and preaches on it.",
  "The point to hold is that Old and New are not two religions stapled together, nor two ways of being saved. Jeremiah 31:31 promises a חֲדָשָׁה (chadashah) covenant — new — using a word that can mean renewed as well as unprecedented. What is new is not the God, the grace or the goal. What is new is the location: the same instruction, written on hearts rather than stone, with the mediator standing inside the arrangement rather than outside it.",
  "This matters for how you read. Of the Bible's 1,189 chapters, 929 are Old Testament — about three quarters of it, on any way of counting. If you treat it as background material, you have decided that three quarters of what God said was preliminary. The apostles did not read it that way; when Paul says all Scripture is God-breathed, the Scripture he means is what we call the Old Testament."]},
 {at:6,h:"Why one story changes how you read any verse",p:[
  "There is a practical discipline hidden inside the claim that the Bible is one story, and it is worth naming now because every remaining lesson depends on it. Any given text sits inside three widening frames, and a responsible reading checks all three.",
  "The immediate frame is the paragraph and the book: what is this author arguing, to whom, in what genre. The covenantal frame is the stage of the story: is this before Sinai or after, before exile or after, before the cross or after — because the same instruction can carry a different weight at a different point on the line. The canonical frame is the whole arc: what does this look like once you know where the story ends.",
  "Skip the first frame and you get proof-texting. Skip the second and you get people binding Christians to Levitical food law, or dismissing the psalms as sub-Christian. Skip the third and you get a collection of moral tales with no centre.",
  {aside:{t:"A worked example",p:"Take Psalm 137's closing line about infants and rocks. Immediate frame: a communal lament by survivors of an atrocity, quoting the standard imprecation of the ancient world back at the empire that did it to them. Covenantal frame: exile, the moment the covenant curses landed, when Israel had no army, no king and no court — the prayer is a refusal of private revenge in favour of handing it to a judge. Canonical frame: the same canon ends with the nations healed and a man praying for his executioners. All three frames are true at once, and only reading all three keeps you from either endorsing the line or deleting it."}}]}],

2:{bridge:{back:"Lesson 1 said the Bible is one story. This asked whether the copy in your hands is a reliable witness to it.",

 sections:[
 {at:2,h:"What a scroll actually was",p:[
  "Physical facts shape theological ones. A Torah scroll copied by hand takes roughly a year and costs the equivalent of a year's wages. It is written on prepared animal skin, in columns, with no chapter numbers, no verse numbers, no punctuation, and in the earliest periods no spaces between words. It cannot be flicked through; you unroll to a place. When Jesus is handed the scroll in Luke 4 and finds Isaiah 61, the finding is itself a small feat of familiarity.",
  "The New Testament letters were something else entirely — papyrus, cheap, disposable, dictated aloud to a secretary. Paul names his in Romans 16:22: “I, Tertius, who wrote this letter, greet you.” Paul then sometimes takes the pen himself for a closing line, and says so, which is why Galatians 6:11 mentions the size of his handwriting.",
  "Christians were also unusually early and unusually committed adopters of the codex — the bound book rather than the roll. Nearly all surviving second-century Christian manuscripts are codices, while contemporary pagan literature is overwhelmingly on scrolls. A codex is cheaper, holds more, can be searched by turning to a place, and can bind four gospels between two covers. The technology and the theology fit: a movement claiming one story in many documents needed a format that could hold them together."]},
 {at:5,h:"How a variant is actually reasoned about",p:[
  "It is worth walking one example, because the abstract argument convinces nobody. In Mark 1:41, when a leper asks to be cleansed, most manuscripts read σπλαγχνισθείς (splanchnistheis), moved with compassion. A small number read ὀργισθείς (orgistheis), moved with anger.",
  "Compassion is the easier reading. Anger is bizarre — and that is exactly the argument for it. Scribes smooth difficulties; they very rarely create them. No copyist looking at moved with compassion would think to write moved with anger, whereas a copyist looking at anger has an obvious motive to soften it. So the harder reading has a claim, and translations split on it, and your footnote records the disagreement rather than hiding it.",
  "Notice what is and is not at stake. Whether Jesus was angry at the disease, at the system that excluded the man, or at something else, is a real interpretive question with pastoral weight. But no doctrine hangs on it, and the process that surfaces the question is the same process that gives you confidence about the rest. A tradition that had quietly deleted the awkward manuscripts would be less trustworthy, not more."]}],

3:{bridge:{back:"Lesson 2 established that the text is reliable. This asks what the text actually says in its own languages.",
 fwd:"Next: the interpretive habits — genre, covenant and cultural context — that keep those words in their own world."},
 sections:[
 {at:2,h:"The seven stems of the Hebrew verb",p:[
  "Hebrew does something English cannot. The same three-consonant root is poured into seven standard moulds, called binyanim (buildings), and each mould changes the action's voice and intensity. Learn the pattern and a great deal of exegetical fog clears.",
  "Qal is the simple active: he broke. Niphal is the simple passive or reflexive: it was broken. Piel intensifies: he smashed. Pual is its passive: it was smashed. Hiphil is causative: he caused to break. Hophal is its passive: it was made to break. Hitpael is reflexive-intensive: he broke himself, or made himself out to be broken.",
  "This is not trivia. In Genesis 15:6 the verb translated believed is a hiphil — he caused himself to be firm, he put his weight down. In Isaiah 40:1 comfort is a piel imperative, doubled: an intensive command, not a gentle suggestion. When the Psalms say God is exalted, the stem tells you whether he is being exalted by someone or exalting himself. English flattens all of this into one voice.",
  {aside:{t:"How to use this without knowing Hebrew",p:"You do not need to parse verbs to benefit. You need to notice when a good commentary says the stem is significant, and to know what it is claiming. Interlinears and lexicons in most Bible software display the stem. The habit to build is simply: when a verb seems to be carrying unusual weight, check whether the stem is doing work the English cannot show."}}]},
 {at:5,h:"Where word studies go wrong",p:[
  "Etymology is a tool, and like most tools it can be used to injure. James Barr's 1961 book demolished a generation of preaching by naming the fallacies, and they are worth carrying as a checklist because they are all still in circulation.",
  "The root fallacy assumes a word means the sum of its parts or the sense of its historical root. But English nice comes from Latin nescius, ignorant, and means nothing of the kind. Hebrew and Greek words drift too. The etymology is where a word came from, not where it now lives.",
  "Illegitimate totality transfer loads every possible meaning into a single occurrence. Because ruach can mean wind, breath or spirit, a preacher announces that Genesis 1:2 means all three at once. Sometimes a text does play on range deliberately — but that has to be argued from context, not assumed from the lexicon.",
  "The semantic anachronism reads a later meaning back. Greek δύναμις (dynamis) does not mean dynamite; dynamite was named after dynamis in 1867, and Paul was not thinking of nitroglycerine. And the false distinction — insisting agapē is divine love and phileō merely human affection — collapses the moment you notice the Septuagint uses agapē of Amnon's rape of Tamar.",
  "The corrective is simple and unglamorous: meaning is determined by usage in context, and the way to establish usage is a concordance, not a word origin."]}],

4:{bridge:{back:"Lesson 3 gave you the words. This gives you the world they were spoken into.",
 fwd:"Next: the whole arc in one movement, so that any passage can be located on it."},
 sections:[
 {at:3,h:"Chiasm, and why the middle matters",p:[
  "Ancient writers, working in a culture where most people heard rather than read, built texts to be held in the ear. The commonest structural device is chiasm — named for the Greek letter chi, X — in which elements mirror around a centre: A B C B′ A′. Where a modern writer puts the point at the end, an ancient one often puts it in the middle.",
  "Genesis 6–9 is a large-scale example. The flood narrative opens and closes with Noah's sons, moves inward through the covenant, the entering and leaving of the ark, the rising and falling waters — and at the dead centre sits Genesis 8:1: “God remembered Noah.” The structure is making a claim the plot never states outright. In a chapter about the world dissolving, the centre of gravity is that God did not forget.",
  "Smaller chiasms are everywhere once you look. Amos 5:4–6 turns on seek me and live. Isaiah 6:10 mirrors heart, ears, eyes and back out again. Recognising the shape stops you from mining a passage for a favourite verse and missing the load-bearing one."]},
 {at:6,h:"Honour, shame and the ancient household",p:[
  "Western readers instinctively read Scripture through guilt and innocence. The biblical world runs at least as much on honour and shame, and on the household as the basic social unit rather than the individual.",
  "Honour is public worth, granted by a community, and it can be gained, lost, defended or given away. This is why the father in Luke 15 running to meet his son is startling — an elder running required hitching up his robe and exposing his legs, a humiliation taken on deliberately to absorb the shame that would have met the son at the village edge. It is why so many gospel conflicts are conducted as public challenge and riposte, with an audience present and the honour of the questioner at stake. And it is why crucifixion was designed as it was: naked, elevated, on a public road, with a placard. The cross was an instrument of shame before it was an instrument of pain, which is what Hebrews 12:2 means by despising the shame.",
  "The household, בַּיִת (bayit) or οἶκος (oikos), included blood family, in-laws, slaves, freedmen and dependants — often dozens of people. When Acts reports that a jailer believed and was baptised with all his household, this is the unit in view. Much of the New Testament's ethical instruction is addressed to it, and reading those passages as advice to a modern nuclear family misses who was actually in the room.",
  {aside:{t:"Why this changes the reading",p:"Once honour and shame are visible, whole scenes reorganise. The woman with the flow of blood does not merely want healing; she wants to stop being a source of contagion who cannot be touched. Zacchaeus up a tree is a rich man doing something publicly ridiculous. The prodigal's request for his inheritance is a wish that his father were dead, said out loud, in front of the village. None of that is invisible in the text — it is just invisible if you assume the room works like yours."}}]}],

5:{bridge:{back:"Lessons 1 to 4 gave you the tools. This gives you the map they are used on.",
 fwd:"Phase 2 begins the story properly, at the first page: creation, vocation and rest."},
 sections:[
 {at:2,h:"The five covenants as the spine",p:[
  "If the arc is the shape of the story, the covenants are its skeleton. Five major ones structure the Old Testament, and each narrows and deepens what came before rather than replacing it.",
  "With Noah, God binds himself to creation itself: never again to unmake the world, with a sign hung in the sky — a war bow, pointed away. It is universal, unconditional and ecological, and everything after it happens on ground guaranteed by it.",
  "With Abraham, the scope narrows to one family and the promise widens to all families: land, offspring, blessing for the nations. Genesis 15 makes it one-sided; Genesis 17 gives it a sign cut into the body.",
  "At Sinai, the family has become a nation and receives a constitution — not to become God's people but because they already are. This covenant is explicitly conditional in its administration, and Israel's whole subsequent history is a commentary on that clause.",
  "With David, the promise concentrates to one line and one throne, forever. When the throne is emptied in 586 BC, the promise does not die; it becomes expectation.",
  "And Jeremiah 31 announces a new covenant that answers the failure point of Sinai directly: instruction internalised, sin dealt with finally, and everyone from least to greatest knowing God without an intermediary. Jesus picks up a cup and says that this is what he is doing.",
  {aside:{t:"How they relate",p:"Not replacement, but concentration and then explosion. Universal (Noah), to one family (Abraham), to one nation (Sinai), to one line (David), to one man (Christ) — and then outward again to every nation. The narrowest point of the story is a single Jewish man on a Roman cross, and everything before it funnels in and everything after it fans out."}}]},
 {at:6,h:"How the parts hold together",p:[
  "Two connective devices run the whole length of Scripture, and once you can see them the story stops feeling like a sequence of unrelated eras.",
  "The first is typology. A type is a real historical person, institution or event that anticipates a later and greater one — Adam and Christ, Passover and the cross, the temple and the church, Jonah's three days and the resurrection. The New Testament makes these connections explicitly and the Greek word τύπος (typos) means an impression or stamp. Typology is not allegory: it does not dissolve the historical event into a symbol. Melchizedek really met Abraham; the point is that the meeting was shaped like something.",
  "The second is promise and fulfilment. God says something; the story then tests whether he does it. Sometimes fulfilment is immediate, sometimes partial, sometimes at three removes — the promise of land is fulfilled under Joshua, lost in exile, partially regained under Ezra, and reinterpreted in Hebrews as a better country. A promise can be genuinely fulfilled and still be reaching for something larger.",
  "Keeping both in view protects against two errors. Ignore them and the Old Testament becomes a separate religion. Overuse them and every detail becomes a coded prediction, with the shepherd's staff and the ark's dimensions preaching sermons no writer intended. The discipline is to follow the connections the biblical writers themselves draw, and to be cautious about inventing your own."]}],

 {o:"קֶשֶׁת",tr:"qeshet",lang:"he",gl:"bow",n:"The sign given to Noah is a war bow, hung in the clouds pointing away from the earth."},
 {o:"עוֹלָם",tr:"olam",lang:"he",gl:"age, distant time, everlasting",n:"Covenants described as olam — reaching beyond the horizon of sight, not necessarily a philosophical eternity."},
 {o:"πλήρωμα",tr:"plērōma",lang:"gk",gl:"fullness",n:"Galatians 4:4 — when the fullness of time had come. The story has a ripeness, not merely a date."},
 {o:"אַחֲרִית",tr:"acharit",lang:"he",gl:"latter end, outcome",n:"The prophets' phrase for where the story is going — the after-part, not the abolition of history."}],

6:{bridge:{back:"Phase 1 gave you the tools and the map. Here the story starts, and it starts in a sanctuary.",
 fwd:"Next: what happens when the priest in the garden decides he would rather be the one who defines good."},
 sections:[
 {at:3,h:"The seven-day frame as a claim about time",p:[
  "The week is not a natural unit. Days come from the earth's rotation, months roughly from the moon, years from the orbit — but nothing in the sky produces seven. The week is a purely theological invention, and Israel's neighbours did not keep one. Babylon marked unlucky days on a lunar cycle; Egypt ran ten-day decades. A repeating seven-day rhythm culminating in rest, imposed on everyone including servants, animals and resident foreigners, was without parallel.",
  "That is worth sitting with. Israel's most successful export is arguably not a doctrine but a calendar. The seven-day week is now near-universal, and it exists because a small people insisted that time itself had a shape, and that the shape ended in rest rather than production.",
  "The rhythm scales. Seven days gives the sabbath. Seven years gives the sabbatical year, when land rests and debts are released. Seven sevens gives the jubilee, when land returns and slaves go free. The same number governs the day, the field and the economy, and the direction is always toward release. Leviticus 25 is Genesis 1 applied to property law."]},
 {at:5,h:"Made from dust, filled with breath",p:[
  "Genesis 2:7 is deliberately physical. God forms — יָצַר (yatsar), the verb used of a potter working clay — the man from עָפָר (afar), the dust of the ground. There is a pun the English cannot carry: אָדָם (adam), human, from אֲדָמָה (adamah), ground. Earthling from earth. Then God breathes into his nostrils the breath of life, and the man becomes a living נֶפֶשׁ (nefesh).",
  "Notice what the verse does not say. It does not say the man was given a soul. It says he became one. Biblical anthropology is not a soul temporarily housed in a body; it is an animated body, dust plus breath, and when the breath departs the psalmist says the person returns to dust. This is why the biblical hope is resurrection rather than escape — if you are your body, then salvation has to include it.",
  "And the same combination recurs at every hinge of the story. Ezekiel 37 has dry bones assembled, covered with flesh, and then standing only when the ruach enters them. John 20 has the risen Christ breathe on the disciples with the same verb the Septuagint uses in Genesis 2:7. Acts 2 has a sound like a violent wind fill a house. The pattern is consistent: God's people are always dust that has been breathed into."]},
 {at:8,h:"What the account is not answering",p:[
  "Genesis 1 has been made to bear a great deal of weight in arguments it was not written to settle, and a study aiming at depth should be honest about the state of the discussion rather than pretending it is closed.",
  "There are several serious Christian readings. Young-earth creationism takes the days as consecutive twenty-four-hour periods and the earth as recent. Old-earth or day-age readings take the days as long periods. The framework view reads days 1–3 and 4–6 as a literary structure rather than a chronology. John Walton's functional or cosmic-temple reading argues the account concerns the assignment of function and the inauguration of a temple, and is not addressing material origins at all. Evolutionary creation holds that God worked through the processes biology describes.",
  "These are not all equally well supported, and readers hold them with different degrees of conviction. What can be said with confidence is what the text is manifestly interested in: that there is one God and not many; that he made everything and it is good; that the sun and moon are objects, not deities; that humanity as a whole bears his image and is given a vocation; and that the goal is rest. Every reading listed above affirms all of that.",
  {aside:{t:"A note on how to argue",p:"The most common failure here is not choosing the wrong position but arguing as though the text obviously teaches yours and only bad faith explains the others. It does not settle the mechanism question as cleanly as any camp claims. Holding a view firmly and holding it humbly are compatible, and this is a good place to practise both."}}]}],

 {o:"יָצַר",tr:"yatsar",lang:"he",gl:"to form, to shape as a potter",n:"Genesis 2:7. Hands in clay, not a word from a distance — a different register from chapter 1's speech.",parse:"Qal imperfect with vav consecutive, 3ms."},
 {o:"אָדָם / אֲדָמָה",tr:"adam / adamah",lang:"he",gl:"human / ground",n:"An untranslatable pun. Earthling from earth — identity and origin in one sound."},
 {o:"עֵזֶר כְּנֶגְדּוֹ",tr:"ezer kenegdo",lang:"he",gl:"a help corresponding to him",n:"Ezer elsewhere describes God helping Israel — it carries no subordination. Kenegdo means facing, matching, opposite."},
 {o:"טוֹב מְאֹד",tr:"tov me'od",lang:"he",gl:"very good",n:"Pronounced only after humanity is included. The verdict is on the whole system working together, not on parts."},
 {o:"רָקִיעַ",tr:"raqia",lang:"he",gl:"expanse, beaten-out surface",n:"From a root meaning to hammer thin. Ancient cosmology pictured a solid dome; the text uses its readers' physics."}],

 {type:"flow",title:"Seven scales up",caption:"The same number governs the day, the field and the economy — and always moves toward release.",
  steps:[{n:"Seventh day",s:"sabbath — rest for all, including servants"},{n:"Seventh year",s:"land rests, debts released"},{n:"Seven sevens",s:"jubilee — land returns, slaves freed"},
  {n:"Seven weeks",s:"Shavuot, the firstfruits harvest"},{n:"Seventh month",s:"trumpets, atonement, booths"}]},
 {type:"columns",title:"Readings of Genesis 1 held by serious Christians",caption:"They disagree about mechanism and agree about everything the text emphasises.",
  cols:[{h:"Chronological readings",s:"the days as periods of time",items:["Young earth: six consecutive ordinary days","Day-age: each day a long epoch","Both read the sequence as history","Differ on the age of the earth"]},
  {h:"Literary and functional",s:"the days as structure or inauguration",items:["Framework: 1–3 form, 4–6 fill","Cosmic temple: assigning function, not matter","Neither denies God as creator","Walton's reading is influential and contested"]},

 recap:["The seven-day week has no basis in astronomy — it is a theological claim about time that the world adopted.",
 "Adam from adamah: the human is dust that has been breathed into, and becomes a nefesh rather than receiving one.",

7:{bridge:{back:"Lesson 6 left a priest in a garden with a vocation and a rest to enter.",
 fwd:"Next: God's answer to Babel — one man called out of it, and a promise aimed at every family scattered there."},
 sections:[
 {at:2,h:"The anatomy of the first temptation",p:[
  "Read slowly, the serpent's method is a recognisable four-step sequence, and it recurs throughout Scripture and throughout ordinary life.",
  "First, question the word: did God actually say. Not denial — enquiry, which feels like open-mindedness. Second, distort it: you shall not eat of any tree, an exaggeration that makes generosity look like meanness. Note that Eve corrects the exaggeration and then adds her own clause, neither shall you touch it, which God never said. Once both parties are editing, the text has moved from what God said to what we think he meant.",
  "Third, deny the consequence: you will not surely die. Fourth, impute a motive: God knows that when you eat, you will be like him. The final move is the deepest, because it makes God the rival rather than the giver. Everything after that is inevitable — the fruit is only the mechanism.",
  "The pattern is worth learning because Jesus faces the same structure in the wilderness and answers it differently. The tempter again quotes Scripture, again distorts it, again offers a shortcut to something genuinely good — bread, safety, the kingdoms of the world, all of which will in fact be his. And Jesus answers each time not with argument but by locating himself inside the text: it is written. Where Eve added to the word, he stands on it exactly."]},
 {at:5,h:"Two genealogies and a hinge",p:[
  "Genesis 4 and 5 place two family lines side by side, and the comparison is the argument.",
  "Cain's line, in chapter 4, is culturally magnificent. It builds the first city, invents tents and livestock, and produces the first musicians — Jubal, father of all who play the lyre and pipe — and the first metalworkers. Civilisation, art and technology all begin here. And the line culminates in Lamech, who takes two wives and sings a poem boasting that he killed a young man for wounding him, and that if Cain is avenged sevenfold, Lamech will be avenged seventy-sevenfold. Culture flourishes and violence escalates in the same paragraph, which is a sober observation about progress.",
  "Seth's line, in chapter 5, builds nothing memorable. It just keeps going, and each entry ends with the toll of and he died. Except one: Enoch walked with God, and he was not, for God took him. In a chapter that is a drumbeat of mortality, one man does not finish the sentence.",
  "And then Genesis 4:26 supplies the hinge that the escalation is measured against: at that time people began to call on the name of the LORD. Against Lamech's boast, worship begins.",
  {aside:{t:"Seventy-sevenfold, again",p:"In Matthew 18:21 Peter asks how often he must forgive, offering seven times as a generous maximum. Jesus answers seventy-seven times — the exact figure of Lamech's boast, inverted. The arithmetic of vengeance is met by an identical arithmetic of forgiveness. Peter, who knew his Torah, would have heard it."}}]}],

 {o:"אַף כִּי־אָמַר",tr:"af ki amar",lang:"he",gl:"did God really say?",n:"The serpent's opening. An interrogative particle that turns a gift into a suspicion."},
 {o:"תְּשׁוּקָה",tr:"teshuqah",lang:"he",gl:"desire, urge toward",n:"Genesis 3:16 and 4:7 — sin's teshuqah is for Cain, and he must rule it. The parallel shapes how 3:16 is read."},
 {o:"נוֹד",tr:"Nod",lang:"he",gl:"wandering",n:"Cain settles in the land of Wandering — a name that cancels the verb. Exile with an address."},
 {o:"הִתְהַלֵּךְ",tr:"hithallekh",lang:"he",gl:"to walk about with",n:"Hitpael of halakh, used of Enoch and Noah, and of God in the garden. Companionship, not a journey.",parse:"Hitpael perfect, 3ms — reflexive-iterative: walked back and forth with."},
 {o:"כָּפַר",tr:"kaphar",lang:"he",gl:"to cover, to pitch with tar",n:"Genesis 6:14 — Noah covers the ark with pitch. The same root becomes the word for atonement."}],

8:{bridge:{back:"Babel wanted a name and feared scattering. Genesis 12 answers both, to one man.",
 fwd:"Next: that family becomes a nation, and God gives himself a name to go with it."},
 sections:[
 {at:2,h:"What Abraham left",p:[
  "Ur of the Chaldeans was not a backwater. In the early second millennium it was a major Sumerian city with monumental architecture, a literate bureaucracy, international trade and a great ziggurat to the moon god Nanna. Haran, where the family stops, was also a centre of moon worship. Joshua 24:2 says it plainly: “your fathers lived beyond the Euphrates, and they served other gods.”",
  "So the call is not a religious man receiving confirmation. It is a moon-worshipper's son being addressed by a God he has no framework for, and asked to leave a functioning civilisation for a land he has not seen. Hebrews 11:8 notices the detail that makes it costly: he went out, not knowing where he was going.",
  "The three things he is told to leave are in a deliberate order — country, kindred, father's house — moving from the widest circle of security to the narrowest and most personal. In a world without states, insurance or law enforcement, the father's house was your entire safety net. Leaving it was closer to renouncing citizenship, employment and family in one act."]},
 {at:5,h:"The pattern of the promise being endangered",p:[
  "Genesis has a rhythm that only becomes visible once you read it as a whole book. God makes a promise; the promise is then repeatedly put at risk, usually by the very people carrying it; and it survives anyway.",
  "Sarah is barren. Abraham twice passes her off as his sister to foreign kings, putting the mother of the promise into another man's household — and it happens a third time with Isaac and Rebekah. Hagar and Ishmael are an attempt to secure the promise by ordinary means. Isaac is nearly sacrificed. Rebekah is barren. Jacob steals the blessing and flees. Joseph is sold by his brothers and the family nearly starves.",
  "The cumulative effect is an argument. If the promise depended on the competence or virtue of the family carrying it, it would have died in chapter 12 and again in almost every chapter since. Joseph states the conclusion himself in Genesis 50:20: you meant evil against me, but God meant it for good. The book has spent thirty-eight chapters demonstrating the sentence before anyone says it.",
  {aside:{t:"Why Genesis 15 answers Genesis 12",p:"Abraham has just won a battle and refused a reward, and God's first word to him is fear not. Then he asks the honest question — what will you give me, for I continue childless — and God takes him outside to count stars. The covenant ceremony that follows is God's answer to a man who believes and still wants to know. That is not a rebuke of doubt; it is an accommodation of it."}}]}],
 words:[
 {o:"אוּר כַּשְׂדִּים",tr:"Ur Kasdim",lang:"he",gl:"Ur of the Chaldeans",n:"A major Sumerian city with a great ziggurat to the moon god. Abraham leaves civilisation, not obscurity."},
 {o:"מִשְׁפָּחָה",tr:"mishpachah",lang:"he",gl:"clan, kindred",n:"The middle circle Abraham must leave — and the word used of all the families of the earth who will be blessed."},
 {o:"גֵּר",tr:"ger",lang:"he",gl:"resident foreigner, sojourner",n:"Abraham's status in the land he is promised. Israel's later law protects the ger by appealing to this memory."},
 {o:"עֲקֵדָה",tr:"Aqedah",lang:"he",gl:"the binding",n:"Jewish tradition names Genesis 22 after the binding, not the sacrifice — the emphasis falls on what was not completed."},
 {o:"בִּטָּחוֹן",tr:"bittachon",lang:"he",gl:"trust, security",n:"From batach, to lean one's weight. What Abraham transfers from his father's house to a promise."}],

 "Country, kindred, father's house — the order strips security from the outside inward.",
 "Genesis endangers the promise in almost every chapter, usually through the family carrying it.",

9:{bridge:{back:"A family of seventy went down to Egypt. Four centuries later they are a nation of slaves.",
 fwd:"Next: what that rescued people is given at the mountain — and the tent God asks them to build."},
 sections:[
 {at:2,h:"Four hundred years of silence, and a midwife's disobedience",p:[
  "Between Genesis 50 and Exodus 1 lies a gap the text does not narrate. A family becomes a people; a welcome becomes an enslavement; and God, so far as the record goes, says nothing. Exodus 2:23–25 breaks it with four verbs stacked deliberately: God heard their groaning, God remembered his covenant, God saw the people of Israel, and God knew. Nothing has happened yet. The rescue begins with attention.",
  "The first act of resistance in the book is not Moses. It is Shiphrah and Puah, two midwives ordered to kill Hebrew boys at birth, who simply do not, and then lie to Pharaoh's face about why. The text says God dealt well with the midwives and gave them households of their own. Two women whose names are recorded while Pharaoh's is not are the first people in Scripture to defy a state on moral grounds, and the narrator approves.",
  "Then Moses' mother hides him in a תֵּבָה (tevah) — the identical word used for Noah's ark, and used nowhere else in the Hebrew Bible. A vessel of rescue, waterproofed with pitch, carrying the future through water that was meant to kill. Exodus is signalling from its second chapter that this is a new creation story."]},
 {at:6,h:"The sea, and what Israel is asked to do",p:[
  "The crossing is the centre of the book and the reference point for everything after. Trapped between an army and water, the people do what people do, and blame Moses with one of the bitterest lines in Scripture: were there no graves in Egypt, that you brought us out to die in the desert?",
  "Moses' answer is worth noticing: stand firm, and see the salvation of the LORD; the LORD will fight for you, and you have only to be silent. Then God's reply to Moses is equally worth noticing: why do you cry to me? Tell the people to go forward. Both stand still and go forward are commanded within three verses, and the tension is not a contradiction. They are told to stop trying to save themselves and to start walking into the impossible thing.",
  "The narrative then describes the waters divided and dry land appearing — Genesis 1 vocabulary, deliberately. A wind blows over the waters, the sea is separated, dry ground emerges, and a people walk out into a new existence. Israel is not merely freed; Israel is created.",
  "And the response is the Song of the Sea in Exodus 15, the oldest poetry in the Bible by most reckonings, sung by Moses and then taken up by Miriam with a tambourine. Israel's first recorded act as a free people is congregational worship, led by a woman with a percussion instrument, celebrating a rescue they contributed nothing to."]}],
 words:[
 {o:"תֵּבָה",tr:"tevah",lang:"he",gl:"ark, chest, basket",n:"Used only of Noah's ark and Moses' basket. Both waterproofed, both carrying the future through lethal water."},
 {o:"וַיֵּדַע אֱלֹהִים",tr:"vayeda Elohim",lang:"he",gl:"and God knew",n:"Exodus 2:25. The fourth of four verbs — heard, remembered, saw, knew. Rescue begins with attention."},
 {o:"שִׁפְרָה וּפוּעָה",tr:"Shiphrah and Puah",lang:"he",gl:"the midwives' names",n:"Recorded, while the Pharaoh they defied is not. The first recorded civil disobedience in Scripture."},
 {o:"מַצָּה",tr:"matzah",lang:"he",gl:"unleavened bread",n:"Bread with no time to rise. The taste of haste, eaten annually to remember a departure at speed."},
 {o:"סְגֻלָּה",tr:"segullah",lang:"he",gl:"treasured possession",n:"Exodus 19:5. A king's personal treasure, distinct from the state holdings — held close, not merely owned."}],
 visual:[
 {type:"compare",title:"Exodus written as a new creation",caption:"The vocabulary is deliberate. Israel is not only freed; Israel is made.",
  left:{h:"Genesis 1",s:"the world made",items:["Darkness over the deep","A wind from God over the waters","Waters separated","Dry land appears","A people given a vocation"]},
  right:{h:"Exodus 14",s:"a people made",items:["Darkness between the camps all night","A strong east wind all night","The waters divided","They walked on dry ground","A nation given a covenant"]}},
 {type:"stack",title:"Four verbs that begin the rescue",caption:"Exodus 2:24–25. Nothing has happened yet — and everything has.",
  layers:[{n:"God heard",s:"their groaning"},{n:"God remembered",s:"his covenant with Abraham, Isaac and Jacob"},{n:"God saw",s:"the people of Israel"},{n:"And God knew",s:"the verb stops without an object"}]}],
 recap:["Exodus 2 breaks four centuries of silence with four verbs: heard, remembered, saw, knew.",
 "Shiphrah and Puah are named; the Pharaoh they defied is not.",
 "Moses' basket is a tevah — the word used only of Noah's ark. Rescue through lethal water, again.",
 "Israel is told to stand still and to go forward within three verses; both are true.",
 "Their first act as free people is a song, taken up by Miriam with a tambourine."]},

10:{bridge:{back:"They walked out of the sea as a rescued people. Sinai tells them what rescued people look like.",
 fwd:"Phase 3: the land is entered, a king is demanded, and the covenant's conditional clause begins to bite."},
 sections:[
 {at:2,h:"Reading the Ten Words as a shape",p:[
  "The Ten Words are not a random list. They divide into two tables — the first four concerning God, the last six concerning neighbour — which is why Jesus can summarise the whole law in two commands and be quoting rather than innovating.",
  "The order within each table moves from the interior outward. First: no other gods — the question of allegiance. Second: no images — the question of representation, and note it is not a second god being forbidden but a wrong way of picturing this one. Third: the name not carried in vain — נָשָׂא (nasa) means to lift or carry, so the command is closer to not bearing God's name emptily than to swearing. Fourth: sabbath.",
  "The second table likewise: honour parents, the hinge between the two tables and the only command with a promise attached; then life, marriage, property, truth; and finally coveting, which is the only one that no court can prosecute. The list ends inside the person, which means it was never merely a legal code. Paul says exactly this in Romans 7 — it was the tenth commandment that undid him.",
  {aside:{t:"Two numberings",p:"Jewish, Catholic, Lutheran and Reformed traditions divide the ten differently — some count the prologue as the first word, some merge the prohibitions of other gods and images, some split coveting in two. The content is identical; the numbering is not. If you ever find a discussion where people are talking past each other about the second commandment, this is usually why."}}]},
 {at:6,h:"The golden calf, and what it was actually for",p:[
  "Exodus 32 happens while Moses is on the mountain receiving instructions for the tabernacle. The people ask Aaron to make gods to go before them, he collects their gold, and produces a calf. Aaron then announces a feast — to the LORD.",
  "This is the crucial detail. They are not converting to another religion. They are worshipping the God who brought them out of Egypt, using an image, in a form their neighbours would recognise, on a schedule Aaron set. It is a breach of the second word, not the first. And it happens in the exact narrative gap where God is describing how he wants to be approached.",
  "The literary placement is devastating and deliberate. Chapters 25 to 31 are God's instructions for a sanctuary; chapter 32 is the people building their own; chapters 35 to 40 are the instructions carried out. Israel's impatience produces a counterfeit of the very thing being given.",
  "Then Moses intercedes, and the exchange in Exodus 33 is one of the most extraordinary in Scripture. God offers to send an angel and not go himself. Moses refuses: if your presence does not go with us, do not bring us up from here. He would rather have the wilderness with God than the promised land without him. And it is immediately after this that God passes by and proclaims the formula of Exodus 34:6–7 — compassionate, gracious, slow to anger, abounding in hesed. The most quoted description of God's character in the Old Testament is given in the aftermath of the worst thing Israel had yet done."]}],
